 {t:"¿Por qué yo?",r:"«Eso mismo pregunté yo cuando me dieron tu expediente. Ahora baja. Y vigila al encapuchado»."},
 {t:"¿El encapuchado? ¿El de los pitillos?",r:"San Pedro se pone serio: «No fumes nada más que te dé. Y no le pierdas de vista». Te empuja suavemente hacia una nube con forma de tobogán."},
 {t:"¿Y si prefiero quedarme aquí?",r:"«Aquí no hay wifi ni bares». Bajas por voluntad propia."}]},
{id:"pedro_profecia",chain:1,st:[1,2,3,4],c:"pedro",q:"He conseguido leer otro trozo de la profecía. Dice: «Y la voz desafinará en el momento justo, y el mundo contendrá el aliento». Los teólogos creen que eres tú. Los musicólogos, que no.",opts:[
 {t:"¿Qué momento justo?",r:"«Si lo supiera, no estaría aquí repartiendo resurrecciones como churros». Te da un sello en la mano y te manda abajo."},
 {t:"Yo no desafino.",r:"San Pedro pone una grabación tuya de 2019. Te callas. Bajas en silencio."},
 {t:"¿Puedo leer la profecía?",r:"Te la enseña. Es una servilleta del Bar Pepe con una mancha de calamar. No entiendes nada. Él tampoco."}]},
{id:"pedro_apuestas",chain:1,st:[1,2,3,4],c:"pedro",q:"Tu muerte de hoy la ha visto todo el cielo en pantalla gigante. Hay apuestas sobre la siguiente. El arcángel Gabriel lleva ganadas veinte nubes.",opts:[
 {t:"¿A qué ha apostado?",r:"«A que la próxima vez te mata tu cuñado. Paga a cuarenta a uno». Te despide con un guiño preocupante."},
 {t:"Quiero apostar yo.",r:"«Los muertos no apuestan. Bueno, los muertos de verdad. Tú eres un caso administrativo». Sello, firma y abajo."},
 {t:"Qué vergüenza.",r:"«Peor fue lo de Elvis. Venga, para abajo, que hay cola»."}]},
{id:"pedro_encapuchado",chain:1,st:[1,2,3,4],c:"pedro",q:"El encapuchado ha vuelto a pasar por aquí. Siempre pregunta por ti. Nunca se queda a tomar café. Huele a incienso y a gasolina, y me deja la nube perdida de ceniza.",opts:[
 {t:"¿Qué quiere de mí?",r:"«Lo mismo que yo, creo. Pero con más prisa». San Pedro barre la ceniza mientras te desvaneces."},
 {t:"¿Es peligroso?",r:"San Pedro tarda demasiado en contestar «no». Bajas con un mal presentimiento."},
 {t:"¿Tiene cara?",r:"«Tiene. Pero no se la enseña a cualquiera. A ti te la enseñará cuando estés preparad[o|a]»."}]},
{id:"pedro_kira",chain:1,st:[1,2,3,4],c:"pedro",q:"Te voy a contar algo que no debería: en el archivo hay otro expediente casi tan gordo como el tuyo. El de Kira Star. Ella también tiene que ver con el fin del mundo. No sé si para salvarlo o para provocarlo.",opts:[
 {t:"¡Lo sabía!",r:"«No lo sabías. Pero te dejo creerlo, que hoy has tenido un mal día»."},
 {t:"¿Estamos en el mismo bando?",r:"«La profecía no lo aclara. Tiene muy mala letra». Cierra el archivo de golpe. Del cajón sale purpurina."},
 {t:"¿Puedo cargármela yo primero?",r:"«No. Y te he visto pensarlo. Apunto tres avemarías». Te pone una multa celestial y te manda abajo."}]},
{id:"pedro_cancion",chain:1,st:[1,2,3,4],c:"pedro",q:"Arriba están nerviosos. Dicen que el fin del mundo empezará con una canción. Una canción que todavía no se ha escrito. Unos creen que la escribirás tú. Otros, que tu cuñado.",opts:[
 {t:"¿Mi cuñado?",r:"«Ya. A mí también me da miedo». San Pedro se santigua dos veces."},
 {t:"Entonces no la escribo.",r:"«Ojalá fuera tan fácil. Las canciones se escriben solas cuando quieren»."},
 {t:"¿Y si la canto mal a propósito?",r:"San Pedro te mira un buen rato. «Eso… podría funcionar. Olvida que te lo he dicho»."}]},
{id:"pedro_mudanza",chain:1,st:[1,2,3,4],c:"pedro",q:"Perdona el desorden, estamos de mudanza. Si el mundo se acaba, el cielo cierra: sin preaviso y sin indemnización. Así que, por la cuenta que nos trae a todos, intenta no morirte tan a menudo.",opts:[
 {t:"Lo intentaré.",r:"«Eso dijiste la última vez. Y la anterior. Y la anterior». Te da una palmadita y caes."},
 {t:"¿Adónde os mudáis?",r:"«A un bajo en el purgatorio. Sin ascensor». Suspira. Tú también."},
 {t:"¿Necesitáis ayuda con las cajas?",r:"Cargas tres cajas de aureolas. Al despertar abajo, aún te duelen los brazos. Agujetas celestiales."}]},

/* ---------- De vuelta en la Tierra: quién te recibe ---------- */
{id:"rev_manolo",chain:1,st:[1,2,3,4],c:"manolo",q:"Te puse una vela en la barra, al lado de los mejillones. Ya decía yo que esos mejillones se movían.",opts:[
 {t:"Comerme un mejillón por los viejos tiempos.",fx:{s:-5,o:5},r:"Sobrevives. Esta vez. Manolo te mira con orgullo y miedo a partes iguales."},
 {t:"Un café, Manolo.",fx:{s:3},r:"Te lo pone con la vela todavía encendida al lado. No la apaga. «Por si acaso»."},
 {t:"Apagar la vela.",fx:{o:-3,h:3},r:"Manolo la vuelve a encender en cuanto te giras."}]},
{id:"rev_toni",chain:1,st:[1,2,3,4],c:"toni",q:"Hombre, el muerto. Ya había repartido a tus clientes… digo, tus cosas. ¿Algo para celebrar que vuelves?",opts:[
 {t:"Hoy no, Toni.",fx:{s:5},r:"Toni asiente con respeto. «La resurrección es mejor sin aditivos», concede."},
 {t:"Un poquito, para el susto.",fx:{h:5,s:-5},f:{drogas:1},r:"Un poquito se convierte en una noche entera. Resucitar da mucha sed."},
 {t:"Contarle lo del cielo.",fx:{o:-3},r:"Toni asiente: «Yo también he estado. Pero en el de las rebajas»."}]},
{id:"rev_salas",chain:1,st:[1,2,3,4],c:"salas",q:"Te declaré muert[o|a] a las 3:47. Ahora tengo que explicarle a mi jefe por qué estás de pie en mi consulta.",opts:[
 {t:"Pedirle un chequeo.",fx:{s:10,d:-5},r:"Todo bien, salvo que no tienes pulso los jueves. Te recomienda no preocuparte. Ella sí se preocupa."},
 {t:"Ofrecerle mi caso para un congreso.",fx:{h:10},r:"La Dra. Salas presenta «El paciente que no se quedaba muerto». Ovación. Te usan de diapositiva."},
 {t:"Irme sin pagar la consulta.",fx:{d:5,o:-5},r:"Te persigue por el pasillo con el talonario. Corre más rápido que tú."}]},
{id:"rev_paco",chain:1,st:[1,2,3,4],c:"paco",q:"¡Tengo la exclusiva de tu resurrección! ¿Posas, o la publico con tu cara de recién resucitad[o|a]?",opts:[
 {t:"Posar con dignidad.",fx:{h:10},r:"Portada: «HA VUELTO». La foto es buena. Sales con un brillo celestial que no sabes explicar."},
 {t:"Pagarle para que no la publique.",fx:{d:-10},r:"Te vende los negativos. Y una copia de seguridad «por si vuelves a morirte»."},
 {t:"Hacerme el muerto otra vez.",fx:{h:5,o:-3},r:"Te quedas quiet[o|a] en la acera. Paco te hace una foto igualmente. Titular: «Ni resucitar sabe»."}]},
{id:"rev_tito",chain:1,st:[1,2,3,4],c:"tito",q:"¡Hombre! ¡Ya decía yo que tú no te ibas sin pagar la última ronda!",opts:[
 {t:"Pagar la ronda.",fx:{d:-5,o:5},r:"Pagas la ronda. Y la de tu funeral, que también se te había quedado a deber."},
 {t:"Invitas tú, Tito.",fx:{o:-3,s:3},r:"El Tito se ríe tanto que se le cae el palillo. No invita."},
 {t:"Una caña por la resurrección.",fx:{h:3,s:-3},f:{alcohol:1},r:"Brindáis por la vida. El Tito brinda también por la muerte, por si acaso."}]},
{id:"rev_herrera",chain:1,st:[1,2,3,4],c:"herrera",q:"Tu testamento ya se había leído. Tu cuñado se quedó la tele y tu madre, los discos. Recuperarlo todo va a costar un juicio.",opts:[
 {t:"Pleitear por la tele.",fx:{d:-10,h:5},r:"Ganas el juicio. La tele vuelve con una pegatina de tu cuñado que no sale ni con aguarrás."},
 {t:"Dejarlo todo como está.",fx:{o:10,d:-5},r:"Tu familia te quiere más ahora que no les quitas nada. Es la primera vez."},
 {t:"Pedir que me devuelvan las flores del funeral.",fx:{d:3,o:-5},r:"Te devuelven tres coronas mustias. Una dice «Siempre en nuestro corazón, Kira»."}]},
{id:"rev_chema",chain:1,st:[1,2,3,4],c:"chema",q:"Ya había buscado otr[o|a] cantante. Canta peor que tú. Bueno… igual. ¿Vuelves?",opts:[
 {t:"Vuelvo, y que se quede de corista.",fx:{h:5,o:5},r:"El nuevo hace los coros con rencor. Suena sorprendentemente bien."},
 {t:"Despedir al sustituto.",fx:{o:-5,h:3},r:"Se va dando un portazo. Funda un grupo de tributo a ti. Tiene más bolos que tú."},
 {t:"Abrazar a Chema.",fx:{s:5,o:3},r:"Chema llora. Te dice que el sustituto no sabía ni dónde estaba el bombo."}]},
{id:"rev_jessica",chain:1,st:[1,2,3,4],c:"jessica",q:"¡LO SABÍA! Le he rezado a tu altar todas las noches. ¿Ves cómo funciona?",opts:[
 {t:"Darle las gracias.",fx:{o:5,s:-3},r:"Jessica añade una vela más al altar. Ahora el altar tiene licencia de actividad."},
 {t:"Pedirle que me enseñe el altar.",fx:{h:5,s:-5},r:"Hay fotos tuyas que ni tú sabías que existían. Una es de mañana."},
 {t:"Pedirle que rece un poco menos.",fx:{s:5,o:-3},r:"«Imposible», dice. «Ahora sé que funciona»."}]},

/* ---------- Al resucitar ---------- */
{id:"rev_benito",chain:1,st:[1,2,3,4],c:"benito",q:"¡Te enterré el martes! ¿Te importa si cuento lo de tu resurrección en la homilía del domingo? Es temporada baja.",opts:[
 {t:"Cuéntalo, padre.",fx:{h:10,o:5},r:"La iglesia se llena. Benito cobra entrada. Tú no ves un euro, pero bendicen tu coche."},
 {t:"Mejor que no se sepa.",fx:{o:3},r:"Benito guarda el secreto. Bueno, se lo cuenta a la del bingo. Lo sabe todo el barrio."},
 {t:"Que cobre entrada a los fieles y vamos a medias.",fx:{d:10,o:-10},r:"Negocio redondo. El obispo pide su parte. San Pedro, también."}]},
{id:"rev_forense",chain:1,st:[1,2,3,4],c:"forense",q:"Te firmé el certificado de defunción. Ahora tengo que anularlo. ¿Sabes el papeleo que es eso?",opts:[
 {t:"Lo siento mucho.",fx:{o:3},r:"No lo acepta. Te pide que, la próxima vez, te mueras con menos burocracia."},
 {t:"Fírmame otro, por si acaso.",fx:{h:5,s:-5},r:"Lo firma sin fecha. Lo guarda en un cajón con tu nombre. El cajón es bastante grande."},
 {t:"Invitarle a cenar para compensar.",fx:{d:-5,s:5},r:"Se pasa la cena tomándote el pulso. Por curiosidad profesional."}]},
{id:"rev_mama",chain:1,st:[1,2,3,4],c:"mama",q:"¡Hij[o|a]! Ya había alquilado tu habitación a un estudiante de Erasmus. Pasa, pero no hagas ruido, que está estudiando.",opts:[
 {t:"Abrazarla fuerte.",fx:{o:5,s:5},r:"Te abraza, te pellizca para comprobar que eres real y te recuerda lo del táper."},
 {t:"Echar al de Erasmus.",fx:{s:5,o:-5},r:"Se llama Hans. Se queda igualmente. Ahora es tu hermano."},
 {t:"Pedirle que me devuelva lo del funeral.",fx:{d:10,o:-10},r:"Te devuelve el dinero de las flores. Menos las que le gustaron, que se las ha quedado."}]},
{id:"rev_kira",chain:1,st:[1,2,3,4],c:"kira",q:"Ya había cantado en tu funeral. Lloré y todo. ¿Me devuelves las flores, o al menos los seguidores?",opts:[
 {t:"Darle las gracias.",fx:{o:5},r:"Se queda descolocada. La amabilidad le da alergia. Le sale un sarpullido."},
 {t:"Cantar juntas «Volví del más allá».",fx:{h:15,o:-3},r:"El dueto es número uno. Ninguna de las dos lo reconoce en público."},
 {t:"Acusarla de haberme matado.",fx:{h:15,o:-10},r:"No hay pruebas. Pero su cara de sorpresa no convence a nadie. Te frotas las manos."}]},
{id:"rev_cunado",chain:1,st:[1,2,3,4],c:"cunado",q:"Hombre, ¿tú no estabas muert[o|a]? Es que ya había vendido tu coche. Por lo de la herencia, ¿sabes?",opts:[
 {t:"Exigirle el dinero.",fx:{d:10,o:-5},r:"Te paga la mitad. La otra mitad «se la ha gastado en tu memoria». En una barbacoa."},
 {t:"Dejarlo estar. Es familia.",fx:{o:5,s:-3},r:"Te invita a la barbacoa que hizo con tu dinero. La carne está buena. Te fastidia."},
 {t:"Fingir que soy un fantasma y asustarle.",fx:{h:10,s:5},r:"Huye en tu coche. El coche que ya no es tuyo. Te ríes durante una semana."}]}
];
const byId=Object.fromEntries(EV.map(e=>[e.id,e]));
/* Personajes y amenazas que te persiguen también en las etapas 3 y 4 */
const EXTRA_ST={toni_rep:[3,4],mama_rep:[3,4],ruiz:[3,4],guru:[3],guru_2:[3,4],bruno_dm:[3],gasolinera:[3,4],nazi_ruedas:[3,4],toni_moldavia:[3,4],forense:[3,4],hater:[3,4],mariano:[3],mariano_2:[3,4],kira_venganza:[3,4],afterparty:[3],yate:[3],paparazzi:[3],tuit:[3,4],cola:[3],fausto:[3],maripili:[3],nodulos:[3,4]};
for(const id in EXTRA_ST) byId[id].st.push(...EXTRA_ST[id]);
/* La etapa de top mantas (id 5) hereda todo lo que vive a la vez en el primer éxito y en el estrellato */
for(const e of EV) if(e.st.includes(2)&&e.st.includes(3)&&!e.st.includes(5)) e.st.push(5);

 for(const [k,ic] of STATS){
  const v=S.st[k];
  if(v<=30){const who=pool.filter(e=>e.opts.some(o=>typeof o.fx==="object"&&(o.fx[k]||0)>=10&&!o.die&&!o.risk));
   urg.push(who.length?`Tu ${ic} se apaga. Lo encontrarás junto a ${emo(who)}.`:`Tu ${ic} se apaga. Cuídalo antes de que se apague del todo.`);}
  else if(v>=75) urg.push(`Tu ${ic} rebosa. Lo que sobra también mata: no aceptes más ${ic}.`);
 }
 const peligro=pool.filter(e=>e.opts.some(o=>o.die||o.risk));
 if(peligro.length) otros.push(`En los compases que vienen acechan ${emo(shuffle(peligro.slice()))}. Cuando aparezcan, elige lo aburrido: lo aburrido no mata.`);
 const q=S.queue.find(x=>!S.used.has(x.id)&&x.at-S.turn<=8&&byId[x.id]);
 if(q) otros.push(`Algo que sembraste brota pronto. Lo traerá ${C[byId[q.id].c].e}.`);

 if(buenos.length) otros.push(`Si ves a ${emo(shuffle(buenos.slice()).slice(0,2))}, escucha: trae salud en el bolsillo.`);
 const all=urg.concat(shuffle(otros));
 if(!all.length) all.push("Tu partitura está limpia… de momento. Sonríe a 👵, que te quiere aunque no lo diga.");
 return all.slice(0,n).map(x=>"«"+x+"»").join(" ");
}

 const name=(inp&&inp.value.trim())||(S&&S.name)||NAMES[pickG][Math.floor(Math.random()*5)];
 const r0=()=>38+Math.floor(Math.random()*18), mod=GEN[pickGen].mod;
 S={g:pickG,gen:pickGen,name:name.slice(0,28),st:{o:r0(),d:r0(),h:r0(),s:r0()},f:{},used:new Set(),turn:0,stage:1,t0:0,queue:[],next:null,recent:[],cur:null,revives:0,ckTurn:-1,ckLabel:"",ckPending:null,hoodAt:12};
 for(const k in mod) S.st[k]=clamp(S.st[k]+mod[k]);
 CK=null; store("cae_save",null);
 hudEl.hidden=false; metaEl.hidden=false;
 drawHud(); advance();
}

function pick(){
 if(S.next){const e=byId[S.next];S.next=null;if(e)return e;}
 for(const [id,fn] of FORCED){ if(!S.used.has(id)&&fn()) return byId[id]; }
 const qi=S.queue.findIndex(q=>q.at<=S.turn&&!S.used.has(q.id));
 if(qi>=0) return byId[S.queue.splice(qi,1)[0].id];
 const ok=e=>e.st.includes(S.stage)&&(!e.gen||e.gen===S.gen)&&(!e.nogen||!e.nogen.includes(S.gen))&&(!e.cond||e.cond());
 const fresh=e=>!(S.avoidN>0&&S.avoid&&S.avoid.includes(e.id)); /* tras resucitar, no repetir enseguida lo ya vivido */
 let pool=EV.filter(e=>!e.chain&&ok(e)&&(e.rep||!S.used.has(e.id))&&!S.recent.includes(e.id)&&fresh(e));
 if(!pool.length) pool=EV.filter(e=>!e.chain&&ok(e)&&(e.rep||!S.used.has(e.id))&&!S.recent.includes(e.id));
 if(!pool.length) pool=EV.filter(e=>e.rep&&ok(e));
 const wt=e=>(e.w||(e.rep?1:3))*(S.stage===5&&!/^(tm_|hood_tm)/.test(e.id)?.35:1); /* en la etapa de top mantas mandan sus propios eventos */
 let r=Math.random()*pool.reduce((a,e)=>a+wt(e),0);
 for(const e of pool){r-=wt(e);if(r<=0)return e;}
 return pool[pool.length-1];
}

function advance(){
 const cfg=STG[S.stage], n=S.turn-S.t0;
 if((n>=cfg.min&&S.st.h>=cfg.hype)||n>=cfg.max){
  if(S.stage===4){
   if(F("diablo")&&!S.used.has("diablo_final")) return showEvent(byId.diablo_final); /* el pacto se cobra al final */
   return endGame(null);
  }
  S.stage=NEXT[S.stage]; S.t0=S.turn;
  if(S.stage===2&&!S.inv&&!S.used.has("asesor")) S.queue.push({id:"asesor",at:S.turn+3}); /* el asesor llega con el primer éxito */
  if(S.stage===2&&!F("diablo")&&!S.used.has("diablo_oferta")) S.queue.push({id:"diablo_oferta",at:S.turn+6+Math.floor(Math.random()*50)}); /* el diablo aparece seguro una vez: en el primer éxito, en las mantas o en el estrellato */
  for(const [k] of STATS) S.st[k]=Math.round(S.st[k]+(50-S.st[k])*RESPIRO);
  drawHud();
  S.ckPending=null;
  if(F("alma")) checkpoint(STG[S.stage].name);
  const it=INTER[S.stage];
  return interlude(`<div class="big">${it.i}</div>`,STG[S.stage].name,tx(it.x)+" Empiezas la etapa con las barras algo más equilibradas. A partir de ahora, cada decisión: "+fmtP(STG[S.stage].p)+".","Seguir",()=>showEvent(pick()));
 }
 if(S.ckPending&&!S.next){checkpoint(S.ckPending);S.ckPending=null;}
 else if(F("alma")&&!S.next&&S.turn%CHECK_EVERY===0&&S.ckTurn!==S.turn) checkpoint(STG[S.stage].name);
 showEvent(pick());
}

function showEvent(e){
 S.cur=e; drawHud();
 const c=C[e.c];
 scr.innerHTML=`<div class="card">
  ${avatar(e.c)}
  <div class="who"><b>${tx(c.n)}</b><span>${tx(c.r)}</span></div>
  <div class="bubble">${tx(V(e.q))}</div></div>
  <div class="opts">${shuffle(e.opts.map((o,i)=>i)).map((i,pos)=>`<button class="opt" data-i="${i}"><span class="k">${"ABC"[pos]}</span><span>${tx(V(e.opts[i].t))}${riskTag(e.opts[i])}</span></button>`).join("")}</div>`;
 scr.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}

const AFTER=id=>/^(pedro_|infierno_)/.test(id)||id==="cielo"||id==="cielo2"; /* en el cielo (o en el infierno) no hay desgaste */
function choose(i){
 const e=S.cur,o=e.opts[i];
 S.used.add(e.id); S.recent.push(e.id); if(S.recent.length>4)S.recent.shift();
 S.turn++; S.clicks=(S.clicks||0)+1;
 const fx={}, notes=[];
 let base=V(o.fx)||{}, rtext=o.r;
 if(o.alt&&Math.random()<o.alt[0]){base=o.alt[1];rtext=o.alt[2];} /* resultado alternativo por azar */
 if(o.chase){ /* persecución: [probabilidad, siguiente paso, texto si aciertas, castigo si fallas, texto si fallas, premio si aciertas] */
  if(Math.random()<o.chase[0]){S.next=o.chase[1];rtext=o.chase[2];if(o.chase[5])base=o.chase[5];}
  else{base=o.chase[3];rtext=o.chase[4];}
 }
 for(const k in base){const v=base[k];fx[k]=o.raw?v:Math.round(v*(v<0?CRUEL:BONUS));} /* raw: cantidades exactas (inversiones, ritual del hada) */
 if(o.f) for(const k in o.f) S.f[k]=F(k)+o.f[k];
 if(o.set) Object.assign(S.f,o.set);
 if(o.later) S.queue.push({id:o.later[0],at:S.turn+o.later[1]});
 if(o.next) S.next=o.next;
 if(/^(pedro_|infierno_)/.test(e.id)&&S.revNext){S.next=S.revNext;S.revNext=null;} /* tras el más allá, alguien te recibe en la Tierra */
 if(o.ck) S.ckPending=o.ck;
 if(S.avoidN>0) S.avoidN--;
 if(o.run){const t=o.run(); if(t) rtext=t;}
 rtext=V(rtext);
 let death=o.die||null;
 if(!death&&o.risk){ /* riesgo de muerte: depende de una barra (ver RIESGO) */
  const rr=RIESGO[o.risk[1]], ok=rr&&riskOk(rr), pr=rr?(ok?0:Math.min(.85,o.risk[0]*2)):o.risk[0];
  if(Math.random()<pr){death=o.risk[1];rtext="Algo sale terriblemente mal…";for(const k in fx)delete fx[k];}
  else if(rr) notes.push(ok?`Tu ${statIc(rr[0])} te ha salvado: ${tx(rr[3])}.`:`Te has librado de milagro: con tu ${statIc(rr[0])} así, era muy arriesgado.`);
 }
 const enCielo=AFTER(e.id);
 if(!death){
  if(!enCielo){
   if(F("drogas")>=2){fx.s=(fx.s||0)-5;notes.push("Tu cuerpo pasa factura: −5 ❤️ por el bajón.");}
   const p=STG[S.stage].p; for(const k in p) fx[k]=(fx[k]||0)-p[k];
   notes.push(STG[S.stage].msg+": "+fmtP(p)+".");
  }
  for(const [k] of STATS) S.st[k]=clamp(S.st[k]+(fx[k]||0));
  if(o.heal){const hv=o.heal===1?95:o.heal;fx.s=(fx.s||0)+(hv-S.st.s);S.st.s=hv;notes.push(o.heal===1?"El pitillo te devuelve toda la salud.":"Recuperas casi toda la salud.");}
  if(o.safe) for(const [k] of STATS) S.st[k]=Math.max(5,Math.min(95,S.st[k])); /* premio que nunca mata */
  for(const k of ["s","d","o","h"]){ if(S.st[k]===0){death=k+"0";break;} if(S.st[k]===100){death=k+"100";break;} }
 }
 if(!enCielo&&!e.inv&&S.inv&&!S.inv.sold) invTick(base,o); /* tus decisiones mueven tu inversión */
 if(death&&F("billete")){ /* el billete de vuelta del hada: se salva una muerte */
  S.f.billete=0; S.f.billete_usado=F("billete_usado")+1;
  for(const [k] of STATS) S.st[k]=Math.max(20,Math.min(80,S.st[k]));
  notes.unshift(`🎫 Ibas a morir (${tx(DEATHS[death].t)}). El billete de vuelta del hada se rompe en tu bolsillo y la muerte pasa de largo, ofendida.`);
  death=null;
 }
 drawHud(fx);
 const chips=STATS.filter(([k])=>fx[k]).map(([k,ic])=>`<span class="chip ${fx[k]>0?"pos":"neg"}">${ic} ${fx[k]>0?"+":""}${fx[k]}</span>`).join("");
 scr.innerHTML=`<div class="card">
  ${avatar(e.c,1)}
  <div class="bubble narr">${tx(rtext)}</div>
  ${chips?`<div class="chips">${chips}</div>`:""}
  ${notes.length?`<div class="note">${notes.join("<br>")}</div>`:""}
  </div>
  <button class="btn" id="go">${death||o.end?"…":"Continuar"}</button>`;
 $("#go").onclick=()=>o.end?endGame(null,o.end):death?endGame(death):advance();
 $("#go").focus({preventScroll:true});
}

function interlude(icon,title,text,label,next){
 scr.innerHTML=`<div class="card">${icon}<div class="dt">${esc(title)}</div><div class="bubble narr">${text}</div></div><button class="btn" id="go">${label}</button>`;
 $("#go").onclick=next; $("#go").focus({preventScroll:true});
}

function revive(){
 const r=S.revives+1, dead=S.lastDeath, ckT=S.ckTurn;
 const streak=(S.streakCk===ckT?S.streak||0:0)+1; // muertes seguidas desde el mismo punto de control
 /* Lo que viviste entre el punto de control y la muerte: no se repite enseguida al volver */
 const ckUsed=new Set(JSON.parse(CK).used);
 const lived=[...S.used].filter(id=>!ckUsed.has(id)&&!byId[id].chain);
 const pSeen=S.pSeen||[], rSeen=S.rSeen||[], deathLog=S.deathLog||[], clicks=S.clicks||0;
 S=unsnap(CK); S.revives=r; S.deathLog=deathLog; S.clicks=clicks; S.streak=streak; S.streakCk=S.ckTurn;
 for(const [k] of STATS) S.st[k]=50; /* al resucitar, todas las barras vuelven a la mitad */
 /* San Pedro limpia un poco el expediente para que no vuelvas directo a la misma muerte */
 if(F("neonazis")>=2) S.f.neonazis=1;
 if(F("drogas")>=3) S.f.drogas=2;
 if(F("alcohol")>=3) S.f.alcohol=2;
 if(F("policia")>=2) S.f.policia=1;
 if(F("hacienda")>=2) S.f.hacienda=1;
 if(F("mafia")>=1) S.f.mafia=0;
 if(F("secta")>=1) S.f.secta=0;
 /* Que la vuelta no sea siempre igual: aplazar lo pendiente y apartar lo ya vivido */
 S.queue.forEach(q=>{q.at=Math.max(q.at,S.turn+3+Math.floor(Math.random()*5));});
 S.avoid=lived; S.avoidN=8; S.recent=[];
 /* Diálogo con San Pedro (sin repetir hasta agotar) y personaje que te recibe en la Tierra */
 const hell=!!F("diablo"), POOL=hell?INFIERNO_EV:PEDRO_EV, fk=hell?"inf_visto":"mision"; /* con pacto, resucitas en el infierno */
 const first=!F(fk);
 if(first){S.f[fk]=1;const o=JSON.parse(CK);o.f[fk]=1;CK=JSON.stringify(o);} /* lo revelado no se olvida */
 const pPool=POOL.filter(id=>!pSeen.includes(id)), pid=first?(hell?"infierno_bienvenida":"pedro_mision"):rnd(pPool.length?pPool:POOL);
 const rPool=REVIVE_EV.filter(id=>!rSeen.includes(id)), rid=rnd(rPool.length?rPool:REVIVE_EV);
 S.pSeen=first?pSeen:(pPool.length?pSeen:[]).concat(pid);
 S.rSeen=(rPool.length?rSeen:[]).concat(rid);
 S.next=pid; S.revNext=rid;
 store("cae_save",{ck:CK,revives:r,pSeen:S.pSeen,rSeen:S.rSeen,deathLog:S.deathLog,clicks:S.clicks});
 hudEl.hidden=false; metaEl.hidden=false; drawHud();
 const why=(dead&&DEATHS[dead]?"Te mató: <b>"+tx(DEATHS[dead].t)+"</b>. ":"")+"Vuelves con todas las barras a la mitad. ";
 if(hell) interlude(avatar("diablo"),"Resurrección infernal nº "+r,why.replace("San Pedro","el Diablo de los Acordes")+"Todo se vuelve rojo. Huele a azufre y a ensayo de batería. Alguien afina una guitarra con los dientes y te hace sitio en un sofá de skai que quema.","Hablar con el Diablo",()=>advance());
 else interlude(avatar("pedro"),"Resurrección nº "+r,why+"Todo se vuelve blanco. Otra vez. Huele a nube y a papeleo. Alguien carraspea detrás de un mostrador.","Hablar con San Pedro",()=>advance());
}

function endGame(death,special){ /* special: "universo" = final del pacto con el diablo · "rendicion" = te rindes */
 let got=store("cae_deaths")||[];
 if(death){
  S.deathLog=(S.deathLog||[]).concat({d:death,c:S.cur?S.cur.c:null}); /* con quién moriste */
  if(!got.includes(death)){got.push(death);store("cae_deaths",got);}
 }
 if(special==="universo"&&!got.includes(special)){got.push(special);store("cae_deaths",got);}
 S.lastDeath=death;
 const final=!death||!CK; /* sin resurrección posible, la partida acaba aquí */
 const best=store("cae_best")||{turns:0};
 const isRecord=final&&S.turn>best.turns;
 if(isRecord) store("cae_best",{turns:S.turn,stage:S.stage});
 if(!death){store("cae_save",null);CK=null;}
 if(special) document.body.classList.remove("infierno");
 const resu=S.revives?", aunque tuviste que resucitar "+S.revives+(S.revives===1?" vez":" veces"):"";
 const d=special==="rendicion"?{i:"🏳️",t:"Retirada",x:"Cuelgas la guitarra, apagas el móvil y te vas a vivir al pueblo de tu madre. Kira Star sube un story muy triste. San Pedro archiva tu expediente en el cajón de «casi». Y en algún lugar, alguien con capucha suspira."}
  :death?DEATHS[death]:special?DEATHS[special]:(F("mision")
  ?{i:"🌍",t:"Leyenda (y el mundo sigue aquí)",x:"Cantas la última nota de tu última gira"+resu+". En algún lugar, una profecía con muy mala letra se tacha sola. El mundo no se destruye. Nadie se entera. Kira Star se atribuye el mérito. Desde arriba, San Pedro levanta el pulgar. Y en la última fila, alguien con capucha se va sin hacer ruido."}
  :{i:"👑",t:"Leyenda",x:"Sobreviviste a los garitos, a la fama, a las mantas, a tu cuñado, a Hacienda, a Don Mariano y a ti mism[o|a]"+resu+". Te retiras a una isla con tus royalties. Nunca sabrás que el mundo dependía de ti. Kira Star canta en tu homenaje. Desafina. Por fin, sonríes."});
 const head=special==="rendicion"?["univ","TE HAS RENDIDO"]:death?["","HAS MUERTO"]:special?["univ","HAS DESTRUIDO EL UNIVERSO"]:["win","ERES UNA LEYENDA"];
 const coll=Object.keys(DEATHS).map(k=>{const on=got.includes(k);return `<div class="${on?"":"lock"}"><span>${on?DEATHS[k].i:"❔"}</span>${on?tx(DEATHS[k].t):"???"}</div>`}).join("");
 scr.innerHTML=`<div class="card">
  <div class="big">${d.i}</div>
  <div class="fin ${head[0]}">${head[1]}</div>
  <div class="dt">${tx(d.t)}</div>
  <div class="bubble narr">${tx(d.x)}</div>
  ${isRecord?`<span class="badge">¡Nuevo récord!</span>`:""}
  ${final?`<div class="stats"><div><b>${S.turn}</b>decisiones</div><div><b>${Math.max(S.turn,best.turns)}</b>récord</div><div><b>${S.revives}</b>resurrecciones</div></div>`:""}
  <h3>Finales desbloqueados · ${got.length}/${Object.keys(DEATHS).length}</h3>
  <div class="coll">${coll}</div></div>
  ${!final?`<button class="btn gold" id="rev">${F("diablo")?"😈":"😇"} Resucitar (${esc(S.ckLabel)})</button><button class="btn ghost" id="quit">🏳️ Rendirse</button>`:""}
  ${death&&!CK?`<p class="small">Aún no te habías cruzado con el encapuchado: sin alma guardada no hay resurrección. Toca empezar de cero.</p>`:""}
  ${final?`<button class="btn" id="again">Empezar de cero</button><button class="btn ghost" id="home">Cambiar de personaje</button>`:""}`;
 window.scrollTo(0,0);
 if($("#rev")) $("#rev").onclick=revive;
 if($("#quit")) $("#quit").onclick=askQuit;
 if($("#again")) $("#again").onclick=()=>{pickG=S.g;pickGen=S.gen;newGame();};
 if($("#home")) $("#home").onclick=home;
}

/* Rendirse: pop-up de confirmación con el contador y las muertes de la partida */
function askQuit(){
 const log=S.deathLog||[], total=S.clicks||S.turn;
 const rows=log.map(x=>{const c=x.c&&C[x.c];return `<li>${c?avatar(x.c,1):`<span class="big" style="font-size:40px">${DEATHS[x.d].i}</span>`}<div><b>${c?tx(c.n):"Nadie"}</b><span>${DEATHS[x.d].i} ${tx(DEATHS[x.d].t)}</span></div></li>`}).join("");
 const m=document.createElement("div"); m.id="modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true");
 m.innerHTML=`<div class="box">
  <div class="dt">¿Seguro que quieres rendirte?</div>
  <div class="count"><b>${total}</b>decisiones tomadas${total!==S.turn?` <span>(contando las que repetiste al resucitar)</span>`:""}</div>
  <h3>${log.length===1?"Moriste con":"Has muerto con"}…</h3>
  <ul class="dlog">${rows}</ul>
  <button class="btn" id="mq_yes">🏳️ Sí, me rindo</button>
  <button class="btn ghost" id="mq_no">No, quiero resucitar</button></div>`;
 document.body.appendChild(m);
 const close=()=>{m.remove();document.removeEventListener("keydown",esc_);};
 const esc_=e=>{if(e.key==="Escape")close();};
 document.addEventListener("keydown",esc_);
 m.onclick=e=>{if(e.target===m)close();};
 $("#mq_no").onclick=close;
 $("#mq_yes").onclick=()=>{close();CK=null;store("cae_save",null);endGame(null,"rendicion");};
 $("#mq_no").focus();
}

function home(){
 const sv=store("cae_save");
 const keepName=S&&S.name;
 S=null; hudEl.hidden=true; metaEl.hidden=true; document.documentElement.dataset.gen=pickGen; document.body.classList.remove("infierno");
 const best=store("cae_best"), got=store("cae_deaths")||[];
 let svInfo="";
 if(sv&&sv.ck){try{const o=JSON.parse(sv.ck);svInfo=`${esc(o.name)} · ${esc(o.ckLabel)}${sv.revives?" · 😇×"+sv.revives:""}`;}catch(e){}}
 scr.innerHTML=`<div class="title">Carrera al<br>Estrellato</div>
  <p class="tag">Llegar a la fama es fácil. Sobrevivir a ella, no tanto. Morir, facilísimo.</p>
  ${svInfo?`<button class="btn gold" id="cont">▶ Continuar: ${svInfo}</button>`:""}
  <label class="lb">Elige personaje</label>
  <div class="genders">
   <button class="gender" data-g="m" aria-pressed="${pickG==="m"}"><span class="e">👨‍🎤</span>Cantante</button>
   <button class="gender" data-g="f" aria-pressed="${pickG==="f"}"><span class="e">👩‍🎤</span>Cantante</button>
  </div>
  <label class="lb">Tipo de músico</label>
  <div class="genres">${Object.entries(GEN).map(([k,g])=>`<button class="genre" data-k="${k}" aria-pressed="${pickGen===k}"><span class="ge">${g.e}</span><b>${g.n}</b><span>${g.d}</span></button>`).join("")}</div>
  <label class="lb" for="name">Nombre artístico (opcional)</label>
  <input class="name" id="name" maxlength="28" placeholder="${NAMES[pickG][0]}" autocomplete="off" value="${keepName?esc(keepName):""}">
  <button class="btn${svInfo?" ghost":""}" id="start">Nueva partida</button>
  <div class="rules"><b>Cómo se juega:</b> cada decisión mueve tus cuatro barras: 🗣️ opinión pública, 💰 dinero, 🔥 hype y ❤️ salud. Si alguna llega a 0 <b>o a 100</b>, mueres en el acto. Algunas decisiones también pueden matarte sin avisar, y hay cosas que el juego no te enseña pero sí recuerda.<br><br><b>💾 Puntos de control:</b> hasta que no te cruces con cierto desconocido, morir es para siempre. A partir de ahí, tu alma se guarda al empezar cada etapa y cada ${CHECK_EVERY} decisiones, y cuando mueras volverás al último punto para enmendar tus errores.<br><br><b>🏁 Meta:</b> llegar a leyenda exige al menos 101 decisiones. Por el camino te cruzarás con un asesor que invierte tu dinero (📈), un hada que vende consejos a cambio de salud (🧚, y a la tercera, 🎫 un billete que te salva de una muerte) y, quizá, con alguien que huele a azufre.</div>
  <p class="small">${best?`Récord: ${best.turns} decisiones · `:""}Finales desbloqueados: ${got.length}/${Object.keys(DEATHS).length}</p>`;
 scr.querySelectorAll(".gender").forEach(b=>b.onclick=()=>{pickG=b.dataset.g;scr.querySelectorAll(".gender").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#name").placeholder=NAMES[pickG][0];});
 scr.querySelectorAll(".genre").forEach(b=>b.onclick=()=>{pickGen=b.dataset.k;scr.querySelectorAll(".genre").forEach(x=>x.setAttribute("aria-pressed",x===b));document.documentElement.dataset.gen=pickGen;});
 $("#start").onclick=newGame;
 $("#name").onkeydown=e=>{if(e.key==="Enter")newGame();};
 if($("#cont")) $("#cont").onclick=()=>{CK=sv.ck;S=unsnap(CK);if(!S.gen)S.gen="rock";if(S.hoodAt===undefined){S.hoodAt=S.turn;S.f.alma=1;}S.revives=sv.revives||0;S.deathLog=sv.deathLog||[];S.clicks=sv.clicks||S.turn;S.pSeen=sv.pSeen||[];S.rSeen=sv.rSeen||[];hudEl.hidden=false;metaEl.hidden=false;drawHud();advance();};
}

/* Teclado: 1-3 / A-C para elegir */
document.addEventListener("keydown",e=>{
 if(!S||e.target.tagName==="INPUT")return;
 const k=e.key.toLowerCase(), idx={"1":0,"2":1,"3":2,a:0,b:1,c:2}[k];
 const opts=scr.querySelectorAll(".opt");
 if(idx!==undefined&&opts[idx]){opts[idx].click();e.preventDefault();}
});

/* Tema: oscuro o claro (fondo blanco, letra negra) */
function setTheme(t){
 document.documentElement.dataset.theme=t; store("cae_theme",t);
 const b=$("#themeBtn"); b.textContent=t==="light"?"🌙":"☀️";
 b.setAttribute("aria-label",t==="light"?"Cambiar a fondo oscuro":"Cambiar a fondo blanco");
}
$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
setTheme(store("cae_theme")||"dark");

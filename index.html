<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carrera al Estrellato</title>
<meta name="description" content="Juego de decisiones con humor negro: llega a la fama, sobrevive a ella y resucita cuando no lo consigas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0718;--panel:#221640;--panel2:var(--panel2);--glow:#3a1466;--btn2:#ff7a5c;--ink:#f5f0ff;--mute:#a99cc7;--acc:#ff3cac;--acc2:#ffd23f;--good:#2ee59d;--bad:#ff4d6d;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(1200px 600px at 50% -10%,var(--glow) 0%,var(--bg) 60%);background-attachment:fixed;color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#wrap{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:12px 16px 72px}
button{font:inherit;color:inherit;cursor:pointer}
/* HUD */
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:var(--r)}
#hud[hidden],.meta[hidden]{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mute)}
.st .ic{font-size:22px;line-height:1;transition:transform .3s}
.st .bar{width:100%;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.st .fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.st.danger .fill{background:var(--bad)}
.st.danger .ic{animation:pulse 1s infinite}
.st.up .ic{transform:scale(1.4) translateY(-3px)}
.st.down .ic{transform:scale(.75)}
@keyframes pulse{50%{transform:scale(1.2)}}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;font-size:12px;color:var(--mute);margin:12px 4px 10px}
#screen{flex:1;display:flex;flex-direction:column}
/* Tarjeta */
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:22px 18px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:in .35s ease-out;box-shadow:0 20px 50px rgba(0,0,0,.4)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
.avatar{position:relative;width:132px;height:132px;flex:none}
.avatar .face{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--c);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,white),var(--c));box-shadow:0 0 0 5px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.35)}
.avatar svg{width:100%;height:100%;display:block}
.avatar .em{position:absolute;right:-2px;bottom:-2px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.avatar.sm{width:76px;height:76px}
.avatar.sm .em{width:28px;height:28px;font-size:15px}
.who{margin-top:12px}
.who b{display:block;font-size:18px;font-weight:800}
.who span{font-size:13px;color:var(--mute)}
.bubble{margin-top:16px;background:#fff;color:#1a1029;border-radius:18px;padding:16px;font-size:16px;line-height:1.45;position:relative;text-align:left;width:100%}
.bubble:before{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble.narr{background:rgba(255,255,255,.07);color:var(--ink);text-align:center}
.bubble.narr:before{display:none}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:15px;font-weight:600;line-height:1.35;transition:transform .12s,background .2s,border-color .2s;animation:in .35s ease-out both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}
.opt:hover,.opt:focus-visible{background:color-mix(in srgb,var(--acc) 16%,transparent);border-color:var(--acc);outline:none}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--acc);color:#fff;font-size:12px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{padding:6px 10px;border-radius:99px;font-weight:800;font-size:14px}
.chip.pos{background:rgba(46,229,157,.15);color:var(--good)}
.chip.neg{background:rgba(255,77,109,.15);color:var(--bad)}
.note{margin-top:12px;font-size:13px;color:var(--mute)}
.btn{margin-top:14px;width:100%;padding:15px;border-radius:16px;border:0;background:linear-gradient(90deg,var(--acc),var(--btn2));color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(90deg,#ffd23f,#ff9f1c);color:#1a1029;box-shadow:0 8px 24px rgba(255,190,11,.35)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);box-shadow:none;color:var(--mute)}
/* Portada */
.title{font-family:Bungee,Inter,sans-serif;font-size:40px;line-height:1;text-align:center;margin-top:28px;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{text-align:center;color:var(--mute);margin:10px 0 24px;font-size:15px}
.genders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gender{padding:18px 8px;border-radius:20px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.gender .e{font-size:54px}
.gender[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.genres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.genre{padding:12px 10px;border-radius:16px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.genre .ge{font-size:28px;line-height:1}
.genre b{font-size:14px}
.genre span:last-child{font-size:11.5px;color:var(--mute);line-height:1.35}
.genre[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
html[data-theme="light"] .genre{background:#fff;border-color:#d9d9e0;color:#111}
html[data-theme="light"] .genre[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 8%,#fff);border-color:var(--acc)}
label.lb{display:block;font-size:13px;color:var(--mute);margin:18px 4px 6px}
input.name{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:16px}
input.name:focus{outline:none;border-color:var(--acc)}
.small{font-size:13px;color:var(--mute);text-align:center;margin-top:14px;line-height:1.5}
.rules{margin-top:18px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);font-size:13px;color:var(--mute);line-height:1.55}
.rules b{color:var(--ink)}
/* Fin */
.big{font-size:72px;line-height:1;margin-top:6px}
.fin{font-family:Bungee,Inter,sans-serif;font-size:14px;letter-spacing:.2em;color:var(--bad);margin-top:12px}
.fin.win{color:var(--good)}
.fin.univ{color:#ff7b00}
/* Camino del diablo: llamas sutiles al pie de la pantalla */
body:after{content:"";position:fixed;left:0;right:0;bottom:0;height:38vh;pointer-events:none;z-index:-1;opacity:0;transition:opacity 2s;
 background:radial-gradient(60% 70% at 15% 100%,rgba(255,90,0,.55),transparent 70%),radial-gradient(50% 80% at 50% 100%,rgba(255,40,0,.5),transparent 70%),radial-gradient(60% 70% at 85% 100%,rgba(255,140,0,.45),transparent 70%);
 filter:blur(6px);transform-origin:50% 100%}
body.infierno:after{opacity:.22;animation:llama 3.2s ease-in-out infinite alternate}
html[data-theme="light"] body.infierno:after{opacity:.14}
@keyframes llama{0%{transform:scaleY(.92) skewX(-1deg)}50%{transform:scaleY(1.06) skewX(1.5deg)}100%{transform:scaleY(.97) skewX(-.5deg)}}
.dt{font-size:24px;font-weight:800;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:16px}
.stats div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 6px;font-size:11px;color:var(--mute)}
.stats b{display:block;font-size:20px;color:var(--ink)}
.badge{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:99px;background:var(--acc2);color:#1a1029;font-weight:800;font-size:12px}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;width:100%;margin-top:10px}
.coll div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 4px;font-size:10px;color:var(--mute);text-align:center;line-height:1.2}
.coll div span{display:block;font-size:24px;margin-bottom:4px}
.coll div.lock{opacity:.35}
h3{font-size:13px;color:var(--mute);margin-top:20px;align-self:flex-start;font-weight:600}
/* Aviso de punto de control */
#toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-160%);background:var(--acc2);color:#1a1029;padding:9px 16px;border-radius:99px;font-weight:800;font-size:13px;transition:transform .35s;z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.3);white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
/* Botón de tema */
#themeBtn{position:fixed;right:14px;bottom:14px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,10,40,.85);font-size:20px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
/* Tema claro: fondo blanco y letra negra */
html[data-theme="light"]{--bg:#fff;--ink:#111;--mute:#444;--good:#007a4d;--bad:#c1121f}
html[data-theme="light"] body{background:#fff;background-image:none;color:#111}
html[data-theme="light"] #hud{background:#fff;border-color:#d9d9e0}
html[data-theme="light"] .st .bar{background:#e6e6eb}
html[data-theme="light"] .card{background:#fff;border-color:#d9d9e0;box-shadow:0 6px 20px rgba(0,0,0,.07)}
html[data-theme="light"] .bubble,html[data-theme="light"] .bubble.narr{background:#f2f2f5;color:#111}
html[data-theme="light"] .bubble:before{border-bottom-color:#f2f2f5}
html[data-theme="light"] .opt{background:#fff;border-color:#cfcfd8;color:#111}
html[data-theme="light"] .opt:hover,html[data-theme="light"] .opt:focus-visible{background:color-mix(in srgb,var(--acc) 8%,#fff);border-color:var(--acc)}
html[data-theme="light"] .gender{background:#fff;border-color:#d9d9e0;color:#111}
html[data-theme="light"] .gender[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 8%,#fff);border-color:var(--acc)}
html[data-theme="light"] input.name{background:#fff;border-color:#cfcfd8;color:#111}
html[data-theme="light"] .rules,html[data-theme="light"] .stats div,html[data-theme="light"] .coll div{background:#f2f2f5}
html[data-theme="light"] .rules b,html[data-theme="light"] .stats b{color:#111}
html[data-theme="light"] .btn.ghost{border-color:#bbb;color:#333}
html[data-theme="light"] .title{background:none;color:#111}
html[data-theme="light"] .chip.pos{background:#e3f6ee}
html[data-theme="light"] .chip.neg{background:#fde8ea}
html[data-theme="light"] #themeBtn{background:#fff;border-color:#cfcfd8;box-shadow:0 4px 14px rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Colores según el tipo de músico */
html[data-gen="rock"]{--acc:#e5383b;--acc2:#ffb347;--btn2:#ff7b39;--bg:#110506;--panel:#2b1013;--panel2:#1a0809;--glow:#5c1016}
html[data-gen="punk"]{--acc:#2fbf55;--acc2:#c6ff3d;--btn2:#86d930;--bg:#050e08;--panel:#11261a;--panel2:#09170f;--glow:#0f4a26}
html[data-gen="laura"]{--acc:#9d4edd;--acc2:#e0aaff;--btn2:#c77dff;--bg:#0d0718;--panel:#221640;--panel2:#170e2c;--glow:#3a1466}
html[data-gen="indie"]{--acc:#8a8a8a;--acc2:#d2b48c;--btn2:#b0916a;--bg:#080808;--panel:#1f1e1c;--panel2:#141312;--glow:#2c2722}
html[data-theme="light"][data-gen]{--bg:#fff}
/* Pop-up de rendición */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px;animation:in .2s ease-out}
#modal .box{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:22px 18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal .count{margin-top:14px;font-size:13px;color:var(--mute)}
#modal .count b{display:block;font-family:Bungee,Inter,sans-serif;font-size:48px;color:var(--acc2);line-height:1.1}
#modal .count span{display:block;font-size:11px;margin-top:2px}
#modal h3{margin-top:16px}
.dlog{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:8px;text-align:left}
.dlog li{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 10px}
.dlog li .avatar.sm{width:52px;height:52px}.dlog li .avatar.sm .em{width:22px;height:22px;font-size:12px}
.dlog b{display:block;font-size:14px}.dlog span{font-size:12px;color:var(--mute)}
html[data-theme="light"] #modal .box{background:#fff;border-color:#d9d9e0}
html[data-theme="light"] .dlog li{background:#f2f2f5}
.opt .rk{display:block;margin-top:5px;font-style:normal;font-size:12px;font-weight:600;color:var(--bad)}
</style>
</head>

*/
const F=k=>(S&&S.f[k])||0;

/* ---------- ETAPA 1 · Los garitos ---------- */
{id:"intro",st:[1],c:"mama",q:"Hij[o|a], ¿de verdad vas a dejar ADE para cantar? Tu primo Iván ya es interventor en un banco. IN-TER-VEN-TOR.",opts:[

{id:"kevin_nazis",st:[1,2],c:"kevin",q:"Bolo el sábado. Pagan 3.000 pavos en efectivo. El público es… muy de cabeza rapada. Pero aplauden con un ritmo marcial precioso.",opts:[

{id:"video_nazi",chain:1,st:[1,2],c:"paco",q:"Tengo un vídeo tuyo cantando ante doscientos cabezas rapadas haciendo… gestos. ¿Algún comentario antes de publicarlo?",opts:[

{id:"toni_1",st:[1,2],c:"toni",cond:()=>F("drogas")===0,q:"Esto es para aguantar los bolos de cuatro horas. La primera va de regalo, como el pan en los restaurantes.",opts:[

 {t:"¿Me haces precio de amig[o|a]?",fx:{d:-5,h:5,s:-5},f:{drogas:1},r:"Te hace un 2x1. El marketing de Toni es mejor que el de cualquier discográfica."}]},

{id:"toni_rep",rep:1,w:2,st:[1,2],c:"toni",cond:()=>F("drogas")>=1,q:"¿Lo de siempre, artista? Hoy tengo oferta: llévate tres y te regalo un llavero.",opts:[

 {t:"Firmar el brazo.",fx:{o:10,h:5},set:{jessica:1},later:["jessica_2",5],r:"Al día siguiente lo lleva tatuado. Con una falta de ortografía que no es tuya."},
 {t:"Salir corriendo.",fx:{s:5,o:-5},r:"Jessica corre más que tú. Pero solo quería devolverte la cartera."},
 {t:"Te firmo si me llevas las redes gratis.",fx:{h:10,d:5},set:{jessica:1},later:["jessica_2",5],r:"Resulta ser la mejor community manager que has tenido. También sabe dónde vives."}]},

{id:"jessica_2",chain:1,st:[1,2],c:"jessica",q:"Te sigo hasta casa cada noche para asegurarme de que llegas bien. Desde hace un mes. ¿A que es bonito?",opts:[
 {t:"Pedir una orden de alejamiento.",fx:{s:10,o:-10,d:-5},r:"Jessica te escribe una canción de desamor. Es mejor que todas las tuyas."},
 {t:"Contratarla de guardaespaldas.",fx:{s:5,d:-10,h:5},r:"Nadie se acerca a ti. Literalmente nadie. Ni tu madre."},
 {t:"Hablar con ella con cariño.",fx:{o:10,s:-5},r:"Lo entiende. Ahora sigue a Kira Star. Sientes celos, y eso te preocupa bastante."}]},

{id:"guru",st:[1,2],c:"guru",q:"Tu aura está bloqueada. Con un retiro de quince días en Lanzarote te la desbloqueo. 3.000 €, y te traes tu propio colchón.",opts:[
 {t:"Ir al retiro.",fx:{s:15,d:-25},f:{secta:1},r:"Vuelves con paz interior, una túnica naranja y sin cejas."},
 {t:"Mi aura está bien bloqueada, gracias.",fx:{o:2},r:"El gurú te desea «luz». Y te bloquea en WhatsApp."},
 {t:"¿Me lo dejas a mitad si canto en el retiro?",fx:{d:-10,s:10,h:5},f:{secta:1},r:"Cantas mantras con ritmo de bachata. El gurú te mira con ojos de inversor."}]},

{id:"guru_2",st:[1,2],c:"guru",cond:()=>F("secta")===1,q:"Herman[o|a], la Comunidad te echa de menos. Tenemos un retiro avanzado: nivel «Ya no necesitas tu DNI».",opts:[
 {t:"Volver. Allí estaba en paz.",fx:{s:10,d:-15,h:-5},f:{secta:1},r:"Te dan un nombre nuevo y una escoba. La escoba también tiene nombre."},
 {t:"Rechazarlo con educación.",fx:{o:3},r:"Te mandan un audio de catorce minutos. Es un mantra. Sigue sonando en tu cabeza."},
 {t:"Contarlo todo en un pódcast.",fx:{h:15,o:5,s:-5},set:{secta:0},r:"El episodio se titula «Me quitaron las cejas y la dignidad». Récord de escuchas."}]},

{id:"ruiz",st:[1,2],c:"ruiz",q:"Me consta que cobra usted en negro en el Bar Pepe. En calamares. Los calamares también tributan.",opts:[
 {t:"Pagar lo que toca.",fx:{d:-15},r:"Ruiz sonríe por primera vez en su carrera. Da un poco de miedo."},
 {t:"Negarlo todo.",fx:{s:-5},f:{hacienda:1},r:"Ruiz apunta algo en una libreta muy pequeña. Las libretas pequeñas son las peores."},
 {t:"Le invito a un bocadillo y lo hablamos.",fx:{d:5,o:-5},f:{hacienda:1},r:"Acepta el bocadillo. Lo anota como intento de soborno. En especie."}]},

{id:"politico",st:[1,2],c:"politico",q:"Queremos tu canción para nuestro mitin. Somos un partido moderado. Moderadamente de todo.",opts:[
 {t:"Cedérsela. Que paguen bien.",fx:{d:20,o:-20,h:10},r:"Tu canción suena mientras el candidato besa a un bebé. El bebé llora. Los memes te persiguen meses."},
 {t:"No mezclo música y política.",fx:{o:5},r:"El candidato usa una de Kira Star. Pierde igual."},
 {t:"Os la cedo si la cantáis en directo.",fx:{h:15,o:10,d:-5},r:"El candidato desafina en prime time. Pierde las elecciones. Te culpan. Lo bordas."}]},

{id:"mama_rep",rep:1,st:[1,2],c:"mama",q:"Te llamo para nada. ¿Comes bien? ¿Te abrigas? ¿Por qué sales en internet con esa ropa?",opts:[
 {t:"Sí, mamá. Todo bien.",fx:{s:5,d:-3},r:"Te manda un táper de lentejas por mensajería urgente. El envío cuesta más que las lentejas."},
 {t:"Ahora no puedo, estoy en un bolo.",fx:{h:3,o:-2},r:"No estás en un bolo. Estás en el sofá. Ella lo sabe. Siempre lo sabe."},
 {t:"Mamá, ¿me haces una transferencia?",fx:{d:10,o:-3},r:"Te la hace. Concepto: «PARA QUE COMAS»."}]},

{id:"ensayo_rep",rep:1,st:[1,2],c:"chema",cond:()=>!F("chema_fuera"),q:"¿Ensayamos hoy o nos vamos de cañas? Te aviso de que la última vez que ensayamos fue en marzo.",opts:[
 {t:"Ensayamos.",fx:{h:5,s:-3},r:"Sale una canción nueva. Se llama «Ensayo». Muy meta."},
 {t:"Cañas.",fx:{o:5,d:-5,s:-5},r:"Acabáis cantando en el bar. Os invitan a dos rondas. Es casi un bolo."},
 {t:"Ni una cosa ni otra: siesta.",fx:{s:10,h:-5},r:"Dormir es el único lujo de estrella que te puedes permitir."}]},

{id:"bolo_rep",rep:1,st:[1,2],c:"manolo",q:"Bolo de última hora: una despedida de soltero. El novio va por la sexta copa y lleva un disfraz de pollo.",opts:[
 {t:"Aceptar.",fx:{d:12,s:-8,o:-3},r:"Acabas tú también disfrazad[o|a] de pollo. Nadie sabe cómo. Nadie quiere saberlo."},
 {t:"Rechazar.",fx:{s:5,d:-5},r:"Te quedas en casa. Ves las fotos al día siguiente. Has hecho bien."},
 {t:"Acepto, pero solo canto baladas tristes.",fx:{d:8,h:-5,o:5},r:"El novio llora y cancela la boda. Te contrata para el divorcio."}]},

{id:"cola",st:[1,2],c:"cola",q:"Queremos que seas imagen de Burbujas Cola Zero Zero. Cero azúcar, cero calorías, cero sabor.",opts:[
 {t:"Aceptar.",fx:{d:25,o:-10,s:-5},r:"En el rodaje bebes 47 latas con cara de felicidad. Llevas tres días sin dormir."},
 {t:"Solo si es la versión con azúcar.",fx:{d:15,s:-10,o:5},r:"Te pagan en producto. Tu dentista se compra un barco."},
 {t:"Rechazarlo por principios.",fx:{o:10,d:-5,h:-5},r:"Kira Star acepta la campaña. Sale fatal en el anuncio. Pequeñas victorias."}]},

{id:"fausto",st:[1,2],c:"fausto",cond:()=>S.g==="f",q:"Tienes talento, bonita. Podemos hablar de tu disco… mejor en mi suite del hotel, que hay más intimidad.",opts:[
 {t:"Denunciarlo públicamente.",fx:{o:25,h:15,d:-15},r:"Cinco artistas más se suman a la denuncia. A Don Fausto lo jubilan. A ti te vetan dos radios… y te fichan tres."},
 {t:"Ir con mi abogada y una grabadora.",fx:{d:15,o:10,s:-5},r:"La grabación vale un acuerdo extrajudicial jugoso. Don Fausto se marcha a «descansar» a Marbella."},
 {t:"Mandarle a mi madre.",fx:{s:5,h:5},r:"Tu madre vuelve en veinte minutos. Don Fausto no vuelve a llamar a nadie nunca más."}]},

{id:"maripili",st:[1,2],c:"maripili",cond:()=>S.g==="m",q:"¡Qué guapo has venido! Para la audiencia… ¿te quitas la camiseta? Como en los 2000. Es para un rótulo.",opts:[
 {t:"Quitármela.",fx:{h:15,o:-5,s:-3},r:"Hace un frío horrible en el plató. Se nota. Mucho. Es trending topic."},
 {t:"No, gracias. Vengo a cantar.",fx:{o:10,h:-3},r:"Mari Pili te corta en la segunda estrofa para dar paso a una receta de croquetas."},
 {t:"Solo si te quitas tú la americana.",fx:{h:10,o:5},r:"Se la quita. Lleva otra debajo. Es una profesional."}]},

/* ---------- Neonazis ---------- */
{id:"bruno_dm",st:[1,2],c:"bruno",w:4,cond:()=>F("nazifan")||F("neonazis")>=1,q:"Los chicos del club quieren que compongas nuestro himno. Pagamos en efectivo. Y en antorchas.",opts:[
 {t:"Aceptar.",fx:{d:30,o:-30},set:{nazifan:1},r:"El himno es pegadizo. Demasiado pegadizo. Lo tarareas en la ducha y te odias un poco."},
 {t:"Rechazarlo educadamente.",fx:{o:5},f:{neonazis:1},r:"Bruno te manda un emoji de calavera. Sin texto. Sin contexto. Preocupante."},
 {t:"Publicar el mensaje en redes.",fx:{o:25,h:15,s:-5},f:{neonazis:1},r:"Medio país te aplaude. Otro tercio te insulta. Bruno te deja de seguir. No es buena señal."}]},

{id:"gasolinera",st:[1,2],c:"bruno",w:4,cond:()=>F("neonazis")>=1,q:"Mira quién está aquí. La estrellita antifascista. ¿Has venido sol[o|a] a la gasolinera?",opts:[
 {t:"Correr.",fx:{s:-10,o:-3},r:"Corres tres kilómetros. Récord personal. Pierdes una zapatilla y un poco de dignidad."},
 {t:"Plantarle cara.",fx:{s:-25,o:15,h:10},f:{neonazis:1},r:"Le dices cuatro verdades. Te devuelve ocho golpes. Un vídeo vecinal te convierte en héroe con collarín."},
 {t:"Fingir que soy mi gemel[o|a].",fx:{h:5,s:-5},set:{gemelo:1},r:"Funciona. No son muy listos. Ahora tienes que inventarte un gemel[o|a] para el resto de tu vida."}]},

{id:"nazi_gira",st:[2],c:"bruno",w:4,cond:()=>F("neonazis")>=1,q:"Tu gira pasa por nuestro barrio. Sería una pena que pasara algo. Ya me entiendes.",opts:[
 {t:"Cancelar esa fecha.",fx:{d:-15,o:-5},r:"Lo justificas con «problemas técnicos». El problema técnico mide 1,90 y no tiene pelo."},
 {t:"Contratar seguridad privada.",fx:{d:-20,s:5},r:"Contratas a Iker, dos metros de guardaespaldas. El concierto sale bien. Iker llora con tus baladas."},
 {t:"Dedicarles una canción: «Calvos de corazón».",fx:{h:20,o:10},f:{neonazis:1},r:"Lo grabas en directo. Es el vídeo más visto de la gira. Bruno lo ha visto. Varias veces."}]},

{id:"nazi_ruedas",st:[1,2],c:"bruno",w:5,cond:()=>F("neonazis")>=2,q:"(Te han rajado las cuatro ruedas. En el parabrisas, una nota con dibujo incluido): «La próxima vez no serán las ruedas».",opts:[
 {t:"Mudarme a otra ciudad.",fx:{d:-25,s:-5,h:-10},r:"Te mudas a Soria. Allí no te encuentra nadie. Ni siquiera tu público."},
 {t:"Contratar escolta.",fx:{d:-30,s:5},r:"Tu escolta se llama Iker, mide dos metros y llora con tus baladas."},
 {t:"Subir la foto con el lema «No me callaréis».",fx:{h:25,o:15},f:{neonazis:1},r:"Medio millón de compartidos. Bruno también la comparte, con un comentario: «Ya veremos»."}]},

{id:"nazi_final",chain:1,st:[1,2],c:"bruno",q:"Hemos leído tu último tuit. Y el anterior. Y el de antes. Hemos venido a comentarlos… en persona.",opts:[
 {t:"¿Lo hablamos con un café?",die:"nazi",r:"Bruno no toma café. Toma represalias."},
 {t:"Saltar por la ventana.",die:"nazi",r:"Es un quinto. Tu dignidad queda intacta. Tu columna, no."},
 {t:"Llamar a la policía.",die:"nazi",r:"La policía llega puntualísima. Para el atestado."}]},

/* ---------- Drogas, secta y Hacienda ---------- */
{id:"drogas_aviso",chain:1,st:[1,2],c:"salas",q:"Tu analítica parece la carta de un cóctel. O paras ya, o tu próxima canción la cantas en el más allá. Y allí no hay buena acústica.",opts:[
 {t:"Ingresar en desintoxicación.",fx:{d:-25,h:-10,s:25},set:{drogas:1},r:"Tres meses de terapia grupal. Escribes tu mejor disco. Se llama «Batido verde»."},
 {t:"Lo tengo controlado.",fx:{s:-10,h:5},f:{drogas:1},r:"La doctora te mira como se mira a un piloto que pregunta dónde está el freno."},
 {t:"¿Y si solo los fines de semana?",fx:{s:-5},r:"«Tu semana empieza el jueves y acaba el martes», responde la doctora. Tiene razón."}]},

{id:"drogas_final",chain:1,st:[1,2],c:"toni",q:"Te traigo lo último. Se llama «Despedida». Es el nombre comercial… creo.",opts:[
 {t:"Venga, la última.",die:"drogas",r:"Lo era."},
 {t:"No, Toni. Lo dejo.",die:"drogas",r:"Demasiado tarde: tu corazón iba en reserva desde hace meses y hoy se ha quedado sin gasolina."},
 {t:"Llamar a la Dra. Salas.",die:"drogas",r:"La ambulancia llega rapidísimo. Justo a tiempo para la autopsia."}]},

{id:"secta_final",chain:1,st:[1,2],c:"guru",q:"Herman[o|a], la Comunidad ha decidido que tus royalties, tu casa y tu nombre artístico nos pertenecen. Es por tu aura.",opts:[
 {t:"Escapar de noche.",fx:{d:-20,s:-10},set:{secta:0},r:"Huyes en una furgoneta de reparto de hummus. Pierdes dinero, pero recuperas las cejas."},
 {t:"Me quedo. Aquí soy feliz.",die:"secta",r:"Firmas todo con una sonrisa beatífica. Esa noche empieza el ayuno de luz."},
 {t:"Grabarlo todo para un documental.",fx:{h:25,o:10,s:-10,d:10},set:{secta:0},r:"«Krishna-Paco: el gurú de las chanclas» es lo más visto en streaming. El gurú te demanda. Tú facturas."}]},

{id:"hacienda_final",chain:1,st:[1,2],c:"ruiz",q:"Tras revisar sus calamares, sus bolos en negro y su intento de soborno con bocadillo, le comunico una sanción de… bastante.",opts:[
 {t:"Pagar.",fx:{d:-35},set:{hacienda:0},r:"Te quedas temblando, pero en paz con el Estado. Ruiz te desea «buena gira». Suena a amenaza."},
 {t:"Irme a vivir a Andorra.",fx:{o:-25,d:10,h:-10},set:{hacienda:0},r:"Te hacen un meme por cada día que pasas allí. Vuelves a los tres meses porque echas de menos el mar."},
 {t:"Componer «Inspector Ruiz, déjame vivir».",fx:{h:20,d:-20,o:5},set:{hacienda:0},r:"Ruiz la escucha. Le gusta. Te rebaja el recargo un 5 %."}]},

/* ---------- Crueldades (riesgo de muerte en el acto) ---------- */
{id:"stage_diving",st:[1,2],c:"tecnico",q:"¡El público está entregado! Bueno, son nueve personas, pero muy entregadas. ¿Te tiras de cabeza?",opts:[
 {t:"¡Me tiro!",fx:{h:15},risk:[.3,"diving"],r:"Te recogen nueve pares de brazos. Momento mágico. Uno aprovecha para robarte la cartera."},
 {t:"De espaldas y con los ojos cerrados.",fx:{h:25,o:5},risk:[.5,"diving"],r:"Pura fe. Te recogen. Lloras. Lloran. Alguien te ha mordido."},
 {t:"No, que tengo cervicales.",fx:{h:-10,s:5},r:"El público corea «¡ABU-RRI-D[O|A]!». Son nueve, pero se oye mucho."}]},

{id:"lluvia",st:[1,2],c:"tecnico",q:"Está diluviando, el escenario tiene charcos y los cables son de 1987. Pero oye, el público sigue ahí. ¿Enchufo?",opts:[
 {t:"Enchufa. El rock no se cancela.",fx:{h:20,d:15},risk:[.35,"electro"],r:"Chispas, humo y un solo de guitarra brutal. El pelo te tarda una semana en bajar."},
 {t:"Versión acústica bajo la lluvia.",fx:{h:10,s:-20,d:5},r:"Precioso. Romántico. Pillas una neumonía de las que salen en los libros de historia."},
 {t:"Cancelar.",fx:{o:-15,d:-15},r:"El público te tira lo que tiene a mano. Lo que tiene a mano es barro. Y un perro."}]},

{id:"mejillones",st:[1,2],c:"manolo",q:"Te he guardado una ración de mejillones de la semana pasada. Están casi buenos. Si no te los comes, me ofendo.",opts:[
 {t:"Comérmelos. No quiero ofender a Manolo.",fx:{s:-15,o:5},risk:[.2,"mejillones"],r:"Pasas dos días abrazad[o|a] al váter. Sale un disco conceptual: «Retortijones»."},
 {t:"Dárselos a Chema a escondidas.",fx:{o:-10},r:"Chema pasa tres días en urgencias. Nunca sabrá que fuiste tú. Tú sí. Duermes como un bebé."},
 {t:"No, gracias.",fx:{o:-5,d:-10},r:"Manolo se ofende y te cobra todos los calamares del año. Con IVA."}]},

{id:"selfie",st:[1,2],c:"lucia",q:"¡Selfie al borde del acantilado al atardecer! Da un pasito atrás… otro… un poquito más…",opts:[
 {t:"Un pasito más.",fx:{h:20},risk:[.3,"selfie"],r:"La foto es espectacular. A ti aún te tiemblan las piernas. Lucía dice que la próxima, más al borde."},
 {t:"Lo hacemos lejos del borde.",fx:{h:3},r:"«Pues vaya mierda de foto», dice Lucía, y la borra delante de ti."},
 {t:"Ponte tú en el borde, Lucía.",fx:{h:15,o:-10},r:"Lucía resbala, pero cae en un arbusto. Sube un vídeo llorando: cuatro millones de visitas. Te bloquea."}]},

{id:"toni_moldavia",st:[1,2],c:"toni",w:4,cond:()=>F("drogas")>=2,q:"Tengo algo nuevo de un laboratorio de Moldavia. No tiene nombre, solo número de serie. El último que lo probó vio a Dios. Y Dios le pidió un autógrafo.",opts:[
 {t:"Probarlo.",fx:{h:20,s:-20},f:{drogas:2},risk:[.2,"drogas"],r:"Compones un disco entero en una noche. Al despertar, está escrito en sánscrito."},
 {t:"Venderlo yo en el próximo bolo.",fx:{d:30,o:-20},f:{hacienda:1},r:"Ganas una pasta. Hacienda pregunta de dónde sale. «Merchandising», contestas."},
 {t:"Tirarlo al váter.",fx:{s:5,d:-15},r:"Toni te lo cobra igual. «Política de devoluciones», dice."}]},

{id:"forense",st:[1,2],c:"forense",w:2,cond:()=>F("drogas")>=2||S.st.s<=30,q:"Hola. No te asustes. Solo vengo a tomarte medidas. Por si acaso. Me gusta tener el trabajo adelantado.",opts:[
 {t:"Dejarme medir.",fx:{s:-10,h:5},r:"1,72 de largo. Te dice que hay ataúdes en oferta. Te guarda uno."},
 {t:"Cambiar de vida ahora mismo.",fx:{s:15,h:-15,d:-10},set:{drogas:0},r:"Te apuntas a pilates. El forense se va decepcionado, pero te deja su tarjeta."},
 {t:"Pedirle que me patrocine.",fx:{d:15,o:-15},r:"Funeraria La Última Nota patrocina tu gira. El logo es un ataúd con guitarra. Da muy mal rollo."}]},

/* ---------- ETAPA 2 · Primer éxito ---------- */
{id:"megasound",st:[2],c:"montero",w:5,q:"Te ofrecemos un contrato de cinco discos. Nosotros elegimos las canciones, la ropa, el peinado y tu pareja de cara a la prensa.",opts:[
 {t:"Firmar.",fx:{d:30,h:20,o:-5},set:{megasound:1},r:"Te tiñen de un color que no existe en la naturaleza. Te queda bien. Lo odias."},
 {t:"Negociar libertad creativa.",fx:{d:10,h:10,o:10},r:"Consigues elegir el peinado. Lo demás, no. Algo es algo."},
 {t:"Seguir indie.",fx:{o:15,h:-5,d:-10},set:{indie:1},r:"La revista de culto te llama «auténtic[o|a]». La revista de culto tiene 800 lectores."}]},

{id:"pareja_prensa",st:[2],c:"montero",w:6,nogen:["laura"],cond:()=>F("megasound"),q:"Te hemos asignado pareja mediática: un futbolista de Segunda B. Sonríe en las fotos y no hables de política.",opts:[
 {t:"Aceptar y sonreír.",fx:{h:20,s:-5},r:"Os pillan «por sorpresa» en una playa. La sorpresa estaba en el contrato, cláusula 7."},
 {t:"Negarme.",fx:{o:5,d:-15},r:"Te multan por incumplimiento. El futbolista, aliviado, te manda flores."},
 {t:"Prefiero al portero.",fx:{h:15,o:10},r:"El portero resulta ser majo. Es lo único auténtico que hay en tu vida."}]},

{id:"melon",st:[2],c:"melon",q:"Tu canción está bien, pero le falta perreo. Y un sample de un ascensor. Y gritar «DJ Melón» cada veinte segundos.",opts:[
 {t:"Aceptarlo todo.",fx:{h:20,o:-5},set:{melon:1},r:"La canción es un pelotazo. Nadie recuerda tu nombre, pero todo el mundo grita «DJ Melón»."},
 {t:"Solo el perreo.",fx:{h:10,o:3},set:{melon:1},r:"Equilibrio perfecto entre arte y caderas."},
 {t:"Echarle del estudio.",fx:{o:5,h:-5,s:5},r:"DJ Melón se va gritando «DJ Melón». Es su firma también al salir."}]},

{id:"paparazzi",st:[2],c:"paco",q:"Te he pillado sacando la basura en pijama de unicornio. ¿Exclusiva pagada o lo publico gratis con un titular cruel?",opts:[
 {t:"Pagarle.",fx:{d:-15},r:"Lo publica igual tres meses después, en la sección «Así eran antes de ser nadie»."},
 {t:"Posar con orgullo.",fx:{h:15,o:5},r:"El pijama se agota en internet. No cobras ni un euro."},
 {t:"Tirarle la bolsa de basura.",fx:{h:10,o:-10},r:"Foto aún mejor. Titular: «[El cantante|La cantante] se recicla»."}]},

{id:"gala",st:[2],c:"gala",q:"¡Estás nominad[o|a] a Artista Revelación! Si no ganas, la cámara te enfocará igualmente. Practica tu cara de «me alegro por los demás».",opts:[
 {t:"Ir vestid[o|a] de jamón ibérico.",fx:{h:25,o:-10,s:-5},r:"El jamón huele. El jamón suda. El jamón es portada de todo."},
 {t:"Ir elegante y aplaudir a los ganadores.",fx:{o:10},r:"No ganas. Tu cara de alegría falsa se hace viral como «la persona más educada de España»."},
 {t:"Subir al escenario aunque no gane.",fx:{h:20,o:-15},r:"Le quitas el micro a la ganadora. Kira Star. Merecía la pena."}]},

{id:"afterparty",st:[2],c:"lucia",cond:()=>F("drogas")>=1,q:"Afterparty en mi casa. Habrá polvos mágicos. No, no son de hadas.",opts:[
 {t:"Ir a por todas.",fx:{h:15,s:-15},f:{drogas:1},r:"Te despiertas en una bañera vacía con un flamenco hinchable. No sabes de quién es el flamenco."},
 {t:"Ir, pero solo agua.",fx:{h:5,o:5},r:"Eres la única persona sobria. Ves cosas. Las apuntas para tu próximo disco."},
 {t:"Quedarme en casa.",fx:{s:10,h:-8},r:"Ves una serie de cocina. Descubres que te gusta el risotto. Peligroso."}]},

{id:"gira",st:[2],c:"vero",w:4,q:"La gira: cuarenta fechas en cuarenta y cinco días. El autobús no tiene ducha, pero tiene un ambientador de pino precioso.",opts:[
 {t:"Hacer las cuarenta.",fx:{d:30,s:-25,h:15},r:"En la fecha 31 ya no sabes en qué ciudad estás. Saludas a «Cuenca» en Badajoz."},
 {t:"Recortar a veinte.",fx:{d:15,s:-10,h:5},r:"Equilibrio sensato. Los fans de las otras veinte ciudades te queman la camiseta en efigie."},
 {t:"Gira acústica por residencias de ancianos.",fx:{o:20,d:5,s:5,h:-5},r:"Los abuelos te adoran. Uno te deja en herencia una caravana y dos canarios."}]},

{id:"kira_plagio",st:[2],c:"kira",q:"Tu nuevo single suena igual que el mío. Te voy a denunciar. O… fingimos una pelea en redes y ganamos los dos.",opts:[
 {t:"Pelea falsa.",fx:{h:25,o:-5},r:"Os insultáis con un guion escrito por la misma agencia. Las dos canciones suben al top 10."},
 {t:"Juicio.",fx:{d:-15,o:5,h:10},r:"El juez escucha las dos canciones y declara que ambas son «igual de malas»."},
 {t:"Admitir que me inspiré.",fx:{o:10,h:-5},r:"La honestidad te sienta bien. Kira, confundida, no sabe cómo reaccionar ante algo sincero."}]},

{id:"hijo",st:[2],c:"desconocido",q:"Hola. Según una página web, soy tu hij[o|a] secret[o|a]. Tengo 34 años.",opts:[
 {t:"Pedir una prueba de ADN.",fx:{d:-5,s:-5,h:5},r:"No es tu hijo. Es tu primo Iván, el interventor. Quería salir en la tele."},
 {t:"Abrazarle en directo en un programa.",fx:{h:20,o:10,d:-10},r:"Lágrimas, música de piano, cuatro millones de espectadores. Nadie te pregunta por las matemáticas."},
 {t:"Ignorarle.",fx:{o:-10},r:"Va a todos los platós contando que le abandonaste. Cobra más que tú por entrevista."}]},

{id:"focas",st:[2],c:"ong",q:"Concierto benéfico para salvar a la foca monje. No cobras, pero sales en la tele al lado de gente mucho más famosa que tú.",opts:[
 {t:"Ir.",fx:{o:20,d:-10,h:10},r:"Cantas bien, sonríes mejor y una foca te salpica en directo. Imagen del año."},
 {t:"Pedir caché.",fx:{d:10,o:-20},r:"Se filtra tu factura. «¿Cobrar a las focas?», titula todo el mundo."},
 {t:"Ir y adoptar dos focas.",fx:{o:10,h:15,s:-10},r:"Las focas viven ahora en tu bañera. La comunidad de vecinos te denuncia. Las focas, encantadas."}]},

{id:"yate",st:[2],c:"jeque",q:"Fiesta en mi yate. Champán, influencers y… ingredientes recreativos. No hagas preguntas, que es lo elegante.",opts:[
 {t:"Ir y probar de todo.",fx:{h:15,s:-15},f:{drogas:1},r:"Te despiertas en Mónaco. No sabes cómo has llegado. Tampoco tienes pasaporte."},
 {t:"Ir, pero sin probar nada.",fx:{h:5,o:5},r:"Haces amistad con el capitán. Es el único que sabe dónde estáis."},
 {t:"No ir.",fx:{s:10,h:-10},r:"Al día siguiente el yate sale en las noticias. No por nada bueno."}]},

{id:"tuit",st:[2],c:"bea",q:"Alguien ha desenterrado un tuit tuyo de 2014: «las pasas son el ébola de la fruta». Hay una cancelación en marcha.",opts:[
 {t:"Pedir perdón con fondo blanco y piano.",fx:{o:10,h:-5},r:"El vídeo es tan triste que la gente te perdona por pena."},
 {t:"Redoblar: «Y las ciruelas, el cólera».",fx:{h:20,o:-15},r:"Los productores de ciruelas se manifiestan delante de tu casa. Te tiran ciruelas. Están ricas."},
 {t:"Borrar todas las redes.",fx:{s:15,h:-15},r:"Por primera vez en años, duermes ocho horas seguidas."}]},

{id:"mama_bingo",st:[2],c:"mama",q:"Hij[o|a], ahora que eres famos[o|a], mis amigas quieren entradas. Les he prometido cuarenta. Y una foto contigo en el bingo.",opts:[
 {t:"Ir al bingo.",fx:{o:15,s:-5,h:5},r:"Acabas cantando los números. Literalmente. Es tu mejor actuación del año."},
 {t:"Darle las cuarenta entradas.",fx:{d:-10,o:5},r:"Cuarenta señoras en primera fila con abanicos. La crítica lo llama «el público más leal de España»."},
 {t:"«Mamá, tengo una carrera».",fx:{o:-10},set:{mama_dolida:1},r:"Te recuerda las treinta y seis horas de parto. Pierdes la discusión en cuatro segundos."}]},

{id:"himno",st:[2],c:"presi",q:"Queremos que cantes el himno en la final de copa. Ojo: el último que desafinó salió del estadio en camilla.",opts:[
 {t:"Cantar en directo.",fx:{h:15,o:10,s:-5},r:"Lo clavas. Cuarenta mil personas te corean. Por un momento, eres invencible."},
 {t:"Hacer playback.",fx:{h:5,o:-10},r:"Se va la luz a mitad del himno. Tu voz sigue sonando. Silencio de cuarenta mil personas."},
 {t:"Cantar el himno del rival por error.",fx:{h:25,o:-20,s:-15},r:"Sales del estadio en helicóptero. Literalmente."}]},

{id:"isla",st:[2],c:"reality",q:"Concurso en una isla desierta. Pagamos muy bien y prometemos no ponerte en peligro. (No prometemos nada).",opts:[
 {t:"Ir.",fx:{d:25,h:20,s:-20},r:"Pierdes ocho kilos, dos amistades y la fe en la humanidad. Ganas seguidores."},
 {t:"Rechazarlo.",fx:{o:5,h:-5},r:"Va Kira Star. Se come una medusa. Audiencia récord."},
 {t:"Ir y comerme un cangrejo vivo en directo.",fx:{h:30,o:-15,s:-15,d:15},r:"El cangrejo se defiende. El vídeo da la vuelta al mundo. El cangrejo tiene ahora club de fans."}]},

{id:"vozai",st:[2],c:"vozai",q:"Clonamos tu voz con IA y sacamos trescientas canciones al mes. Tú no haces nada. Cobras un 2 %.",opts:[
 {t:"Firmar.",fx:{d:20,h:10,o:-15},set:{clon:1},r:"Tu clon saca un disco de reguetón navideño. Es tu mayor éxito. Nunca lo has cantado."},
 {t:"Rechazar.",fx:{o:10,h:-5},r:"Te clonan igual. Ahora tienes que demandar a una voz que es tuya."},
 {t:"Clonad a mi cuñado y que deje de llamarme.",fx:{s:10,d:-5},r:"El cuñado artificial te llama igual, pero al menos te da la razón."}]},

{id:"avioneta",st:[2],c:"piloto",q:"Para llegar a tiempo al festival tengo esta avioneta de 1964. Tranquil[o|a], que solo me he tomado dos carajillos.",opts:[
 {t:"Subirme. El show debe continuar.",fx:{h:15,d:20},risk:[.3,"avion"],r:"Aterrizáis en un campo de girasoles a 40 km del festival. Llegas en tractor. Eres leyenda."},
 {t:"Ir en coche toda la noche.",fx:{s:-20,h:5,d:5},r:"Conduces nueve horas a base de café. Tocas como un zombi. La crítica lo llama «emocionalmente desnudo»."},
 {t:"No ir.",fx:{o:-15,h:-15,d:-20},r:"Penalización de contrato, fans indignados y un hilo de Twitter que te llama «diva de mercadillo»."}]},

{id:"tigre",st:[2],c:"director",q:"Para el videoclip tengo un tigre de verdad. Está casi domesticado. Solo se ha comido a un ayudante, y era el de prácticas.",opts:[
 {t:"Rodar con el tigre.",fx:{h:25,d:-5},risk:[.25,"tigre"],r:"El tigre te lame la cara. Lo tomas por cariño. Estaba comprobando si estabas en su punto."},
 {t:"Tigre por ordenador.",fx:{d:-20,h:5},r:"El tigre digital parece un peluche con hipo. Los memes te persiguen un mes."},
 {t:"Un gato maquillado de tigre.",fx:{h:10,o:5,s:-5},r:"El gato te destroza la cara igualmente. El videoclip gana un premio de cine independiente."}]},

{id:"cirugia",st:[2],c:"cirujano",q:"Retoque de cara a precio de saldo en mi clínica (un bajo con cortinas). Labios, pómulos y, de regalo, te quito una costilla. Para la cintura.",opts:[
 {t:"Ir. Es una ganga.",fx:{h:15,s:-20},risk:[.25,"cirugia"],r:"Vuelves con la cara de otra persona. Más guapa, eso sí. Tu madre no te reconoce en el aeropuerto."},
 {t:"Ir a un cirujano caro.",fx:{d:-30,h:10},r:"Quedas estupend[o|a]. Nadie lo nota. Has pagado 20.000 € para que nadie lo note."},
 {t:"Me acepto tal como soy.",fx:{o:10,h:-10},r:"Mensaje precioso. Las revistas titulan: «[Él|Ella] se ha dejado»."}]},

{id:"firma_discos",st:[2],c:"vero",q:"Firma de discos en un centro comercial: hay sitio para doscientas personas y han venido cinco mil. Hay una sola puerta.",opts:[
 {t:"Salir a saludar.",fx:{o:15,h:15},risk:[.3,"fans"],r:"Te arrancan media camiseta y un mechón. Sales viv[o|a] y en topless parcial. Portada."},
 {t:"Escapar por la puerta de atrás.",fx:{o:-20,h:-5},r:"Te pillan escapando dentro de un contenedor. Titular: «La basura reconoce a la basura»."},
 {t:"Cantar desde el balcón.",fx:{h:10,s:-5},r:"Momento épico. Alguien te tira un sujetador. Luego una botella. Luego una silla."}]},

{id:"mariano",st:[2],c:"mariano",w:4,q:"Canta en la comunión de mi nieta. Si le gusta, te pago cincuenta mil. Si no le gusta… también te pago, pero de otra forma.",opts:[
 {t:"Ir y darlo todo.",fx:{d:35},set:{mariano_amigo:1},risk:[.25,"mafia"],r:"A la niña le encanta. Don Mariano te abraza. Notas algo duro bajo su chaqueta. No es la cartera."},
 {t:"Rechazarlo con educación.",fx:{o:5},f:{mafia:1},r:"«Qué pena», dice. Al día siguiente hay un ladrillo en el asiento de tu coche. Dentro. Con el coche cerrado."},
 {t:"Pedir el doble.",fx:{d:45},f:{mafia:1},r:"Te paga sonriendo. Esa sonrisa la vas a ver en tus pesadillas."}]},

{id:"mariano_2",st:[2],c:"mariano",w:5,cond:()=>F("mafia")===1,q:"Mi sobrino quiere ser cantante. Canta fatal. Le vas a hacer un dueto. Y le vas a dar las gracias en los premios.",opts:[
 {t:"Hacer el dueto.",fx:{o:-15,h:-10,d:10},set:{mafia:0,mariano_amigo:1},r:"El sobrino desafina como una gaviota atropellada. Don Mariano llora de orgullo. Estás a salvo. Por ahora."},
 {t:"Decirle la verdad: canta fatal.",fx:{o:10},f:{mafia:1},r:"El silencio dura once segundos. Nunca once segundos fueron tan largos."},
 {t:"Huir del país una temporada.",fx:{d:-30,h:-15},set:{mafia:0},r:"Seis meses en un pueblo de Laos. Vuelves cuando Don Mariano entra en prisión por otra cosa. Sale a los tres días."}]},

{id:"mariano_final",chain:1,st:[1,2],c:"mariano",q:"Ya te dije que no me gusta que me hagan feos. Vamos a dar un paseo en barco. Te he comprado unos zapatos nuevos.",opts:[
 {t:"Qué zapatos más pesados…",die:"mafia",r:"Son de cemento. Del 42."},
 {t:"Huir a Portugal.",die:"mafia",r:"Don Mariano tiene primos en Portugal. Y en todas partes."},
 {t:"Ofrecerle todos mis royalties.",die:"mafia",r:"Los acepta, muy agradecido. Y luego, el paseo en barco. Por si acaso."}]},

{id:"hater",st:[2],c:"hater",q:"Te espero a la salida del concierto. Tengo tu dirección, tu horario y un cuchillo jamonero. Con cariño, tu mayor hater.",opts:[
 {t:"Denunciarle a la policía.",fx:{d:-5,s:-10},r:"La policía te recomienda «no salir de casa». Un mes encerrad[o|a] componiendo canciones sobre pánico."},
 {t:"Contestarle con un zasca en redes.",fx:{h:20,o:5},risk:[.25,"hater"],r:"El zasca es viral. El hater no aparece. Por ahora."},
 {t:"Invitarle al camerino a hablar.",fx:{o:15,h:10},risk:[.4,"hater"],r:"Viene. Habláis. Llora. Solo quería que le firmaras el cuchillo."}]},

{id:"mama_medico",st:[2],c:"mama",q:"Hij[o|a], el médico dice que me quedan seis meses. ¿Me escribirías una canción?",opts:[
 {t:"Escribirle la canción más bonita del mundo.",fx:{h:20,o:15,s:-10},r:"Es número 1. Tu madre se recupera milagrosamente y te reclama el 50 % de los royalties."},
 {t:"Usarlo para la promoción del disco.",fx:{h:30,o:-25,d:15},set:{mama_dolida:1},r:"«Mi madre se muere, compra mi disco». Vendes muchísimo. Tu madre se entera por la tele."},
 {t:"«Mamá, eso mismo dijiste en 2019».",fx:{s:5,o:-5},r:"Tiene razón. Es el mismo médico. Es su amigo del bingo."}]},

{id:"muerte_falsa",st:[2],c:"montero",q:"Idea de marketing: fingimos tu muerte. Los artistas muertos venden diez veces más. Resucitas en tres meses con disco nuevo.",opts:[
 {t:"Fingir mi muerte.",fx:{d:30,h:25,o:-25},r:"Vas a tu propio funeral disfrazad[o|a]. Lloran cuatro personas. Tu ex aplaude. Tu cuñado pregunta por la herencia."},
 {t:"Ni de broma.",fx:{o:5,d:-10},r:"La discográfica te mira como se mira una inversión que no rinde. Te cambian el camerino por un baño."},
 {t:"Fingir la muerte de Kira Star.",fx:{h:20,o:-20},set:{kira_enemiga:1},r:"Kira se entera por un tuit de pésame. Te declara la guerra. Y gana 300.000 seguidores. Con su propia muerte."}]},

{id:"kira_venganza",st:[2],c:"kira",w:4,cond:()=>F("kira_enemiga"),q:"He contratado a un detective. Tengo tus fotos del instituto, tus tuits borrados y a tu ex. ¿Negociamos o lo suelto todo?",opts:[
 {t:"Negociar: le cedo mi mejor canción.",fx:{h:-20,d:-10},set:{kira_enemiga:0},r:"Kira la canta. Es número 1. Cada vez que suena en la radio, una parte de ti muere."},
 {t:"Que lo suelte. No tengo vergüenza.",fx:{o:-25,h:20},r:"Tu foto con aparato, flequillo y camiseta de un grupo de ska se convierte en el meme del año."},
 {t:"Contratar yo a otro detective.",fx:{d:-20,h:15},r:"Descubre que Kira se llama Encarni y es de Albacete. Guerra fría. Destrucción mutua asegurada."}]},

/* --- Arcos de personajes en la etapa 2 --- */
{id:"benito_satan",st:[2],c:"benito",w:4,q:"Hij[o|a] mí[o|a], el obispo dice que tu disco, escuchado al revés, dice «Satanás mola». ¿Es verdad?",opts:[
 {t:"Es verdad. Y suena genial.",fx:{h:25,o:-20},r:"Los metaleros te adoran. Tu madre reza por ti en tres parroquias a la vez."},
 {t:"Grabar un disco de canto gregoriano.",fx:{o:15,h:-10},set:{benito_amigo:1},r:"El Vaticano lo pone en la sala de espera. Ventas: discretas. Indulgencias: muchas."},
 {t:"Donar a la parroquia para que se calle.",fx:{d:-15,o:5},set:{benito_amigo:1},r:"El obispo se compra un coche. Tu disco al revés ahora dice «Dios mola». Milagro."}]},

{id:"manolo_cierra",st:[2],c:"manolo",w:4,q:"El Bar Pepe cierra. Me han triplicado el alquiler para hacer pisos turísticos. Aquí empezaste tú…",opts:[
 {t:"Concierto benéfico en el bar.",fx:{o:15,h:10,s:-5,d:-5},set:{manolo_amigo:1},r:"Lleno hasta la bandera. Recaudáis lo justo para seis meses más y para tirar los mejillones. No los tira."},
 {t:"Comprar el bar.",fx:{d:-25,o:10},set:{bar:1,manolo_amigo:1},r:"Ahora eres dueñ[o|a] de un bar con una tragaperras y un camarero llorando de alegría."},
 {t:"Ya no me acuerdo de ese bar.",fx:{o:-20,s:5},set:{manolo_dolido:1},r:"Manolo te cuelga. Al día siguiente, tu foto del bar acaba en el baño. Encima del urinario."}]},

{id:"chema_solo",st:[2,3],c:"chema",w:3,cond:()=>!F("chema_fuera"),q:"He grabado un disco en solitario. Se llama «Yo también existo». ¿Me haces de telonero?",opts:[
 {t:"Hacerle de telonero.",fx:{o:15,h:-10},r:"El público viene por ti y se queda por Chema. Te odias un poquito."},
 {t:"Que me haga él de telonero a mí.",fx:{h:5,o:-5},r:"Chema acepta con una sonrisa que da miedo. Toca el bombo un pelín más fuerte de lo normal."},
 {t:"Escuchar el disco con sinceridad.",fx:{s:-5,o:5},r:"Es bueno. Muy bueno. Mejor que lo tuyo. Le dices que «tiene cosas». Se le nota la herida."}]},

/* ---------- ETAPA 3 · CD en top mantas (id interno 5) ---------- */
{id:"tm_ousmane",st:[5],c:"ousmane",w:6,q:"Tu disco es el que más vendo, {name}. Más que el de Kira y más que las gafas de sol. Tres euros la copia. ¿Te parece mal o te hago un descuento por ser tú?",opts:[
 {t:"Véndelo. Prefiero que me escuchen a que me paguen.",fx:{h:20,d:-5,o:5},set:{manta_amigo:1},later:["tm_redada",6],r:"Ousmane te da la mano y te regala una copia de tu propio disco. La carátula es mejor que la original."},
 {t:"Quiero mi parte. El 50 %.",fx:{d:10,o:-10},r:"Te da 1,50 € y una mirada que no olvidarás. «El arte es caro, hermano», dice. «Para quien lo compra»."},
 {t:"Le pido que lo quite de la manta.",fx:{o:-5,h:-10},r:"Lo quita. En su lugar pone el de Kira Star. Al día siguiente, Kira está en el número uno de las mantas."}]},
{id:"tm_redada",chain:1,st:[5],c:"comisario",q:"Redada en el paseo marítimo. Hemos incautado cuatrocientas copias de su disco. ¿Quiere presentar denuncia contra los vendedores?",opts:[
 {t:"No. Ese disco se lo regalé yo.",fx:{o:15,h:10,d:-5},f:{policia:1},r:"El comisario te mira como a un delincuente con estudios. Ousmane recupera la manta. En el paseo te aplauden."},
 {t:"Sí, que se haga justicia.",fx:{o:-15,d:5},r:"Te dan las gracias en comisaría. En el paseo, alguien pinta en la pared: «{name} vendid[o|a]». Lo pintan bien, eso sí."},
 {t:"Pedir que me devuelvan las copias para firmarlas.",fx:{h:15,o:5,d:10},r:"Firmas cuatrocientas copias piratas. Ahora valen el triple. Ousmane te manda un audio llorando de risa."}]},
{id:"tm_anselmo",st:[5],c:"anselmo",w:4,q:"Le comunico que la Sociedad de Autores y Editores Cabreados ha detectado su música en una manta, en una boda y en el móvil de un menor. Le corresponden 3,27 € de derechos. Menos gastos de gestión: le debe 40 €.",opts:[
 {t:"Pagar y no preguntar.",fx:{d:-10},r:"Te da un recibo en papel carbón. Debajo pone «gestión de la gestión». No preguntas."},
 {t:"Denunciar a la Sociedad en Twitter.",fx:{h:15,o:5,d:-5},r:"Tu hilo se hace viral. La Sociedad te contesta con un comunicado de catorce páginas. Nadie pasa de la primera."},
 {t:"Hacerme soci[o|a] para cobrar yo también.",fx:{d:5,o:-10},r:"Te nombran vocal de algo. Cobras dietas por reuniones a las que no vas. Te sientes suci[o|a]. Y descansad[o|a]."}]},
{id:"tm_mama",st:[5],c:"mama",w:4,q:"Hij[o|a], he comprado veinte discos tuyos a ese chico tan majo del paseo. Para regalar en Navidad. Tres euros, ¡y sin IVA! ¿Ves cómo ayudo?",opts:[
 {t:"Mamá, son piratas.",fx:{o:3,s:-3},r:"«¿Piratas? Si el chico era muy educado». Regala los veinte igualmente. Tu tía dice que suenas «a lata»."},
 {t:"Gracias, mamá. De verdad.",fx:{o:5,s:5},r:"Se emociona y compra veinte más. El paseo entero sabe ya que eres su hij[o|a]."},
 {t:"Pídele factura, por lo menos.",fx:{h:5,o:-3},r:"Ousmane escribe una factura en un posavasos. Tu madre la enmarca. Al lado del táper."}]},
{id:"tm_montero",st:[5],c:"montero",w:5,q:"Megasound pierde dinero cada vez que un mantero vende tu disco. Vamos a meter un chip anticopia en el próximo. Si alguien lo copia, el CD explota. Un poco.",opts:[
 {t:"Me parece fatal.",fx:{o:10,d:-10},r:"La Sra. Montero apunta tu nombre en una libreta negra. Tiene muchas páginas y casi todas son de artistas con principios."},
 {t:"Me parece bien.",fx:{d:15,o:-15},risk:[.12,"cd"],r:"Sale el disco con chip. Explotan tres equipos de música, un coche y la paciencia de tus fans."},
 {t:"Que el chip toque mi canción al explotar.",fx:{h:15,o:-5},r:"Marketing de guerrilla. Literalmente. Los CDs que explotan se vuelven objeto de culto."}]},
{id:"tm_cunado",st:[5],c:"cunado",w:4,q:"Me he comprado tu disco en la manta. Tres euros. Y te digo una cosa: para ser pirata, suena mejor que el original. ¿Qué has hecho en el estudio, estropearlo?",opts:[
 {t:"Darle la razón.",fx:{o:3,h:-3},r:"Se viene arriba y te da consejos de producción toda la cena. Le ha salido un máster en ecualización por WhatsApp."},
 {t:"Pedirle los tres euros para mí.",fx:{d:3,o:-3},r:"Te los da en monedas de céntimo. Tardas veinte minutos en contarlas delante de toda la familia."},
 {t:"Grabar el próximo disco en la manta.",fx:{h:15,s:-5},r:"Grabas con un micro de karaoke en el paseo marítimo. El ruido de las olas queda precioso. Las gaviotas piden royalties."}]},
{id:"tm_melon",st:[5],c:"melon",w:4,q:"Bro, he hecho un remix de tu canción con el sonido de la manta al recogerse cuando llega la policía. Se llama «Fluuush». Está petando en las discotecas de Lloret.",opts:[
 {t:"¡Súbelo con mi nombre!",fx:{h:20,o:-5},r:"«Fluuush (feat. {name})» es la canción del verano. La bailan hasta los municipales."},
 {t:"Exijo mi parte.",fx:{d:10,h:-5},r:"DJ Melón te paga en tickets de copa. Gratis no es. Dinero tampoco."},
 {t:"Prohibirlo. Es una falta de respeto.",fx:{o:5,h:-10},r:"El remix se vuelve más famoso por estar prohibido. Ahora se vende en la manta. Al lado de tu disco."}]},
{id:"tm_paco",st:[5],c:"paco",w:4,q:"Tengo fotos de usted comprando su propio disco en una manta. Tres copias. ¿Las publico como «artista desesperad[o|a]» o como «artista solidari[o|a]»?",opts:[
 {t:"Solidari[o|a], por favor.",fx:{d:-10,o:10},r:"Le pagas y sale la portada amable. Debajo, en letra pequeña: «(según fuentes pagadas)»."},
 {t:"Desesperad[o|a]. Es la verdad.",fx:{h:10,o:-5,s:-3},r:"La sinceridad vende. Tu disco sube en las listas. En las oficiales y en las de la manta."},
 {t:"Comprarle la cámara.",fx:{d:-15,h:5},r:"Te la vende. Tiene otra en la mochila. Siempre tienen otra en la mochila."}]},
{id:"tm_ruiz",st:[5],c:"ruiz",w:3,q:"Hacienda ha detectado ventas de su disco por valor de 40.000 € en el paseo marítimo. ¿Me explica por qué no constan en su declaración?",opts:[
 {t:"Porque no las he cobrado yo.",fx:{o:5,d:-5},r:"El inspector Ruiz suspira. Lleva tres meses intentando hacerle una paralela a una manta. No hay manera."},
 {t:"Declararlas por si acaso.",fx:{d:-20,o:5},r:"Pagas impuestos por un dinero que nunca has visto. Ruiz se emociona: es el primer contribuyente voluntario de su carrera."},
 {t:"Culpar a mi cuñado.",fx:{h:5,o:-5},f:{hacienda:1},r:"Ruiz apunta el nombre de tu cuñado. Y el tuyo, por si acaso. Con rotulador rojo."}]},
{id:"tm_kira",st:[5],c:"kira",w:4,q:"Me he enterado de que tu disco vende más que el mío en las mantas. Así que he comprado todas las copias del paseo. Para quemarlas. Bueno, para que no las compre nadie.",opts:[
 {t:"Gracias por comprar mi disco, Kira.",fx:{d:10,h:10},r:"Ousmane te manda tu parte, encantado. Kira tarda dos días en darse cuenta de que te ha hecho ric[o|a] la competencia."},
 {t:"Comprar todas las copias del suyo.",fx:{d:-15,h:5},r:"Tienes ahora doscientos CDs de Kira Star en el garaje. Los usas de posavasos. Uno de cada dos tiene su cara."},
 {t:"Montar un cara a cara en el paseo.",fx:{h:20,o:-5,s:-5},r:"Batalla de gallos entre mantas. Ganas por desafinar con más estilo. Ousmane hace de jurado y de taquilla."}]},
{id:"tm_tito",st:[5],c:"tito",w:3,q:"En el Bar Pepe ponemos tu disco pirata a todo volumen. El original salta. El pirata no. ¿Firmas la copia de la casa?",opts:[
 {t:"Firmarla con cariño.",fx:{o:5},r:"La cuelgan encima de la tragaperras. La tragaperras ya no aplaude: ahora llora de envidia."},
 {t:"Una caña y la firmo.",fx:{h:3,s:-3},f:{alcohol:1},r:"Una caña y otra. Firmas el CD, la barra y la frente del Tito. Él lo enseña orgulloso a todo el que entra."},
 {t:"Exigir que pongan el original.",fx:{o:-5,d:2},r:"Ponen el original. Salta en el estribillo. Tres veces. Manolo te mira y vuelve a poner el pirata."}]},
{id:"tm_sindicato",st:[5],c:"ousmane",w:4,cond:()=>F("manta_amigo"),q:"El Sindicato de Manteros quiere hacerte socio de honor. Te diseñamos camiseta propia, con tu cara. Solo te pedimos un concierto gratis en la plaza.",opts:[
 {t:"Concierto en la plaza.",fx:{h:20,o:15,d:-10,s:-5},r:"Cantas encima de cuatro mantas juntas. Cuando llega la policía, el escenario se recoge solo con un tirón. El mejor final de concierto de tu vida."},
 {t:"Acepto la camiseta, pero sin concierto.",fx:{o:-5,h:5},r:"La camiseta se vende más que tu disco. Te alegras. Un poco."},
 {t:"Prefiero no mezclarme.",fx:{o:-10,s:3},r:"Ousmane asiente sin enfadarse. Esa misma tarde, tu disco baja de la primera fila de la manta a la segunda."}]},
{id:"tm_turista",st:[5],c:"jessica",w:3,q:"¡{name}! ¡Estoy de vacaciones en Benidorm y tu disco está en TODAS las mantas! Me he comprado once. Uno para cada día. ¿Me firmas la manta entera?",opts:[
 {t:"Firmar la manta.",fx:{o:5,h:5},r:"Ousmane te deja firmar la manta. Luego la vende como manta firmada. Por cuarenta euros. Jessica la compra."},
 {t:"Huir por el paseo.",fx:{s:-5,h:3},r:"Corres entre sombrillas. Jessica corre más. Te alcanza en el chiringuito y te pide una foto con la boca llena de calamares."},
 {t:"Pedirle que compre originales.",fx:{o:-5,d:3},r:"Compra el original. Lo pone al lado de los once piratas. Dice que es «el raro de la familia»."}]},
{id:"tm_bea",st:[5],c:"bea",w:4,q:"Te propongo una campaña: «Si me piratean, que sea con estilo». Subimos un tutorial de cómo copiar tu disco bien. Con calidad alta. Los de la discográfica se van a morir.",opts:[
 {t:"¡Adelante!",fx:{h:25,o:5,d:-10},r:"El tutorial tiene dos millones de visitas. Megasound te manda una carta en mayúsculas. La enmarcas."},
 {t:"Mejor un tutorial de cómo comprarlo.",fx:{o:3,h:-3,d:5},r:"Tiene catorce visitas. Doce son de tu madre. Las otras dos, de Bea comprobando que se ve."},
 {t:"Despedir a Bea.",fx:{o:-5,s:3},r:"Bea se va a trabajar para Kira. A la semana, Kira sube un tutorial de cómo piratearte a ti. Con mejores luces."}]},
{id:"tm_brayan",st:[5],c:"brayan",w:3,q:"Bro, olvídate del CD, eso es de boomers. Vamos a convertir cada copia pirata en un NFT. Pirata pero en la blockchain. Pirata 3.0. ¿Lo pillas?",opts:[
 {t:"No lo pillo, pero entro.",fx:{d:-15,h:10},alt:[.4,{d:25,h:10},"Contra todo pronóstico, los NFT piratas se venden. Un coleccionista de Singapur paga una fortuna por el «CD rayado nº 4»."],r:"Los NFT bajan un 98 % en una tarde. Brayan te manda un audio: «Es la volatilidad, bro». Él se compra un Lambo."},
 {t:"No.",fx:{o:3},r:"Brayan te bloquea, te desbloquea y te manda una invitación a su curso de 900 €."},
 {t:"Le vendo mi CD original como NFT a él.",fx:{d:10,o:-3},r:"Te lo compra sin escucharlo. Lo cuelga en su foto de perfil. Es lo más parecido a un fan que ha tenido nunca."}]},
{id:"tm_feria",st:[5],c:"alcalde",w:3,q:"Para las fiestas de Villarriba de Abajo queremos que cantes. Pero el presupuesto da para lo que da: te pagamos en copias de tu disco. Piratas. Las incautó la policía local.",opts:[
 {t:"Acepto. Por el pueblo.",fx:{o:10,h:10,d:-5},r:"Cantas en la plaza entre la tómbola y la verbena. Repartes tus copias piratas al público. Te vuelven a comprar el original por pena."},
 {t:"O me pagáis en euros o no canto.",fx:{d:10,o:-10},r:"Te pagan en euros. Te los dan en un sobre con el escudo del pueblo. Al día siguiente sale en el periódico: «Caché de la vergüenza»."},
 {t:"Cantar gratis y vender yo las copias.",fx:{d:15,o:-5},f:{policia:1},r:"Pones tu propia manta en la verbena. El concejal de seguridad te mira raro. Vendes cien copias. Él compra una."}]},
{id:"tm_herrera",st:[5],c:"herrera",w:3,q:"Puedo demandar a todos los manteros de España en una sola demanda colectiva. Ganaríamos 0 € y saldría en todos los periódicos. Mi minuta, eso sí, son 30.000.",opts:[
 {t:"No, gracias.",fx:{o:5},r:"Herrera te cobra igualmente la consulta. Quince minutos. Ha tardado cuarenta en explicarlo."},
 {t:"Demándelos a todos.",fx:{d:-20,o:-20,h:15},r:"Sales en todos los periódicos. Como el villano. Tu disco se convierte en el más pirateado del año, por rabia."},
 {t:"Mejor demande a Kira por plagio.",fx:{d:-10,h:15},r:"El juicio no lleva a nada, pero los dos discos se venden el doble. En la manta, los ponen juntos."}]},
{id:"tm_ola",st:[5],c:"nino",w:3,q:"¡Corre! ¡Viene una ola gigante y se va a llevar las mantas! ¡Tu disco va a acabar en el mar!",opts:[
 {t:"Salvar las mantas.",fx:{o:15,s:-8},r:"Sacas tres mantas del agua. Los CDs están empapados. Ousmane los seca con un secador de pelo y los vende como «edición marina»."},
 {t:"Salvar solo mis discos.",fx:{o:-10,h:3},r:"Te pillan las cámaras eligiendo tus discos de entre los de los demás. Titular: «Ego a prueba de tsunamis»."},
 {t:"Grabar la ola para un videoclip.",fx:{h:15,s:-3},r:"Videoclip épico: tú cantando, la ola de fondo y cuarenta CDs flotando como medusas brillantes."}]},
{id:"hood_tm",st:[5],c:"encapuchado",w:6,cond:()=>F("alma")&&!F("diablo"),q:"(Entre las mantas del paseo hay una que solo vende un CD. El tuyo. La atiende alguien con capucha). Tres euros. Te lo recomiendo. Lo escuché tantas veces que me lo sé al revés. Literalmente: al revés dice cosas.",opts:[
 {t:"¿Qué dice al revés?",fx:{h:5},r:()=>"Se acerca y te lo canta bajito, al revés. Tardas en entenderlo: "+consejo(1)},
 {t:"Comprarte mi propio disco.",fx:{d:-3,o:5},r:"Te da el cambio en una moneda antigua. Al mirar la carátula, ves que tiene escrita una fecha de dentro de treinta años."},
 {t:"Preguntarle cuánto ha vendido.",fx:{o:3},r:"«Uno», dice. «Siempre al mismo cliente». Se baja un poco la capucha. Solo ves la barbilla. Es la tuya."}]},
/* ---------- ETAPA 3 · Estrellato ---------- */
{id:"dictador",st:[3],c:"dictador",q:"Concierto privado por mi cumpleaños. Pago dos millones. Tranquil[o|a]: en mi país solo encarcelamos a los que cantan mal.",opts:[
 {t:"Ir y cantarle «Cumpleaños feliz» con sentimiento.",fx:{d:35,o:-25},r:"Su Excelencia llora de emoción. Tú también, pero por otros motivos. Una ONG de derechos humanos te dedica un comunicado."},
 {t:"Rechazarlo.",fx:{o:10,d:-5},r:"Contrata a Kira Star. Ella canta, él aplaude y ella vuelve con un palacio."},
 {t:"Ir, cobrar y criticarle desde el escenario.",fx:{o:30,h:25,d:20},risk:[.4,"dictador"],r:"Le llamas tirano en su propia fiesta y huyes en un avión de carga, escondid[o|a] entre plátanos. Heroicidad internacional."}]},

{id:"boda",st:[3],c:"pareja",nogen:["laura"],q:"Casémonos. Ya he vendido la exclusiva de la boda a una revista por 300.000 €. El vestido lo eligen ellos.",opts:[
 {t:"Boda con exclusiva y drones.",fx:{d:25,h:20,o:-10},set:{casad:1},later:["divorcio",6],r:"Un dron se estrella contra la tarta. Es la foto del año. Tu suegra sale en todas con cara de funeral."},
 {t:"Boda íntima, sin cámaras.",fx:{o:10,s:10,d:-10},set:{casad:1},later:["divorcio",9],r:"Cuarenta invitados. Uno vende fotos con el móvil. Tu cuñado, claro."},
 {t:"No me caso ni loc[o|a].",fx:{s:5,h:-10,o:-5},r:"Tu pareja te deja por SMS. Con faltas de ortografía. Te duele más lo de las faltas."}]},

{id:"divorcio",chain:1,st:[3,4],c:"herrera",q:"Tu pareja pide el divorcio. Quiere la casa, la mitad de tus canciones y al perro. El perro ha testificado en tu contra.",opts:[
 {t:"Dárselo todo y empezar de cero.",fx:{d:-25,s:10},r:"Te quedas con una guitarra, un colchón y la custodia compartida del perro. El perro no te mira."},
 {t:"Juicio televisado.",fx:{h:25,o:-20,d:-10},r:"Tres meses de audiencias récord. Tu ex llora en directo. Tú también. Ganan los abogados."},
 {t:"Disco de despecho.",fx:{h:30,o:-10,s:-15},r:"«Ojalá te muerda el perro» es número uno en once países. El perro tampoco te habla."}]},

{id:"documental",st:[3],c:"netflux",q:"Hacemos un documental sobre tu vida. Pero necesitamos drama: ¿alguna adicción, trauma o pariente muerto que podamos aprovechar?",opts:[
 {t:"Contarlo todo, sin filtros.",fx:{h:25,o:5,s:-15},r:"Lloras en cada episodio. La gente te quiere más. Tu terapeuta te manda la factura del rodaje."},
 {t:"Inventarme un trauma.",fx:{h:30,o:-25},r:"Un periodista descubre que el «orfanato rumano» era un campamento de verano en Cuenca."},
 {t:"Que el documental sea sobre mi madre.",fx:{o:15,h:-10},r:"Tu madre es lo más visto del año. Le ofrecen spin-off, libro y perfume. Tú sales en los créditos."}]},

{id:"gnomo",st:[3],c:"ambrosio",q:"Señor[|a], hay a la venta un gnomo de jardín de oro macizo. Solo 400.000 €. Todas las estrellas de verdad tienen uno.",opts:[
 {t:"Comprarlo.",fx:{d:-20,h:10},r:"Lo pones en la entrada. Lo roban a la semana. El ladrón sube fotos con él desde Ibiza."},
 {t:"Comprar dos. Uno con mi cara.",fx:{d:-30,h:20,o:-10},r:"El gnomo con tu cara es más expresivo que tú. Las revistas lo prefieren."},
 {t:"Despedir a Ambrosio por sugerirlo.",fx:{d:10,o:-10,s:-5},r:"Ambrosio vende tus secretos a Paco Exclusiva. Tenías muchos. Algunos ni los recordabas."}]},

{id:"gira_mundial",st:[3],c:"vero",w:4,q:"Gira mundial: 120 fechas, 40 países, 3 continentes y cero días libres. ¿Firmamos?",opts:[
 {t:"Firmar entera.",fx:{d:35,h:20,s:-25},r:"En Tokio saludas en alemán. En Berlín, en japonés. Nadie se da cuenta."},
 {t:"Firmar, con «ayuda química».",fx:{d:30,h:25,s:-10},f:{drogas:2},r:"Haces la gira entera sin dormir. Recuerdas tres conciertos. Uno era de otra persona."},
 {t:"Solo Europa.",fx:{d:15,h:5,s:-10},r:"Los fans del resto del mundo te queman en efigie. Muy bien hecha la efigie, por cierto."}]},

{id:"terapia",st:[3,4],c:"luz",q:"Tu ego ocupa ya dos habitaciones de tu mansión y paga menos impuestos que tú. ¿Lo trabajamos?",opts:[
 {t:"Hacer terapia en serio.",fx:{s:15,d:-15,h:-5},r:"Descubres que todo es culpa de tu madre. Se lo dices. Te deshereda. Avanzas."},
 {t:"Mi ego está perfecto.",fx:{h:10,o:-15},r:"Lo dices en tercera persona. La doctora lo apunta en rojo."},
 {t:"Hacer un disco sobre mi terapia.",fx:{h:20,o:5,s:-5},r:"La terapeuta te demanda por usar sus frases. Las frases eran muy buenas."}]},

{id:"jurado",st:[3],c:"jc",q:"¡Vuelves a «Tú Sí Que Vales Menos»! Pero ahora como jurado. Tienes que destrozar sueños con gracia.",opts:[
 {t:"Ser cruel. Muy cruel.",fx:{h:20,o:-15},r:"Le dices a una señora de 70 años que canta como un fax. Se hace viral. Ahora tiene más contratos que tú."},
 {t:"Ser amable con todos.",fx:{o:10,h:-10},r:"Aburres a España entera. Te sustituyen por un loro que dice «NO»."},
 {t:"Llorar con cada concursante.",fx:{o:15,h:10,s:-10},r:"Lloras catorce veces por programa. Te deshidratas. Te ponen un suero en directo."}]},

{id:"zoraida",st:[3,4],c:"zoraida",q:"Las cartas dicen que morirás joven. Por 5.000 € les pido que cambien de opinión.",opts:[
 {t:"Pagar. Por si acaso.",fx:{d:-10,s:5},r:"Las cartas cambian de opinión: ahora dicen que morirás arruinad[o|a]. Zoraida te ofrece otra tirada."},
 {t:"«Ya no soy tan joven».",fx:{o:3,h:-3},r:"Zoraida te mira de arriba abajo: «Pues también es verdad»."},
 {t:"Encargarle una maldición contra Kira Star.",fx:{h:10,d:-10},r:"Kira se tuerce un tobillo en directo. Te sientes poderos[o|a]. Y un poco mala persona. Sobre todo poderos[o|a]."}]},

{id:"espacio",st:[3],c:"galactica",q:"Primer concierto de la historia en el espacio. La nave está casi probada. Lo de «casi» es importante.",opts:[
 {t:"Despegar.",fx:{h:35,d:20},risk:[.3,"espacio"],r:"Cantas en gravedad cero. El micro sale flotando. Ocho mil millones de personas te ven vomitar en directo. Histórico."},
 {t:"Mandar un holograma.",fx:{h:10,d:-10},r:"Tu holograma canta en el espacio. Se le olvida la letra. Igual que a ti."},
 {t:"No, gracias. Me mareo en el ascensor.",fx:{o:5,h:-10},r:"Va Kira Star. Vuelve. Por desgracia."}]},

{id:"placaje",st:[3,4],c:"iker",q:"Jef[e|a], un fan ha saltado la valla. Lleva un cuchillo… o un ramo de flores. Desde aquí no se distingue bien.",opts:[
 {t:"¡Placaje!",fx:{o:-20,h:15},r:"Era un ramo de flores. Y un niño de nueve años. El vídeo se titula «El placaje de la vergüenza»."},
 {t:"Déjale pasar.",fx:{o:15},risk:[.2,"hater"],r:"Era un ramo de flores. Te abraza llorando y te pringa de mocos. Sonríes para la foto."},
 {t:"Esconderme detrás de Iker.",fx:{h:5,o:-5,s:5},r:"Iker es grande, pero no tanto. Sale media cara tuya en todas las fotos, con cara de pánico."}]},

{id:"premio_robado",st:[3],c:"kira",q:"(Kira Star se ha llevado TU estatuilla de los Premios Pelícano al baño y no piensa salir).",opts:[
 {t:"Echar la puerta abajo.",fx:{h:20,o:-10,s:-10},r:"La puerta era de cristal. La estatuilla, de plástico. Tus puntos de sutura, de verdad."},
 {t:"Aplaudir con dignidad.",fx:{o:15,h:-5},r:"Todo el mundo comenta tu elegancia. Kira usa tu estatuilla de pisapapeles."},
 {t:"Ligar con su pareja en la fiesta.",fx:{h:25,o:-20},set:{kira_enemiga:1},r:"Funciona. Demasiado bien. Ahora tienes una pareja que no querías y una enemiga mortal."}]},

{id:"bebe",st:[3],c:"montero",q:"Las estrellas con bebé venden un 40 % más. ¿Tienes previsto tener uno? Podemos alquilar uno para la portada.",opts:[
 {t:"Bebé de alquiler para la foto.",fx:{h:20,o:-30},r:"El bebé llora en todas las fotos. Su madre real lo reconoce en el quiosco. Demanda."},
 {t:"Adoptar de verdad.",fx:{o:15,d:-15,s:-10},r:"No duermes desde hace meses. Tu nueva canción se llama «3:47 AM». Es preciosa y trágica."},
 {t:"Mejor un perro.",fx:{o:5,h:5},r:"El perro tiene más seguidores que tú en un mes. Firma con Megasound."}]},

{id:"arnes",st:[3],c:"tecnico",q:"Para la entrada en el estadio te bajamos del techo con un arnés. Lo he montado yo. Con bridas. Bastantes bridas.",opts:[
 {t:"Bajar volando.",fx:{h:25},risk:[.3,"arnes"],r:"Bajas como un ángel. Un ángel que grita. Sesenta mil personas lo graban."},
 {t:"Entrar andando como una persona normal.",fx:{h:3,o:5},r:"Tu entrada es tan normal que la gente sigue en la cola del baño."},
 {t:"Salir de un ataúd que se abre.",fx:{h:20,o:-10},r:"El ataúd no se abre. Cantas medio concierto desde dentro. La crítica dice que es tu mejor directo."}]},

{id:"nazi_estadio",st:[3,4],c:"bruno",w:4,cond:()=>F("neonazis")>=1,q:"Mis chicos y yo hemos comprado entradas de primera fila para tu concierto. Llevaremos antorchas. Para iluminar.",opts:[
 {t:"Cancelar el concierto.",fx:{d:-20,o:-10},r:"Pérdidas millonarias. Bruno sube una foto sonriendo delante del estadio vacío."},
 {t:"Gritar «¡Fuera nazis!» desde el escenario.",fx:{o:25,h:20},f:{neonazis:1},r:"Sesenta mil personas los echan cantando. Momento histórico. Bruno apunta algo en su libreta."},
 {t:"Hacer como que no les veo.",fx:{o:-20},r:"Salen en todas las fotos, en primera fila, haciendo cosas con el brazo."}]},

{id:"fiesta_rep",rep:1,st:[3,4],c:"lucia",q:"Otra fiesta de famosos. Habrá canapés de oro, un mago y alguien de un reality vomitando en la piscina.",opts:[
 {t:"Ir.",fx:{h:8,s:-8},r:"Te haces fotos con gente cuyo nombre no recuerdas. Ellos tampoco recuerdan el tuyo."},
 {t:"Quedarme en casa.",fx:{h:-5,s:5},r:"Ves la fiesta por Instagram. Parece aburrida. Te sientes superior y sol[o|a]."},
 {t:"Ir con mi madre.",fx:{o:5,h:3,s:-3},r:"Tu madre se hace amiga del mago. Te vas sin ella."}]},

{id:"post_rep",rep:1,st:[3,4],c:"bea",q:"Toca post. Llevas 48 horas sin publicar y el algoritmo te castiga. ¿Qué subo?",opts:[
 {t:"Foto en bañador.",fx:{h:8,o:-3},r:"200.000 likes. Y un comentario de tu madre: «Abrígate»."},
 {t:"Foto apoyando una causa social.",fx:{o:6,h:-3},r:"Te acusan de postureo. Tienen razón, pero aun así."},
 {t:"Un meme sobre Kira Star.",fx:{h:6,o:-5},r:"Kira responde con un meme sobre tu frente. Es mejor que el tuyo."}]},

/* --- Arcos de personajes en la etapa 3 --- */
{id:"mama_novio",st:[3],c:"mama",w:4,q:"Hij[o|a], tengo novio. Tiene 34 años, se llama Jonathan y es tu bailarín principal.",opts:[
 {t:"Bendecirlo. Mamá merece ser feliz.",fx:{o:10,s:-5},set:{jonathan:1},r:"Jonathan te llama «hij[o|a]» en los ensayos. Es más joven que tú."},
 {t:"Despedir a Jonathan.",fx:{o:-10,h:5},set:{mama_dolida:1},r:"Tu madre te deja de hablar y se va de crucero con él. Te manda postales. Sin texto."},
 {t:"Hacer un dueto madre-hij[o|a] en la gira.",fx:{h:20,o:5,s:-5},r:"Tu madre desafina con una seguridad que tú nunca tuviste. El público la prefiere."}]},

{id:"benito_boda",st:[3],c:"benito",w:5,cond:()=>F("casad"),q:"Me han dicho que te casaste por lo civil. Dios lo ha visto todo. Y yo también: en la revista. ¿Repetimos por la Iglesia?",opts:[
 {t:"Repetir la boda en la parroquia.",fx:{d:-15,o:10},set:{benito_amigo:1},r:"Segunda boda en un año. Los invitados ya ni traen regalo. Benito cobra doble."},
 {t:"Dios no lee revistas.",fx:{o:-5,h:5},r:"Benito te mira con una pena infinita. «Lee el Hola, hij[o|a]. Todos los martes»."},
 {t:"Invitarle a pasar unos días en el yate.",fx:{d:-10,s:5},set:{benito_amigo:1},r:"Benito se marea y bendice a un pez espada. El pez espada se vuelve viral."}]},

{id:"manolo_bar",st:[3],c:"manolo",w:5,cond:()=>F("bar"),q:"Desde que compraste el bar viene gente de todo el mundo a cantar donde tú empezaste. Y a robar los posavasos.",opts:[
 {t:"Convertirlo en museo.",fx:{d:15,h:10},r:"«Museo del Calamar y del Arte». Entrada: 12 €. Los mejillones, en una vitrina. Siguen vivos."},
 {t:"Dejarlo como bar de toda la vida.",fx:{o:10,s:5},r:"Vas los viernes a cantar gratis. Es lo único de tu vida que no te cansa."},
 {t:"Vendérselo a una cadena de brunch.",fx:{d:30,o:-25},set:{manolo_dolido:1},r:"Ahora sirven tostadas de aguacate a 14 €. Manolo pasa por delante y escupe. Con razón."}]},

{id:"chema_gestor",st:[3],c:"chema",w:4,cond:()=>F("chema_fuera"),q:"Soy tu gestor desde que me fui a la gestoría, ¿te acuerdas? Tengo dos noticias: una mala y otra peor.",opts:[
 {t:"Primero la mala.",fx:{d:-15},r:"Debes 200.000 € a Hacienda. Chema te lo dice con una calma de funcionario que da escalofríos."},
 {t:"Primero la peor.",fx:{o:-10,h:-5},r:"Kira Star también es clienta suya. Y gana más que tú. Y le da propina."},
 {t:"Despedirle y llevar yo las cuentas.",fx:{s:-5,d:5},f:{hacienda:1},r:"Tu método contable es una caja de zapatos. El inspector Ruiz huele algo desde su despacho."}]},

{id:"mariano_estadio",st:[3],c:"mariano",w:4,q:"Te construyo un estadio con tu nombre. Con materiales de mi confianza. No preguntes qué hay en los cimientos.",opts:[
 {t:"Aceptar el estadio.",fx:{h:25,d:-10,o:-10},risk:[.2,"estadio"],r:"El estadio es precioso. Cruje un poco cuando el público salta. «Es que respira», dice Don Mariano."},
 {t:"Rechazarlo amablemente.",fx:{o:5},f:{mafia:1},r:"Don Mariano sonríe. «Otra vez será». Esa misma noche aparece un saco de cemento en tu jardín."},
 {t:"Pedir que los cimientos lleven mi cara.",fx:{h:15,d:-5},set:{mariano_amigo:1},r:"Tu cara, en hormigón armado, sosteniendo 60.000 personas. Literalmente, cargas con tu público."}]},

{id:"ricky_vuelve",st:[3],c:"ricky",w:5,cond:()=>F("ricky"),q:"¡Artista! He vuelto de Punta Cana. Arruinado, pero con ideas. Dame otra oportunidad. Mira: te traigo tu toalla.",opts:[
 {t:"Perdonarle y contratarle otra vez.",fx:{h:15,d:-15},set:{ricky2:1},r:"Te consigue tres portadas en una semana. Y vuelve a quedarse el 60 %. Al menos esta vez te lo avisa."},
 {t:"Denunciarle.",fx:{o:5,d:10},r:"El juez le obliga a devolverte la toalla y 10.000 €. La toalla huele a coco."},
 {t:"Contratarle de chófer.",fx:{o:10,s:5},r:"Conduce fatal, pero cuenta los mejores chistes de la industria. Ninguno se puede publicar."}]},

{id:"cunado_mansion",st:[3],c:"cunado",w:4,q:"Me vengo a vivir a tu mansión una temporadita. Tres o cuatro años. Traigo a mi suegra y la barbacoa.",opts:[
 {t:"Aceptar. Es familia.",fx:{s:-15,o:10},r:"A la semana ha cambiado el wifi a «CUÑAO_ZONE» y da tours guiados de tu casa a 20 €."},
 {t:"Rechazarlo.",fx:{o:-10,s:5},r:"Publica en Facebook que le has dejado en la calle. Lo comparten 40.000 cuñados en solidaridad."},
 {t:"Darle la casa de invitados… en otra provincia.",fx:{d:-15,s:10},r:"Le compras un piso en Teruel. Te llama cada día para decirte que existe."}]},

{id:"jessica_clon",st:[3],c:"jessica",w:5,cond:()=>F("jessica"),q:"¡Sorpresa! Me he operado para parecerme a ti. ¿A que soy más tú que tú?",opts:[
 {t:"Contratarla como doble.",fx:{d:10,s:10,h:-5},set:{doble:1},r:"Va a las entrevistas aburridas por ti. Lo hace mejor. Responde con más carisma."},
 {t:"Denunciarla por usurpación.",fx:{o:-10,d:-5},r:"El juez no sabe cuál de las dos personas es la demandante. Os manda a casa a las dos."},
 {t:"Hacernos fotos juntas.",fx:{h:20,o:-5},r:"Nadie sabe quién es quién. Tu madre tampoco. Le da igual."}]},

{id:"toni_kombucha",st:[3,4],c:"toni",w:3,q:"Me he rehabilitado. Ahora vendo kombucha. Es lo mismo que antes, pero más caro y en botella de cristal.",opts:[
 {t:"Comprarle una caja.",fx:{d:-5,s:5,o:3},r:"Sabe a vinagre y arrepentimiento. Te sientes muy sano. Y muy pobre."},
 {t:"Invertir en su marca.",fx:{d:-15,h:10},r:"«Kombucha Toni: lo de antes, pero legal». Se vende en gasolineras. Te da para pipas."},
 {t:"Echar de menos al Toni de antes.",fx:{s:-5,h:5},f:{drogas:1},r:"Toni suspira, abre un cajón y saca «algo para los viejos tiempos». Lo coges. Claro que lo coges."}]},

{id:"ruiz_mansion",st:[3],c:"ruiz",w:4,q:"Su mansión tiene catorce baños y declara usted dos. ¿Los otros doce son de adorno?",opts:[
 {t:"Pagar la diferencia.",fx:{d:-20},r:"Ruiz se va contento. Usa uno de los baños antes de irse. Sin preguntar."},
 {t:"«Son baños emocionales».",fx:{h:5},f:{hacienda:1},r:"Ruiz apunta «baños emocionales» en su libreta pequeña. Subraya dos veces."},
 {t:"Tirar paredes y dejarlo en un baño gigante.",fx:{d:-10,h:10},r:"Tienes un baño de 300 m². Sale en una revista de interiorismo. Nadie entiende nada."}]},

{id:"salas_chequeo",st:[3],c:"salas",w:3,q:"Chequeo anual. Tu hígado ha pedido asilo político en otro cuerpo.",opts:[
 {t:"Dejar el alcohol.",fx:{s:20,h:-10},r:"Las fiestas sin alcohol son un documental de naturaleza: gente rara haciendo ruidos."},
 {t:"Brindar por mi hígado.",fx:{s:-15,h:5,o:5},r:"El brindis se hace viral. Tu hígado lo ve y redacta su dimisión."},
 {t:"Comprar un hígado de repuesto.",fx:{d:-20,s:15},r:"Te lo traen en una nevera de playa. Funciona. Pero te dan ganas de comer pienso."}]},

{id:"paco_muerte",st:[3,4],c:"paco",w:6,cond:()=>S.revives>0,q:"Tengo fotos tuyas en el ataúd. Y fotos de ayer tomándote un café. ¿Cómo lo explicas?",opts:[
 {t:"Era un efecto especial.",fx:{o:-10,h:10},r:"Nadie se lo cree, pero un canal de conspiraciones te dedica tres horas. Sube tu hype."},
 {t:"Pagarle por las fotos.",fx:{d:-15},r:"Te vende las fotos. Y los negativos. Y una copia de seguridad «por si vuelves a morirte»."},
 {t:"Exclusiva: «Volví del más allá».",fx:{h:25,o:-5},r:"Portada en todas partes. San Pedro, en algún sitio, se lleva las manos a la cabeza."}]},

/* ---------- ETAPA 4 · Decadencia o leyenda ---------- */
{id:"villancicos",st:[4],c:"montero",q:"Las ventas caen. Solución infalible: disco de villancicos. Con DJ Melón.",opts:[
 {t:"Hacerlo.",fx:{d:25,h:10,o:-10},r:"«Los peces en el río (Melón Remix)» suena en todos los centros comerciales. Los dependientes te odian."},
 {t:"Villancicos en versión heavy.",fx:{h:20,o:-5},r:"«Noche de paz… y de muerte» se vuelve de culto. Te invitan a un festival en Noruega."},
 {t:"Negarme. Tengo dignidad.",fx:{o:10,d:-15},r:"Megasound saca uno con tu holograma. Sin preguntarte."}]},

{id:"reality_olvido",st:[4],c:"reality",q:"Nuevo reality: «Supervivientes del Olvido». Famosos venidos a menos en una casa con cámaras hasta en el váter.",opts:[
 {t:"Entrar.",fx:{d:25,h:20,o:-15,s:-10},r:"Te peleas con un exconcursante de 1998 por un yogur. Escena del año."},
 {t:"Rechazarlo.",fx:{h:-10,o:5},r:"Entra tu ex. Habla de ti en cada gala. Cobra más por hablar de ti que tú por cantar."},
 {t:"Entrar y liarme con alguien en directo.",fx:{h:30,o:-20,s:-5},r:"Lo ve tu madre. Lo ve tu suegra. Lo ve España entera. Audiencia histórica."}]},

{id:"reunion",st:[4],c:"chema",q:"(Chema, ya con barriga) Gira de reunión. Tú, yo y la caja de ritmos. Por los viejos tiempos… y por mi hipoteca.",opts:[
 {t:"Gira de reunión completa.",fx:{d:25,h:15,s:-15},r:"En la tercera fecha a Chema le da lumbago tocando el bombo. Tocáis sentados. La llamáis «Unplugged por prescripción médica»."},
 {t:"Un solo concierto especial.",fx:{h:10,o:10},r:"Emoción, lágrimas, nostalgia. Chema llora más que el público. Y desafina."},
 {t:"No vuelvo a los garitos.",fx:{o:-10,s:5},r:"Chema hace la gira con un imitador tuyo. Le va mejor."}]},

{id:"biopic",st:[4],c:"netflux",q:"Película sobre tu vida. Te interpretará alguien veinte años más joven y bastante más guap[o|a].",opts:[
 {t:"Aceptar.",fx:{d:25,h:15,o:-5},r:"La gente cree que eres como en la película. Te piden que hagas cosas que nunca hiciste."},

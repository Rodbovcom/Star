 {t:"Exigir hacer de mí mism[o|a].",fx:{h:10,o:-15},r:"La crítica dice que no resultas creíble haciendo de ti."},
 {t:"Que me interprete Kira Star.",fx:{h:25,o:5},r:"Kira te borda. Gana un premio y lo dedica «a la persona real, que también existe»."}]},

{id:"hijo_trap",st:[4],c:"hijo",q:"Me da vergüenza ser tu hij[o|a]. Voy a sacar un disco de trap contra ti: «[Papá|Mamá] Boomer».",opts:[
 {t:"Hacer un dueto.",fx:{h:20,o:5,s:-5},r:"El dueto es número uno. Te llama «boomer» en el estribillo. Lo cantas igual."},
 {t:"Demandarle.",fx:{o:-20,d:-5},r:"El juez le da la razón. Dice que tu último disco es, efectivamente, de boomer."},
 {t:"Producírselo.",fx:{d:-15,h:10,o:10},r:"Su disco vende más que todos los tuyos. Te sientes orgullos[o|a] y humillad[o|a] a la vez."}]},

{id:"holograma",st:[4],c:"holo",q:"Firma hoy y, cuando mueras, tu holograma seguirá haciendo giras. Si quieres, podemos adelantar lo de morirte.",opts:[
 {t:"Firmar.",fx:{d:30,o:-10},r:"Te escanean de pies a cabeza. El holograma te mira con desprecio."},
 {t:"Que el holograma haga la gira y yo me quedo en casa.",fx:{d:20,h:-10,s:15},r:"El holograma recibe mejores críticas que tú. Y no se queja del catering."},
 {t:"Rechazarlo.",fx:{o:5},r:"Te clonan igual a partir de una foto de 2009. Tu holograma lleva flequillo emo."}]},

{id:"lifting",st:[4],c:"cirujano",q:"Para la gira de despedida: lifting completo. Quedarás como hace veinte años. O como un pez globo. Cincuenta, cincuenta.",opts:[
 {t:"Lifting barato.",fx:{h:15,s:-10},risk:[.25,"cirugia"],r:"Quedas estupend[o|a]. No puedes cerrar los ojos, pero estupend[o|a]."},
 {t:"Envejecer con dignidad.",fx:{o:10,h:-10},r:"Te llaman «valiente». Es la palabra que usan para no decirte «viej[o|a]»."},
 {t:"Filtro de Instagram para siempre.",fx:{h:10,o:-10},r:"En persona no te reconoce nadie. Te piden el DNI en tu propio concierto."}]},

{id:"despedida",st:[4],c:"vero",q:"Gira de despedida. La quinta. La gente empieza a sospechar.",opts:[
 {t:"Hacer la sexta.",fx:{d:25,o:-20},r:"El cartel dice «LA ÚLTIMA (de verdad) (ahora sí)». Se agotan las entradas. España no aprende."},
 {t:"Retirarme de verdad.",fx:{o:15,h:-15,d:-10},r:"Durante una semana eres un mito. A la segunda, te aburres."},
 {t:"Fingir una retirada y volver al mes.",fx:{h:20,o:-15},r:"Vuelves con un disco llamado «He vuelto». Pésimo título. Buenas ventas."}]},

{id:"memorias",st:[4],c:"editorial",q:"Tus memorias. Cuanta más mierda cuentes, más adelanto. ¿Cuánta mierda tienes?",opts:[
 {t:"Contarlo todo. Nombres incluidos.",fx:{d:25,h:20,o:-15},f:{mafia:1},r:"El capítulo 7 habla de Don Mariano. El libro es un éxito. Don Mariano lo ha leído."},
 {t:"Memorias blanquitas.",fx:{o:5,d:5,h:-5},r:"Se venden en gasolineras, junto a las cintas de chistes. Las firma tu madre."},
 {t:"Inventármelo todo.",fx:{h:25,o:-20},r:"Dices que estuviste con tres presidentes y un astronauta. El astronauta lo confirma. Te preocupa."}]},

{id:"alcaldia",st:[4],c:"politico",q:"Queremos que seas candidat[o|a] a la alcaldía de tu pueblo. No hace falta saber nada: lo hemos comprobado con los anteriores.",opts:[
 {t:"Presentarme.",fx:{o:15,h:15,s:-10,d:-10},r:"Ganas. Tu primera medida es que el reloj del ayuntamiento toque tu canción cada hora. El pueblo entero te odia."},
 {t:"Crear mi propio partido: Partido Estrella.",fx:{h:25,o:-10},r:"Sacas un concejal. Es Chema. No sabe qué es un pleno."},
 {t:"No.",fx:{o:5},r:"Se presenta tu cuñado. Gana. Ahora es tu alcalde."}]},

{id:"corazon",st:[4],c:"salas",q:"Tienes el corazón de una persona de noventa años. Y no en el sentido bonito.",opts:[
 {t:"Retirarme a un balneario.",fx:{s:20,h:-15,d:-15},r:"Tres meses de barro, masajes y caldo. Vuelves con la piel de un bebé y el hype de un muerto."},
 {t:"Un último concierto y luego paro.",fx:{h:20},risk:[.25,"infarto"],r:"Sobrevives. Te tiembla todo. El público lo interpreta como baile."},
 {t:"Comprar un corazón en el mercado negro.",fx:{s:15,d:-30,o:-15},r:"Te implantan el corazón de un jabalí. Funciona perfectamente, pero a veces te dan ganas de hozar."}]},

{id:"tributo",st:[4],c:"kira",q:"Voy a hacer un concierto homenaje a ti. Aunque sigas viv[o|a]. Es más rentable antes de que te mueras.",opts:[
 {t:"Ir y cantar con ella.",fx:{o:15,h:15},r:"Abrazo en directo. Las dos sonrisas son falsas. España llora de emoción."},
 {t:"Ir de público y abuchearla.",fx:{h:20,o:-15},r:"Te pillan las cámaras. Titular: «Ni en su propio homenaje se aguanta»."},
 {t:"No ir.",fx:{h:-10},r:"Kira dice que estás «muy enferm[o|a]». Te llegan flores. Y una corona fúnebre, por si acaso."}]},

{id:"reto",st:[4],c:"lucia",q:"Reto viral: «La abuela del rock». Los jóvenes se ríen de ti. Con cariño. Bueno, sin cariño.",opts:[
 {t:"Seguirles el juego.",fx:{h:25,o:-5},r:"Haces el baile. Te crujen las rodillas en el audio. Es lo que más gusta."},
 {t:"Enfadarme en directo.",fx:{o:-15,h:10},r:"«Boomer enfadad[o|a]» es el nuevo meme. Estás en todas partes. Furios[o|a]."},
 {t:"Superarles con un reto aún más loco.",fx:{h:20},risk:[.25,"reto"],r:"Saltas del balcón a la piscina. Aciertas. Los chavales te respetan durante 48 horas."}]},

{id:"cunado_final",st:[4],c:"cunado",q:"Ahora que estás en declive: ¿me devuelves lo mío? Con intereses son 47.000 €. Los he calculado yo.",opts:[
 {t:"Pagarle.",fx:{d:-25},r:"Te da las gracias diciendo que «en el fondo, ya sabía que eras de fiar»."},
 {t:"«Cuñado, eres familia».",fx:{o:-5,d:-5},r:"Te demanda. El juez es su compañero de pádel."},
 {t:"Invertirlo juntos en criptomonedas.",fx:{d:-20,o:5},r:"Lo perdéis todo en 48 horas. Por primera vez estáis en igualdad de condiciones. Os abrazáis."}]},

{id:"honor",st:[4],c:"gala",q:"Premio Pelícano de Honor a toda una carrera. Normalmente se lo damos a gente casi muerta, pero hemos hecho una excepción.",opts:[
 {t:"Discurso emotivo.",fx:{o:20,h:10},r:"Das las gracias a tu madre, a Chema y a Manolo. Manolo se pone de pie. Era el camarero."},
 {t:"Discurso ajustando cuentas.",fx:{h:25,o:-15},r:"Nombras a Ricky Platino, a tu ex y a Kira. Cortan a publicidad en el minuto cuatro."},
 {t:"No ir: «aún no estoy muert[o|a]».",fx:{h:10,o:-5},r:"Le dan el premio a Kira «en tu nombre». Lo acepta. Lo pone en su baño."}]},

{id:"bolo_super_rep",rep:1,st:[4],c:"vero",q:"Bolo: inauguración de un supermercado de barrio. Pagan bien y regalan un jamón.",opts:[
 {t:"Aceptar.",fx:{d:10,o:-3,h:-2},r:"Cantas entre los yogures. Una señora te pide que te apartes del pasillo."},
 {t:"Rechazar.",fx:{d:-5,s:5},r:"Va Chema. Se lleva el jamón."},
 {t:"Aceptar y cantar desde los congelados.",fx:{h:8,s:-5},r:"Pillas un catarro, pero el vídeo es de culto: «Concierto bajo cero»."}]},

/* --- Arcos de personajes en la etapa 4 --- */
{id:"mama_residencia",st:[4],c:"mama",w:5,q:"Hij[o|a], quiero ir a una residencia de lujo… o vivir contigo. Tú eliges. Pero piensa en las treinta y seis horas de parto.",opts:[
 {t:"La mejor residencia del país.",fx:{d:-20,o:10},r:"Se hace la reina del bingo de la residencia. Organiza un motín por el flan. Lo gana."},
 {t:"Que se venga a vivir conmigo.",fx:{s:-15,o:15},r:"Reorganiza tu mansión, tira tus vinilos y cuenta a la prensa todas tus manías. Te quiere mucho."},
 {t:"Mandarla a vivir con el cuñado.",fx:{s:10,o:-15},set:{mama_dolida:1},r:"El cuñado y tu madre fundan un pódcast sobre ti: «Lo que no cuenta». Va por la temporada tres."}]},

{id:"mama_perdon",st:[4],c:"mama",w:6,cond:()=>F("mama_dolida"),q:"Me hiciste daño, hij[o|a]. Pero soy tu madre. ¿Tienes algo que decirme antes de que sea tarde?",opts:[
 {t:"Pedirle perdón de verdad.",fx:{o:15,s:10},set:{mama_dolida:0},r:"Lloráis las dos personas. Luego te da un táper. Es el mismo de hace treinta años. Lo ha guardado."},
 {t:"Hacerle una canción de perdón.",fx:{h:20,o:5},r:"La canta en el bingo con su versión de la letra. Es mejor que la tuya."},
 {t:"«Tú también me hiciste daño».",fx:{o:-15,s:-10},r:"Te recita, en orden cronológico, todos los regalos que te hizo desde 1990. Te rindes."}]},

{id:"benito_funeral",st:[4],c:"benito",w:5,q:"Te tengo preparado el funeral, por si acaso. ¿Qué canción quieres? Si eliges hoy tengo descuento.",opts:[
 {t:"Una mía, claro.",fx:{h:10,o:-5},r:"Benito se queda callado. «¿Cuál? Es que el coro no se sabe ninguna»."},
 {t:"«Highway to Hell», como aquel funeral.",fx:{h:15,o:5},r:"Benito sonríe. Lo apunta. Lleva años esperando que alguien se lo pida."},
 {t:"No pienso morirme.",fx:{s:5},r:"Benito asiente con ternura. «Eso dicen todos, hij[o|a]. Eso dicen todos»."}]},

{id:"manolo_jubila",st:[4],c:"manolo",w:5,cond:()=>!F("manolo_dolido"),q:"Me jubilo. Te dejo en herencia la receta de los calamares. Y los mejillones, que siguen ahí, en su sitio.",opts:[
 {t:"Comerme los mejillones en su honor.",fx:{o:15,h:5},risk:[.3,"mejillones"],r:"Sobrevives. Manolo llora. Es lo más bonito que ha hecho nadie por él."},
 {t:"Cantar en su fiesta de jubilación.",fx:{h:10,o:10},r:"Cantas «Balada para un radiador». Los cuatro jubilados del principio siguen vivos. Y aplauden."},
 {t:"Llorar abrazad[o|a] a la tragaperras.",fx:{s:-5,o:5},r:"La tragaperras te da tres cerezas. Es la primera vez que te premia en treinta años."}]},

{id:"ricky_libro",st:[4],c:"ricky",w:5,cond:()=>F("ricky"),q:"Voy a publicar mis memorias: «Cómo hice famos[o|a] a {name}». Spoiler: salgo yo de héroe.",opts:[
 {t:"Pagarle para que no lo publique.",fx:{d:-20},r:"Coge el dinero y lo publica igual. Con un capítulo nuevo: «Cómo me pagó para no publicarlo»."},
 {t:"Escribir yo el prólogo.",fx:{h:15,o:5},r:"El prólogo es lo mejor del libro. Ricky se lleva el 60 % de los derechos. Como siempre."},
 {t:"Demandarle.",fx:{d:-10,o:-5},r:"Ricky lo usa como promoción. Se agota la primera edición. Te manda una copia dedicada."}]},

{id:"jessica_doble",st:[4],c:"jessica",w:6,cond:()=>F("doble"),q:"Llevo tres meses haciendo tus conciertos y nadie se ha dado cuenta. Las críticas dicen que estás mejor que nunca.",opts:[
 {t:"Retirarme y que siga ella.",fx:{d:20,h:-15,s:15},r:"Te vas a vivir al campo. Jessica gana un Pelícano en tu nombre. Lo recoges tú, por las fotos."},
 {t:"Recuperar mi puesto.",fx:{h:10,o:-5},r:"La crítica dice que «has empeorado mucho en una semana». Duele."},
 {t:"Gira conjunta: «{name} x2».",fx:{h:20,s:-10},r:"Dos personas idénticas cantando lo mismo a la vez. Nadie entiende el concepto. Se agota."}]},

{id:"mariano_viejo",st:[4],c:"mariano",w:4,cond:()=>F("mariano_amigo"),q:"Me estoy haciendo mayor. Quiero que cantes en mi funeral. Si desafinas, mis nietos ya saben lo que tienen que hacer.",opts:[
 {t:"Prometérselo solemnemente.",fx:{o:5,s:-5},r:"Te da un sobre con una dirección y una pala. «Por si acaso», dice. No preguntas."},
 {t:"Pedirle que me deje en paz para siempre.",fx:{o:10},f:{mafia:1},r:"Don Mariano no responde. Solo toca el ala del casco. Mal asunto."},
 {t:"Grabarle un disco de despedida.",fx:{h:15,d:15},r:"«Don Mariano canta coplas». Lo compran todas sus empresas. Obligatoriamente."}]},

/* ---------- El encapuchado y la misión ---------- */
{id:"encapuchado",chain:1,st:[1,2],c:"encapuchado",q:"(Un desconocido con capucha te para a la salida del bolo. No se le ve la cara. Huele a incienso y a gasolina). Tengo dos pitillos para ti. Uno te cura el cuerpo. El otro… te enseña la verdad. Solo puedes fumar uno.",opts:[
 {t:"Fumar el pitillo que cura.",heal:1,set:{alma:1},ck:"El encapuchado",r:"Das una calada. Se te van la resaca, la tos y una verruga que tenías desde 2009. Cuando te giras para darle las gracias, ya no está. En el suelo hay una pluma blanca."},
 {t:"Fumar el pitillo misterioso.",set:{alma:1},next:"cielo",r:"Das una calada. Todo se vuelve blanco. Oyes un coro que desafina. Huele a nube."}]},

{id:"cielo",chain:1,st:[1,2],c:"pedro",q:"Bienvenid[o|a] al cielo. Tranquil[o|a]: no estás muert[o|a], estás de visita. Te lo digo sin rodeos: el mundo va a ser destruido. No puedo decirte cuándo ni cómo. Solo sé que la única forma de evitarlo es que tú, {name}, llegues a ser una leyenda.",opts:[
 {t:"¿Yo? ¿Por qué yo?",next:"cielo2",r:"San Pedro suspira. «Eso mismo pregunté yo cuando me dieron tu expediente»."},
 {t:"¿Y si me niego?",next:"cielo2",r:"San Pedro señala hacia abajo. Muy abajo. Da calor solo de mirar."},
 {t:"¿Hay catering?",fx:{h:5},next:"cielo2",r:"Lo hay. Todo es nube. Sabe a algodón de azúcar sin azúcar."}]},

{id:"cielo2",chain:1,st:[1,2],c:"pedro",q:"No puedo contarte más. Está escrito en una profecía que nadie sabe leer porque tiene una letra horrible. Solo esto: cuando mueras, y morirás, te devolveré abajo. Una y otra vez. Hasta que lo consigas. Ah, y vigila al encapuchado.",opts:[
 {t:"¿Quién es el encapuchado?",fx:{o:5,s:10},set:{mision:1},ck:"El encapuchado",r:"San Pedro sonríe y no contesta. Parpadeas y estás otra vez en la puerta del bar, con el pitillo apagado en la mano. Te sientes ligero. Y vigilad[o|a]."},
 {t:"Lo haré. Por el mundo. Y por la fama.",fx:{h:10,s:10},set:{mision:1},ck:"El encapuchado",r:"«Sobre todo por la fama, ya», murmura San Pedro. Un empujón suave y caes de vuelta en la acera. Nadie te ha echado de menos."},
 {t:"¿Me puedo llevar una nube de recuerdo?",fx:{s:10,o:3},set:{mision:1},ck:"El encapuchado",r:"Te da una nube pequeña en un tarro. Al llegar abajo, el tarro está vacío. Pero huele a lluvia."}]},

{id:"hood2",st:[3],c:"encapuchado",w:5,cond:()=>F("alma")&&!F("diablo"),q:"(El encapuchado aparece en tu camerino. Ni Iker le ha visto entrar). Vas bien. Pero no te fíes de quien más te aplaude. Y no te comas nada que te ofrezca un amigo.",opts:[
 {t:"¿Quién eres?",fx:{h:5},r:"Se ríe. Es una risa que te suena muchísimo. Desaparece dejando olor a incienso y gasolina."},
 {t:"¿Me das otro pitillo?",fx:{s:15},r:"Te da uno. No es mágico: es de liar. Pero te sienta de maravilla."},
 {t:"Contratarle como asesor.",fx:{d:-10,h:10},r:"Acepta. Cobra en monedas antiguas que nadie reconoce. Nunca vuelve a aparecer por la oficina."}]},

{id:"hood3",st:[4],c:"encapuchado",w:8,cond:()=>F("alma")&&!F("diablo"),q:"(El encapuchado se baja por fin la capucha. Debajo estás tú. Treinta años más viej[o|a]). Yo ya fallé una vez. El mundo se acabó. Por eso he vuelto. No dejes que pase otra vez.",opts:[
 {t:"¿Qué hice mal?",fx:{o:5,s:5},r:"«Firmé con quien no debía, me fié de quien no debía y me comí los mejillones». Te pone una mano en el hombro y se desvanece."},
 {t:"Abrazarme.",fx:{s:10,o:5},r:"Es un abrazo raro. Hueles a ti mism[o|a], pero con más tabaco. Lloras. Tu yo viej[o|a] también."},
 {t:"Por lo menos, ¿ganamos a Kira?",fx:{h:10},r:"«Eso sí. Eso siempre», dice, y sonríe con tus mismos dientes torcidos."}]},

/* ---------- Exclusivos: Rockero desfasado ---------- */
{id:"rock_whisky",gen:"rock",st:[1,2,3],c:"manolo",q:"Te he puesto el whisky de garrafa de siempre. ¿Tercera botella o ya sales a cantar?",opts:[
 {t:"Tercera botella. El rock no se toca sobrio.",fx:{h:15,s:-12},f:{alcohol:1},r:"Cantas «Highway to Hell» tres veces seguidas convencid[o|a] de que son canciones distintas. El público no lo nota. Tampoco va sobrio."},
 {t:"Cantar sobri[o|a] por una vez.",fx:{o:5,h:-8},r:"Descubres que tus canciones son más largas de lo que recordabas. Y peores."},
 {t:"Una botella para el público. Invito yo.",fx:{o:15,d:-15},f:{alcohol:1},r:"Primera fila entregada. Segunda fila vomitando. Tercera fila, desaparecida."}]},
{id:"rock_pelea",gen:"rock",st:[1,2,3],c:"motero",q:"Has tocado mal la de los Eagles. Esa canción sonó en mi boda. Sal fuera.",opts:[
 {t:"Salir fuera.",fx:{h:15,s:-20},risk:[.15,"pelea"],r:"Pierdes un diente y ganas un amigo. Te tatúa tu nombre en el brazo con un boli Bic."},
 {t:"Invitarle a una ronda.",fx:{d:-10,o:5},f:{alcohol:1},r:"Tres rondas después lloráis abrazados cantando la de los Eagles. Bien, esta vez."},
 {t:"Romperle la guitarra en la cabeza.",fx:{h:25,o:-15,s:-10},r:"La guitarra era tuya. La cabeza, de hormigón. Pierdes la guitarra. Ganas leyenda."}]},
{id:"rock_solo",gen:"rock",st:[1,2,3,4],c:"chema",q:"Tu solo de guitarra dura veintitrés minutos. El público se ha ido a casa, ha cenado y ha vuelto.",opts:[
 {t:"Alargarlo a cuarenta.",fx:{h:10,o:-15},r:"Un crítico lo describe como «un viaje». Otro, como «un secuestro»."},
 {t:"Recortarlo a cuatro minutos.",fx:{o:5,h:-5},r:"Te sientes un traidor al rock. El público se siente gente que llega pronto a casa."},
 {t:"Tocarlo con los dientes.",fx:{h:20,s:-15},r:"Muy de los 70. Tu dentista te manda una postal de Navidad desde las Maldivas."}]},
{id:"rock_hotel",gen:"rock",st:[2,3],c:"vero",q:"Has tirado la tele por la ventana del hotel. Como en los 70. Pero esto es un hotel de carretera y era una tele de 85 pulgadas.",opts:[
 {t:"Pagar los daños.",fx:{d:-20},r:"Te cobran la tele, la ventana y el coche del recepcionista, que estaba aparcado debajo."},
 {t:"Tirar también la nevera.",fx:{h:20,o:-10,d:-15},f:{alcohol:1},r:"Antes te bebes lo que había dentro. Es lo único sensato que haces hoy."},
 {t:"Echarle la culpa a Chema.",fx:{o:-5,s:5},r:"Chema lo niega. Pero tiene antecedentes con teles. Le creen a medias."}]},
{id:"rock_resaca",gen:"rock",st:[2,3,4],c:"salas",q:"Tu resaca ya tiene nacionalidad propia y pide pasaporte. ¿Hablamos de tu relación con el alcohol?",opts:[
 {t:"Dejarlo una temporada.",fx:{s:20,h:-10},set:{alcohol:0},r:"Tres meses sin beber. Descubres que los conciertos tienen principio y final. Te parece fascinante."},
 {t:"«Es una relación sana».",fx:{s:-10,h:5},f:{alcohol:1},r:"La doctora apunta «negación» en tu historial. En mayúsculas."},
 {t:"Pasarme a la cerveza sin alcohol.",fx:{o:5,s:5,h:-5},r:"Te bebes treinta y cuatro en un concierto. Te emborrachas por sugestión."}]},
{id:"rock_poli",gen:"rock",st:[2,3],c:"comisario",w:5,q:"Necesitamos infiltrar a alguien en una banda heavy que trafica con púas de guitarra falsificadas. Nadie sospechará de un rockero acabado. Serán solo unos días.",opts:[
 {t:"Aceptar. Siempre quise una placa.",fx:{o:10,h:5},set:{poli:1},next:"rock_poli2",r:"Te dan una placa de plástico, un micro escondido en el pedal de distorsión y una consigna: «Actúa normal». Para ti, imposible."},
 {t:"Solo si me dejáis llevar pistola.",fx:{h:10,o:-5},set:{poli:1},next:"rock_poli2",r:"Te dan una pistola de agua. «Para que te sientas parte del equipo», dice el comisario."},
 {t:"Rechazarlo. Yo no soy un chivato.",fx:{o:-5,h:5},r:"El comisario se encoge de hombros. Al día siguiente te multan por ruido. Casualidad."}]},
{id:"rock_poli2",chain:1,st:[2,3],c:"motero",q:"(El jefe de la banda te mira fijamente). Toca en mi boda el sábado. Y hazme un favor: deja de hablarle a tu pedal de distorsión.",opts:[
 {t:"Tocar en la boda y grabarlo todo.",fx:{o:20,h:15},risk:[.2,"poli"],next:"rock_poli3",r:"Grabas al novio confesando en su discurso. La novia se entera de cosas peores. La boda acaba con detenciones y divorcio a la vez."},
 {t:"Confesar que soy policía.",fx:{o:10,s:-25},next:"rock_poli3",r:"Te dan la paliza de tu vida. Luego te piden un autógrafo «para el hijo». El hijo tiene cincuenta años."},
 {t:"Pasarme al lado oscuro.",fx:{d:30,o:-20},next:"rock_poli3",r:"Las púas falsificadas dan muchísimo dinero. El comisario te mira desde el coche patrulla. Ahora tú también llevas chaleco de cuero."}]},
{id:"rock_poli3",chain:1,st:[2,3],c:"comisario",q:"Caso cerrado. Te vamos a dar una medalla… y una multa por el whisky que había en la furgoneta de vigilancia.",opts:[
 {t:"Aceptar las dos cosas.",fx:{o:10,d:-10},r:"Cuelgas la medalla junto a tus discos de oro. Es lo único de la pared que te has ganado."},
 {t:"Pedir que me fichen para siempre.",fx:{h:10,s:-5},r:"«Ni de broma», dice el comisario. Pero te da su número. Por si vuelven las púas."},
 {t:"Hacer un disco: «Agente Distorsión».",fx:{h:20,o:5},r:"Disco conceptual sobre tu vida de policía. Tres días de vida de policía. Doble álbum."}]},
{id:"alcohol_final",chain:1,st:[1,2,3,4],c:"manolo",q:"Esta noche invita la casa. Es la última botella de garrafa que me queda. Y tu hígado lo sabe.",opts:[
 {t:"Brindar por el rock.",die:"cirrosis",r:"Fue un brindis precioso. El último."},
 {t:"No, Manolo. Hoy no.",die:"cirrosis",r:"Tu hígado dimite igualmente. Por despecho."},
 {t:"Guardármela para luego.",die:"cirrosis",r:"No hubo luego."}]},

/* ---------- Exclusivos: Punki del palo ---------- */
{id:"punk_poli",gen:"punk",st:[1,2,3],c:"comisario",q:"Otra vez tú. Te lo repito: escupir a un antidisturbios no es una performance.",opts:[
 {t:"Escupirle otra vez. Por el arte.",fx:{h:20,s:-10},f:{policia:1},r:"Te arrastran hasta la furgoneta. Desde dentro sigues cantando. El vídeo tiene más visitas que tu disco."},
 {t:"Pedir perdón.",fx:{o:5,h:-10},r:"Tus fans te acusan de «vendid[o|a] al sistema». Vendes tres camisetas menos."},
 {t:"Cantarle una canción sobre su madre.",fx:{h:15,o:-5},f:{policia:1},r:"La canción es pegadiza. El antidisturbios la tararea mientras te pone las esposas."}]},
{id:"punk_okupa",gen:"punk",st:[1,2,3],c:"toni",q:"Concierto en el okupa. No hay escenario, no hay luz y hay barra libre de… cosas.",opts:[
 {t:"Ir a por todas.",fx:{h:15,s:-15},f:{drogas:1},r:"Tocas en un sofá, rodead[o|a] de perros, con una sola cuerda en la guitarra. Tu mejor concierto."},
 {t:"Ir y solo tocar.",fx:{h:8,o:5},r:"Eres la persona más sobria del edificio. Te nombran portavoz de la asamblea. No sabes qué es eso."},
 {t:"Okupar yo el okupa.",fx:{h:20,o:-10},f:{policia:1},r:"Te atrincheras en el baño. La policía, los okupas y Toni te piden que salgas. A la vez."}]},
{id:"punk_furgo",gen:"punk",st:[2,3],c:"comisario",q:"Hemos requisado tu furgoneta de gira. En la guantera había «algo». ¿Algo que declarar?",opts:[
 {t:"«Eso no es mío».",fx:{o:-5},f:{policia:1},r:"Es tuyo. Lleva tu nombre escrito. Con faltas, pero tu nombre."},
 {t:"Pagar la fianza.",fx:{d:-20},r:"Recuperas la furgoneta. Sin guantera. Y sin el «algo»."},
 {t:"«Era de Chema».",fx:{o:-10,s:5},r:"Chema pasa una noche en el calabozo. Sale con un disco en la cabeza: «Mi colega es un chivato»."}]},
{id:"punk_tele",gen:"punk",st:[2,3],c:"maripili",q:"¡Bienvenid[o|a] al matinal! ¿Te podrías bajar la cresta? Es que tapa el rótulo.",opts:[
 {t:"Raparme en directo.",fx:{h:20,o:5},r:"Momento televisivo del año. Mari Pili guarda un mechón y lo subasta para una ONG."},
 {t:"Escupir al rótulo.",fx:{h:15,o:-15},f:{policia:1},r:"El rótulo era una pantalla de 40.000 €. La factura llega a tu casa antes que tú."},
 {t:"Cantar en susurros para no molestar.",fx:{o:10,h:-10},r:"Tu primera canción tranquila. Los punkis te repudian. Las abuelas te adoran."}]},
{id:"punk_cuerdas",gen:"punk",st:[1,2,3,4],c:"salas",q:"Tus cuerdas vocales están más deshilachadas que tus vaqueros. ¿Has probado a cantar sin gritar?",opts:[
 {t:"¿Cantar sin gritar? ¿Eso existe?",fx:{h:5,s:-15},r:"Sigues gritando. Ahora suenas como una puerta oxidada. Tus fans dicen que estás en tu mejor momento."},
 {t:"Reposo y caramelos de miel.",fx:{s:15,h:-10},r:"Durante un mes te comunicas con pancartas. Muy punk, en el fondo."},
 {t:"Grabar un disco solo de silencio.",fx:{h:15,o:-5},r:"«Cuatro minutos de nada» es número uno en las listas independientes. Nadie lo ha escuchado entero."}]},
{id:"punk_carcel",chain:1,st:[1,2,3,4],c:"comisario",q:"Se acabó. Tres altercados con la autoridad. Te vienes a comisaría. Y esta vez no te soltamos por ser gracios[o|a].",opts:[
 {t:"Entrar en la cárcel con la cabeza alta.",fx:{h:15,s:-20,d:-15},set:{policia:0},r:"Seis meses. Sales con un disco grabado en la celda: «Barrotes». Número uno. Tu compañero de celda hace los coros."},
 {t:"Escapar por la ventana de comisaría.",fx:{h:25},set:{policia:0},risk:[.4,"fuga"],r:"Escapas corriendo por los tejados, como en las películas. Las películas no enseñaban cuánto duelen las rodillas."},
 {t:"Sobornar al comisario.",fx:{d:-25,o:-15},set:{policia:0},r:"Acepta. Con el dinero se compra entradas para tu próximo concierto. En primera fila."}]},
{id:"punk_filo",gen:"punk",st:[2,3],c:"catedratica",w:5,q:"He leído tus letras. Usas la misma palabrota como sustantivo, adjetivo, verbo y signo de puntuación. Tienes un talento lingüístico… salvaje. ¿Te matriculas en Filología?",opts:[
 {t:"Matricularme.",fx:{o:10,d:-10,s:-5},set:{filo:1},later:["punk_filo2",5],r:"Vas a clase con la cresta, en primera fila. Sacas un 10 en Fonética: nadie pronuncia una «erre» como tú."},
 {t:"Solo si la tesis va sobre insultos.",fx:{h:10,o:5},set:{filo:1},later:["punk_filo2",5],r:"La catedrática acepta encantada. Lleva cuarenta años queriendo dirigir esa tesis."},
 {t:"La universidad es el sistema.",fx:{h:5,o:-5},r:"Lo dices en un tuit con cuatro faltas de ortografía. La catedrática te las corrige en rojo. En público."}]},
{id:"punk_filo2",chain:1,st:[2,3,4],c:"catedratica",q:"Defensa de tu tesis: «El insulto como unidad de significado en el punk español». Tribunal: tres catedráticos y tu madre.",opts:[
 {t:"Defenderla gritando.",fx:{h:20,o:10},r:"Cum laude. Tu madre llora. El tribunal también, pero de miedo."},
 {t:"Defenderla con corbata.",fx:{o:15,h:-10},r:"Los catedráticos aplauden. Tus fans te dan por muert[o|a] para el punk."},
 {t:"Copiar media tesis de internet.",fx:{o:-20,h:10},r:"Copiaste un foro de 2003. El foro era tuyo. Técnicamente no es plagio. Aprobado raspado."}]},

/* ---------- Exclusivos: Amo a Laura ---------- */
{id:"laura_obispo",gen:"laura",st:[1,2,3],c:"monsenor",q:"Tu disco «Laura, no te toco hasta el matrimonio» se vende muy bien en las parroquias. La diócesis querría un 30 %. Por el amor de Dios.",opts:[
 {t:"Ceder el 30 %.",fx:{d:-15,o:10},r:"Monseñor te bendice. Luego se compra un coche. Luego bendice el coche."},
 {t:"Ni un euro.",fx:{d:5,o:-10},r:"Tus discos desaparecen de las parroquias. Aparecen los de un monaguillo de doce años con autotune."},
 {t:"El 40 %, si me hacéis santo en vida.",fx:{d:-20,h:15},r:"No te hacen santo, pero sales en una estampita. Edición limitada. En los patios se cambian como cromos."}]},
{id:"laura_favor",gen:"laura",st:[1,2,3],c:"benito",q:"Una señora ofrece 5.000 € si cantas en la comunión de su nieto y le haces creer que va a venir el Papa en persona.",opts:[
 {t:"Disfrazarme de Papa.",fx:{d:20,h:10,o:-10},r:"Bendices a doscientos invitados. Una abuela se desmaya. El nieto pide una foto. Monseñor no se entera. Todavía."},
 {t:"Negarme. Eso es pecado.",fx:{o:5,d:-5},r:"Benito asiente, orgulloso. Luego va él, disfrazado. Cobra 6.000 €."},
 {t:"Cobrar el doble y que vaya Benito disfrazado.",fx:{d:15,o:-5},r:"Benito hace un Papa espectacular. Tres familias más le contratan para bautizos."}]},
{id:"laura_campamento",gen:"laura",st:[1,2],c:"benito",q:"Campamento de verano: trescientos adolescentes, una guitarra acústica y tú cantando sobre la castidad durante dos semanas.",opts:[
 {t:"Ir con toda la ilusión.",fx:{o:15,s:-10,d:5},r:"Al tercer día te roban la guitarra. Al quinto, la cuerda de repuesto. Al décimo, la fe."},
 {t:"Ir, pero con rock cristiano.",fx:{h:15,o:-5},r:"Los adolescentes hacen pogo con «Pescador de hombres». Benito se rompe la clavícula en el pogo."},
 {t:"No ir.",fx:{s:5,o:-5},r:"Va Kira Star, que se ha hecho católica esta semana por marketing. Arrasa."}]},
{id:"laura_milagro",gen:"laura",st:[2,3],c:"monsenor",q:"Una fan asegura que tu canción le curó una verruga. El Vaticano quiere investigar el milagro. Y cobrar por él.",opts:[
 {t:"Aceptar el milagro.",fx:{h:25,o:-5},r:"Te llegan diez mil cartas con fotos de verrugas. Con detalle. Tienes pesadillas."},
 {t:"Negarlo con humildad.",fx:{o:15,h:-5},r:"La humildad te hace aún más famos[o|a]. Las monjas te piden autógrafos. Discretamente."},
 {t:"Vender agua bendita con mi cara en la etiqueta.",fx:{d:25,o:-15},r:"«Agua de {name}: cura verrugas, juanetes y desamores». Sanidad te abre un expediente."}]},
{id:"laura_tentacion",gen:"laura",st:[2,3],c:"lucia",q:"Ven a mi fiesta. Habrá gente guapísima y un vino que, te lo aseguro, no es de misa.",opts:[
 {t:"Ir y resistir la tentación.",fx:{o:10,s:-5,h:5},r:"Te pasas la fiesta rezando el rosario en un rincón. Es tendencia: #RosarioChallenge."},
 {t:"Ir y no resistirla.",fx:{h:20,o:-20},r:"Las fotos llegan a Monseñor antes que tú a casa. Tres avemarías. Y una multa."},
 {t:"No ir.",fx:{s:5,h:-5},r:"Te quedas viendo misa por la tele. Te duermes en la homilía. Como siempre."}]},
{id:"laura_amor",gen:"laura",st:[2,3],c:"amor",w:5,q:"Llevamos dos años cantando en misa codo con codo. Tengo que decirte algo y no sé cómo… Creo que no te miro solo como [compañero|compañera] de coro.",opts:[
 {t:"«Yo tampoco».",fx:{s:10,h:5},set:{amor:1},later:["laura_amor2",4],r:"Os dais la mano detrás del órgano. Por primera vez en años, cantas sin pensar en las ventas."},
 {t:"«No puede ser. Por el disco».",fx:{s:-15,o:5},r:"[Gabriel|Valentina] asiente en silencio. Esa tarde los dos desafináis en «Alma mía». No es casualidad."},
 {t:"Escribir juntos una canción a escondidas.",fx:{h:10,s:5},set:{amor:1},later:["laura_amor2",4],r:"Se llama «Lo que no se dice en la sacristía». Es lo mejor que has escrito nunca."}]},
{id:"laura_amor2",chain:1,st:[2,3,4],c:"monsenor",q:"Me han llegado fotos tuyas con [Gabriel|Valentina] en la sacristía. Y no estabais rezando. En mi diócesis, esto no.",opts:[
 {t:"Contarlo en directo, con orgullo.",fx:{o:20,h:25,d:-20},r:"Pierdes las parroquias y ganas el mundo. «Amo a [Gabriel|Valentina]» se convierte en himno. Monseñor la tararea en la ducha. Lo sabe media diócesis."},
 {t:"Negarlo todo.",fx:{s:-20,o:-5},r:"[Gabriel|Valentina] deja el coro sin decir nada. Ganas a Monseñor y pierdes lo único bueno del año."},
 {t:"Pagar a Monseñor para que calle.",fx:{d:-25,s:5},r:"Monseñor cobra, calla y se compra un yate. Lo bautiza «Discreción». Vosotros seguís juntos, pero más pobres."}]},

/* ---------- Exclusivos: Indie desentonado ---------- */
{id:"indie_cafe",gen:"indie",st:[1,2,3],c:"barista",q:"Te recomiendo nuestro cold brew de cardamomo fermentado en barrica de roble lapón. Son 14 €. La taza es una lata de anchoas reciclada.",opts:[
 {t:"Pedir tres.",fx:{d:-10,h:5,s:-5},r:"Taquicardia de diseño. Esa noche escribes un disco entero: «Cardamomo». Tiene una sola canción de cuarenta minutos."},
 {t:"Agua del grifo, por favor.",fx:{o:-5,d:5},r:"Te miran como si hubieras pedido un bocadillo de Nocilla en un restaurante con estrella Michelin."},
 {t:"Que el café lleve mi nombre.",fx:{d:10,h:5,o:-5},r:"«Cold brew {name}», 16 €. Sabe a ti. Nadie sabe qué significa eso. Se agota."}]},
{id:"indie_retiro",gen:"indie",st:[1,2,3],c:"guru",q:"Retiro de silencio de diez días en el desierto. Sin móvil, sin hablar, sin gluten y sin juicios. Bueno, juicios sí, pero en silencio.",opts:[
 {t:"Ir.",fx:{s:15,d:-15,h:-10},f:{secta:1},r:"Vuelves con la piel brillante, la mente limpia y un mandala tatuado que no recuerdas haberte hecho."},
 {t:"Ir y subir stories todos los días.",fx:{h:10,o:-15},r:"Te echan el segundo día. Subes una story llorando en el desierto. Es tu publicación más vista."},
 {t:"No ir.",fx:{h:-5,s:-5},r:"Todos tus amigos indies vuelven iluminados. Tú sigues a oscuras. Y con gluten."}]},
{id:"indie_vinilo",gen:"indie",st:[1,2],c:"montero",q:"Tu disco solo existe en vinilo, casete y tarjeta perforada. ¿Podemos subirlo a plataformas? Por favor.",opts:[
 {t:"Jamás. El streaming es el sistema.",fx:{o:10,d:-15},r:"Lo escuchan doscientas personas. Todas con bigote. Todas con tote bag."},
 {t:"Vale, pero en una plataforma que no use nadie.",fx:{h:5,o:5},r:"Tienes treinta y cuatro oyentes mensuales. Uno es tu madre, por error."},
 {t:"Subirlo a todo, sin complejos.",fx:{d:15,h:10,o:-10},r:"Tus fans te acusan de mainstream. Tus nuevos fans no saben ni lo que significa."}]},
{id:"indie_festival",gen:"indie",st:[2,3],c:"vero",q:"Te han dado el escenario del festival a las 15:00. Cuarenta grados. Cuarenta personas. Todas con gafas sin graduación.",opts:[
 {t:"Tocar como si fuera el cierre.",fx:{h:15,s:-15},r:"Te desmayas en la tercera canción. El público cree que es parte del concepto. Aplaude."},
 {t:"Tocar de espaldas al público.",fx:{h:10,o:-10},r:"Muy de artista. El público también se da la vuelta. Nadie mira a nadie. Es arte."},
 {t:"Pedir que me pasen al horario de noche.",fx:{o:-5,d:-5},r:"Te ponen a las 4:30 de la madrugada, delante de un guardia de seguridad y dos gaviotas."}]},
{id:"indie_ayahuasca",gen:"indie",st:[2,3],c:"guru",q:"Ceremonia de ayahuasca para encontrar tu sonido. Verás a tu animal interior. Él te dirá qué acordes usar.",opts:[
 {t:"Tomarla.",fx:{h:20,s:-10},risk:[.15,"ayahuasca"],r:"Tu animal interior es una nutria. Te dice: «Do, Sol, La menor, Fa». Exactamente los de siempre."},
 {t:"Fingir que la tomo.",fx:{h:5,o:5},r:"Te pasas la noche fingiendo visiones. Describes «colores con sabor a jazz». El gurú toma nota."},
 {t:"No tomar nada.",fx:{s:5,h:-5},r:"Te sientas a mirar cómo otros ven a Dios. Uno vomita sobre tus zapatillas veganas."}]},
{id:"indie_anuncio",gen:"indie",st:[2,3,4],c:"cola",q:"Queremos tu canción más triste para el anuncio de un coche. Sale una familia feliz. Tu canción habla de la muerte de tu gato.",opts:[
 {t:"Venderla.",fx:{d:25,o:-15},r:"Ahora tu gato muerto vende monovolúmenes. Sientes que le has fallado. El cheque ayuda."},
 {t:"Negarme. El gato no se vende.",fx:{o:10,d:-5},r:"Usan una canción de Kira Star sobre un hámster. Funciona igual."},
 {t:"Venderla y donarlo a una protectora.",fx:{o:15,d:5},r:"La protectora pone tu nombre a un gato. El gato te odia, como todos los gatos."}]},
{id:"indie_cripto",gen:"indie",st:[2,3],c:"brayan",w:5,q:"Bro, lanza tu propia criptomoneda: $DESAFINO. Tus fans la comprarán por ironía. La ironía cotiza muchísimo.",opts:[
 {t:"Lanzar $DESAFINO.",fx:{d:20,h:10,o:-5},set:{cripto:1},later:["indie_cripto2",4],r:"En una hora, tres mil fans compran $DESAFINO. Ninguno sabe para qué sirve. Tú tampoco."},
 {t:"Invertir mis ahorros en $KIRA.",fx:{d:-15},set:{cripto:1},later:["indie_cripto2",4],r:"Kira Star también tiene criptomoneda. Inviertes en tu enemiga. La conciencia, sucia; la cartera, diversificada."},
 {t:"No entiendo nada. Paso.",fx:{o:5},r:"Brayan te mira con lástima: «Tú te lo pierdes, bro». Se va en un patinete de 9.000 €."}]},
{id:"indie_cripto2",chain:1,st:[2,3,4],c:"brayan",q:"Bro, bro, BRO. El gráfico se ha vuelto loco. O hemos subido un 4.000 % o hemos bajado un 99 %. Va tan rápido que no lo sé.",opts:[
 {t:"Vender todo YA.",fx:{d:30,o:-10},r:"Te forras. Tus fans pierden sus ahorros. Te llaman «el Madoff del indie». Lo pones en tu biografía."},
 {t:"Aguantar. Hodl.",fx:{d:35,h:5},alt:[.5,{d:-30},"Era un 99 % hacia abajo. Brayan desaparece. Su patinete aparece flotando en un río."],r:"Era un 4.000 % hacia arriba. Te compras una isla. Pequeña. Una roca, en realidad. Pero tuya."},
 {t:"Regalárselo todo a mis fans.",fx:{o:20,d:-10},r:"Tus fans te adoran. Tres días después la moneda vale cero. Te siguen adorando, pero menos."}]},

/* ---------- Neonazis: la trama a fondo ---------- */
{id:"nazi_madre",st:[2,3],c:"pura",w:4,cond:()=>F("neonazis")>=1||F("nazifan"),q:"Soy la madre de Bruno. Mi Brunito, de pequeño, lloraba con las canciones de Marisol. No sé en qué nos equivocamos. ¿Hablarías con él?",opts:[
 {t:"Hablar con Bruno.",fx:{o:10,s:-10},set:{charla_bruno:1},r:"Le esperas en la puerta del club. No te pega. Te escucha. Se va sin decir nada, pero pensativo, que ya es algo."},
 {t:"Darle a ella entradas para mi concierto.",fx:{o:5,d:-5},r:"Doña Pura viene a primera fila con abanico. Bruno la recoge a la salida sin mirarte. Pero lleva una camiseta tuya debajo de la cazadora."},
 {t:"«Señora, su hijo me quiere matar».",fx:{s:5,o:-5},r:"Doña Pura suspira: «Ya, hij[o|a]. Y a mí, que me arregle el grifo». Te da una magdalena."}]},
{id:"bruno_cambio",st:[3,4],c:"bruno",w:6,cond:()=>F("charla_bruno"),q:"Mi madre dice que hablaste con ella. He escuchado tu disco. El segundo. Lloré. Como se lo cuentes a los chicos, te mato. Bueno… es una forma de hablar.",opts:[
 {t:"Animarle a dejar el club.",fx:{o:20,s:-5},set:{neonazis:0,nazifan:0,bruno_redimido:1},r:"Bruno deja el club y se deja crecer el pelo. Le sale rizado. Ahora trabaja en una floristería. Llora con los tulipanes."},
 {t:"Contárselo a los chicos.",fx:{h:15,o:-10},f:{neonazis:1},r:"Los chicos le dan una paliza por sentimental. Bruno te mira desde el suelo. Eso no se olvida."},
 {t:"Ofrecerle trabajo de roadie.",fx:{o:10,d:-10},set:{neonazis:0,bruno_redimido:1},r:"Es el mejor roadie que has tenido: carga cuarenta kilos de amplificador y llora con las baladas. El club le declara traidor."}]},
{id:"dani",st:[2,3],c:"dani",w:4,cond:()=>F("neonazis")>=1||F("nazifan"),q:"Soy Dani, el hermano pequeño de Bruno. Quiero salir del club, pero me da miedo. ¿Me dejas ser tu técnico de sonido? Sé conectar cables. Bueno, cosas.",opts:[
 {t:"Contratarle.",fx:{o:15,d:-5},f:{neonazis:1},set:{dani:1},r:"Dani conecta los cables al revés, pero con muchísimas ganas. El club os pone a los dos en su lista negra."},
 {t:"Ponerle en contacto con una ONG.",fx:{o:10},r:"La ONG le ayuda a salir. Te manda una carta de agradecimiento. Con faltas, pero sin esvásticas."},
 {t:"No quiero líos.",fx:{s:5,o:-10},r:"Dani se va con la cabeza gacha. Lo verás dentro de un año en una manifestación. En el lado equivocado."}]},
{id:"marta_docu",st:[2,3],c:"marta",w:4,cond:()=>F("neonazis")>=1||F("nazifan"),q:"Investigo la red de Bruno. Necesito a alguien famoso que se infiltre en uno de sus conciertos con una cámara oculta. Será un documental.",opts:[
 {t:"Infiltrarme.",fx:{h:25,o:20},risk:[.25,"documental"],r:"Grabas cuatro horas de material. Nadie sospecha: cantas sus canciones fatal, como uno más. El documental es demoledor."},
 {t:"Darle información anónima.",fx:{o:10},f:{neonazis:1},r:"Marta publica un reportaje brutal. Bruno sabe que alguien habló. Sospecha de ti. Sospecha bien."},
 {t:"Rechazarlo. Ya tengo bastante.",fx:{s:5,o:-5},r:"Marta se va sin decir nada. El documental sale igual, con otra persona. Gana un premio."}]},
{id:"nazi_marcha",st:[2,3,4],c:"bruno",w:4,cond:()=>F("neonazis")>=1,q:"Mañana hacemos una marcha por tu calle. Con antorchas y tambores. Si bajas a saludar, te guardamos sitio.",opts:[
 {t:"Concierto antifascista desde el balcón.",fx:{o:25,h:15,s:-15},f:{neonazis:1},r:"Cuatrocientos vecinos se suman desde sus ventanas. La marcha se disuelve entre cacerolas y una tuba. Bruno levanta la vista. Te apunta."},
 {t:"Cerrar las persianas.",fx:{o:-10,s:5},r:"Escuchas los tambores desde el sofá. Te sientes fatal. Y a salvo. Sobre todo fatal."},
 {t:"Irme ese día a casa de mi madre.",fx:{o:-5,s:10},r:"Tu madre te hace croquetas. Cuando vuelves, te han pintado el portal. Con faltas, otra vez."}]},
{id:"nazi_tatuaje",st:[2,3],c:"bruno",w:4,cond:()=>F("nazifan"),q:"Los chicos se van a tatuar tu cara. En el brazo. Al lado de… otras caras. Es un honor, ¿eh?",opts:[
 {t:"Prohibírselo.",fx:{o:10},f:{neonazis:1},set:{nazifan:0},r:"Bruno no entiende nada: «¿No eras de los nuestros?». No. Nunca. Ahora lo sabe."},
 {t:"Mientras paguen derechos de imagen…",fx:{d:15,o:-25},r:"Te pagan. Tu cara aparece entre caras horribles. Pierdes contratos, amigos y dignidad. Ganas 1.500 €."},
 {t:"Que me tatúen sin papada, por favor.",fx:{h:10,o:-15},r:"El tatuador te favorece mucho. Es lo único bueno de esta historia."}]},

/* ---------- Más alcohol ---------- */
{id:"tito_rep",rep:1,st:[1,2,3,4],c:"tito",q:"¿Una cañita? ¿Un carajillo? ¿Un sol y sombra para el alma? Invito yo. Bueno, pagas tú, pero invito yo.",opts:[
 {t:"Una caña y me voy.",fx:{o:3,s:-3,h:2},r:"Una caña. Y otra. «Y me voy» resulta ser una expresión hecha."},
 {t:"Lo que pidas tú, Tito.",fx:{h:8,s:-10},f:{alcohol:1},r:"El Tito pide un licor de hierbas de un pueblo que no existe. Acabáis cantando por bulerías."},
 {t:"Agua, Tito.",fx:{s:5,o:-3},r:"El Tito te mira como si le hubieras insultado a la madre."}]},
{id:"apuesta",st:[1,2],c:"tito",q:"Te apuesto cien euros a que no te bebes un litro de cerveza de un trago mientras cantas el estribillo.",opts:[
 {t:"Aceptar la apuesta.",fx:{d:10,h:10,s:-15},f:{alcohol:1},r:"Lo consigues. El estribillo suena a gárgaras, pero lo consigues. El Tito te paga en monedas de veinte céntimos."},
 {t:"Contraapuesta: que se lo beba él.",fx:{o:5,d:5},r:"El Tito se lo bebe en cuatro segundos y sin cantar. Es su verdadero talento. Te cobra igual."},
 {t:"Rechazarla.",fx:{o:-5,s:5},r:"El bar entero te abuchea. El Tito reparte cacahuetes entre el público como consuelo."}]},
{id:"chupitos",st:[2,3],c:"lucia",q:"¡Ronda de chupitos! Son de algo verde que brilla en la oscuridad. Nadie sabe qué lleva. Eso es lo divertido.",opts:[
 {t:"Uno, por cortesía.",fx:{h:5,s:-5},r:"Te brillan los dientes toda la noche. Es tendencia."},
 {t:"Siete. Por el arte.",fx:{h:15,s:-20},f:{alcohol:1},r:"Despiertas en una azotea abrazad[o|a] a una antena. Tienes cobertura 5G. Tú, personalmente."},
 {t:"Ninguno. Mañana tengo bolo.",fx:{s:5,h:-5},r:"Lucía sube una story: «{name} se ha vuelto aburrid[o|a]». Cuarenta mil visualizaciones."}]},
{id:"cata",st:[3,4],c:"ambrosio",q:"Señor[|a], la cata de vinos de esta noche: botellas de mil euros. El sumiller insiste en que el vino se escupe.",opts:[
 {t:"Escupir como un profesional.",fx:{o:5,d:-10},r:"Escupes con tanta elegancia que el sumiller llora. Te ofrecen un puesto en Burdeos."},
 {t:"Bebérmelo todo.",fx:{h:10,s:-15},f:{alcohol:1},r:"Doce mil euros de vino en el cuerpo. Acabas cantando ópera en la bodega. Desafinas en francés."},
 {t:"Mezclarlo con gaseosa.",fx:{h:15,o:-15},r:"El sumiller se desmaya. Vídeo viral: «Tinto de verano de mil euros». Lo copian todos los chiringuitos."}]},
{id:"alcohol_aviso",chain:1,st:[1,2,3,4],c:"salas",q:"Tu hígado me ha mandado un correo electrónico. Con copia a tu madre. Pide que pares. Literalmente pone «por favor».",opts:[
 {t:"Dejarlo una temporada.",fx:{s:20,h:-10},set:{alcohol:1},r:"Tres meses sin beber. Descubres que tus amigos son aburridísimos sobrios. Y tú también."},
 {t:"Solo cerveza, a partir de ahora.",fx:{s:-5},r:"La doctora suspira. Tu hígado también. Lo oyes perfectamente."},
 {t:"Brindar por mi hígado.",fx:{s:-10,h:5},f:{alcohol:1},r:"El brindis sale en todos los medios. Tu hígado redacta su testamento."}]},

/* ---------- Exes ---------- */
{id:"ex_nueva",st:[2,3],c:"sam",nogen:["laura"],q:"Hola. Soy la nueva pareja de tu ex. Y fan de tu música desde hace años. ¿Me firmas un disco? No se lo digas, por favor.",opts:[
 {t:"Firmárselo con cariño.",fx:{o:5,h:5},r:"Tu ex encuentra el disco firmado. Discuten. Por ti. Te encanta, y te odias porque te encante."},
 {t:"Contarle todos los defectos de mi ex.",fx:{h:10,o:-10},r:"Sam toma notas. Muchas. Dos semanas después vuelven a estar sin pareja. Y te culpan los dos."},
 {t:"Ligar con Sam.",fx:{h:20,o:-20,s:-5},r:"Funciona. Ahora tu ex tiene dos motivos para odiarte. Y Sam también, a la semana."}]},
{id:"ex2",st:[2,3],c:"ex2",nogen:["laura"],q:"¿Te acuerdas de mí? Salimos tres semanas en 2015. Voy a publicar un libro: «Mis tres semanas con {name}». Tiene seiscientas páginas.",opts:[
 {t:"Pagarle para que no lo publique.",fx:{d:-15},r:"Coge el dinero y publica otro: «Lo que {name} me pagó por callarme»."},
 {t:"Contestar con mi libro: «Mis tres semanas con nadie».",fx:{h:15,o:-5},r:"Tu libro tiene doce páginas. Vende más. La gente prefiere los libros cortos."},
 {t:"Volver tres semanas más, por los viejos tiempos.",fx:{h:10,s:-10},r:"Las tres semanas se vuelven seis. Álex amplía el libro. Ahora es una trilogía."}]},
{id:"ex_boda",st:[3],c:"ex",nogen:["laura"],q:"Me caso. Quiero que cantes en mi boda la canción que me escribiste. La buena. La de antes de lo del tranvía.",opts:[
 {t:"Cantarla con toda el alma.",fx:{o:15,s:-10},r:"Lloras tú, llora tu ex, llora la persona con la que se casa. Cada cual por un motivo distinto."},
 {t:"¡Me opongo!",fx:{h:25,o:-20},r:"Te levantas cuando el cura pregunta. Silencio total. Nadie sabe qué viene después. Tú tampoco. Te sacan los camareros."},
 {t:"No ir y mandar un regalo pasivo-agresivo.",fx:{h:5,s:5},r:"Les regalas un tranvía de juguete. Lo entienden perfectamente."}]},
{id:"ex_podcast",st:[3,4],c:"ex2",nogen:["laura"],w:4,q:"Tus exes hemos abierto un pódcast: «Sobreviví a {name}». Vamos por el episodio cuarenta. Queremos que vengas de invitad[o|a].",opts:[
 {t:"Ir y defenderme.",fx:{h:25,o:-10,s:-10},r:"Tres contra uno durante dos horas. Pierdes. Pero el episodio es número uno en todas las plataformas."},
 {t:"Demandarles.",fx:{d:-10,o:-10},r:"La demanda se convierte en el episodio cuarenta y uno. Y en el cuarenta y dos."},
 {t:"Ir y llevar a mi madre.",fx:{o:15,h:10},r:"Tu madre se pone de su lado y cuenta cosas de cuando eras pequeñ[o|a]. Episodio más escuchado de la historia."}]},
{id:"ex_viejos",st:[4],c:"ex",nogen:["laura"],w:4,q:"Ya somos mayores. Mi boda duró dos años. ¿Y si lo intentamos otra vez? Esta vez sin tranvías.",opts:[
 {t:"Sí. ¿Por qué no?",fx:{s:15,o:10},r:"Desayunáis juntos cada día. Discutís por el mando de la tele. Es lo más parecido a la paz que has conocido."},
 {t:"No. Hay heridas que no cierran.",fx:{s:-5,h:5},r:"Escribes una canción sobre ello. Triste y preciosa. Tu ex la escucha en bucle."},
 {t:"Solo los fines de semana.",fx:{s:5,h:5},r:"Funciona sorprendentemente bien. Los lunes os echáis de menos. Los domingos por la noche, no tanto."}]},

/* ---------- Lord Bigotes, el perro que habla (tres conversaciones) ---------- */
{id:"perro1",st:[1,2],c:"perro",w:4,q:"Buenas. Soy un perro. No te asustes: solo hablo los martes. Hoy es jueves, así que esto no está pasando. ¿Tienes un yogur de fresa? No es para comer. Es para escucharlo.",opts:[
 {t:"Darle un yogur de fresa.",fx:{h:5},set:{perro:1},r:"Se lo acerca a la oreja y asiente muy serio. «Lo sabía», dice. No aclara qué sabía."},
 {t:"«¿Los perros hablan?».",fx:{s:-3},set:{perro:1},r:"«Solo los que tienen algo que decir. Yo no tengo nada que decir. Por eso hablo tanto»."},
 {t:"Ladrarle.",fx:{o:-3,h:3},set:{perro:1},r:"Te mira con una tristeza infinita. «Qué vulgar», dice, y se aleja dando saltitos."}]},
{id:"perro2",st:[2,3],c:"perro",w:5,cond:()=>F("perro")===1,q:"Volvemos a vernos. He estado pensando en el yogur. Todos los yogures son el mismo yogur, ¿lo sabías? El universo es un yogur. Tú eres la cuchara. Yo soy el que cierra la tapa.",opts:[
 {t:"¿Y quién se come el yogur?",fx:{h:5},set:{perro:2},r:"El perro te mira fijamente un minuto entero. Luego dice: «Los martes». Y se rasca la oreja."},
 {t:"Llamar a un veterinario.",fx:{d:-5},set:{perro:2},r:"El veterinario examina al perro y dice que está perfectamente. El perro le pregunta por su divorcio. El veterinario se echa a llorar."},
 {t:"Pedirle consejo profesional.",fx:{h:3,o:3},set:{perro:2},r:"«Nunca grabes un disco en Sol si puedes grabarlo en domingo». Lo apuntas. Lo entiendes menos cada vez que lo lees."}]},
{id:"perro3",st:[3,4],c:"perro",w:6,cond:()=>F("perro")===2,q:"Esta es nuestra última conversación. Me voy a ser alcalde de una ciudad que todavía no existe. Antes de irme: la respuesta es «tres». La pregunta no te la puedo decir.",opts:[
 {t:"«¿Tres qué?».",fx:{h:5},set:{perro:3},r:"«Exacto», dice, y se da la vuelta. En el collar lleva prendida una pluma blanca. No vuelves a verlo nunca."},
 {t:"Abrazar al perro.",fx:{s:10},set:{perro:3},r:"Huele a galleta y a algo que no consigues recordar. Un poco a incienso. Un poco a gasolina."},
 {t:"Pedirle que se quede.",fx:{o:5,s:5},set:{perro:3},r:"«No puedo. Los martes tengo pilates». Te lame la mano y desaparece detrás de una farola demasiado estrecha para un perro."}]},

/* ---------- La persecución del camión de los helados ---------- */
{id:"helado",st:[1,2,3,4],c:"nino",w:3,q:"¡EL CAMIÓN DE LOS HELADOS! ¡Se va por la avenida! ¡Corre, que el de fresa se acaba!",opts:[
 {t:"¡A por él!",fx:{s:-2},next:"helado2",r:"Echas a correr detrás de la musiquita. El niño corre a tu lado. Tú jadeas. Él no."},
 {t:"Ya no tengo edad para esto.",fx:{o:-3,h:-3},r:"El camión se pierde a lo lejos. El niño te mira con desprecio. Tiene ocho años y ya te ha calado."},
 {t:"Pagar al niño para que corra por mí.",fx:{d:-5},r:"El niño coge el dinero y sale corriendo en dirección contraria. Bien jugado, chaval."}]},
{id:"helado2",chain:1,st:[1,2,3,4],c:"nino",q:"(El niño frena en seco). ¡Un cruce! La musiquita suena… no sé de dónde. ¿Izquierda, derecha o recto?",opts:[
 {t:"¡Izquierda!",chase:[.45,"helado3","¡Bien! La musiquita suena más fuerte. Lo ves doblar la siguiente esquina.",{s:-5,h:-2},"Calle sin salida. Solo hay un contenedor y un gato que te juzga. La musiquita se aleja para siempre.",{h:8}]},
 {t:"¡Derecha!",chase:[.45,"helado3","¡Acierto! Ves el techo del camión asomando por encima de los coches aparcados.",{s:-5,h:-2},"Te metes en un mercadillo. Sales con tres pares de calcetines y sin camión.",{h:8}]},
 {t:"¡Recto!",chase:[.45,"helado3","¡Ahí está! Lo tienes a cincuenta metros. El heladero no se ha dado cuenta.",{s:-5,h:-2},"Recto había una cuesta. Muy cuesta. Te sientas a mitad. El camión sigue con su vida.",{h:8}]}]},
{id:"helado3",chain:1,st:[1,2,3,4],c:"nino",q:"¡Ya casi! Pero hay una obra de Don Mariano en medio y un atajo por un parque lleno de palomas. ¿Por dónde?",opts:[
 {t:"Saltar la valla de la obra.",chase:[.5,"helado_final","Saltas la valla, esquivas una hormigonera y caes justo delante del camión.",{s:-8},"Te quedas colgad[o|a] de la valla por los pantalones. Un obrero te hace una foto. Mañana la tendrá Don Mariano.",{h:10}]},
 {t:"Por el parque de las palomas.",chase:[.5,"helado_final","Mil palomas levantan el vuelo a tu paso, como en una película. Sales del parque justo delante del camión.",{s:-5,o:-3},"Las palomas te atacan en formación. Sales del parque con plumas en el pelo y sin helado.",{h:10}]},
 {t:"Por la acera, como una persona normal.",chase:[.5,"helado_final","Funciona. A veces lo normal funciona. El camión para en un semáforo y llegas.",{s:-4},"El semáforo se pone en verde justo cuando llegas. La musiquita se despide con una nota burlona.",{h:10}]}]},
{id:"helado_final",chain:1,st:[1,2,3,4],c:"heladero",q:"¡Vaaale, vale, ya paro! Nadie me perseguía así desde 1994. Me quedan tres sabores. ¿Qué te pongo?",opts:[
 {t:"Fresa. Como cuando era pequeñ[o|a].",fx:{h:40},heal:90,safe:1,r:"El primer lametazo te devuelve la infancia, la salud y las ganas de vivir. El niño lo graba. Es lo más bonito que has subido nunca."},
 {t:"Chocolate con trocitos.",fx:{h:40},heal:90,safe:1,r:"Te lo comes en el bordillo, con el niño. Habláis de la vida. Él sabe más que tú."},
 {t:"El sabor misterioso.",fx:{h:40},heal:90,safe:1,r:"Sabe a nube. Como en el cielo. El heladero te guiña un ojo. En la gorra lleva prendida una pluma blanca."}]},

/* ---------- Partidos políticos (según tu estilo) ---------- */
{id:"partido_ultra",gen:"laura",st:[2,3],c:"fernando",w:6,cond:()=>!F("partido"),q:"Patria y Rosario necesita una voz. Alguien que cante, rece y no haga preguntas. Pagamos bien, en efectivo y con bendición incluida.",opts:[
 {t:"Unirme al partido.",fx:{d:20,h:15,o:-20},set:{partido:"ultra",nazifan:1},r:"Te hacen cantar el himno del partido con mantilla. Bruno «El Calvo» te manda un pulgar arriba. Eso no puede ser bueno."},
 {t:"Rechazarlo. Mi fe no se vota.",fx:{o:10,d:-5},r:"Don Fernando te mira como a un hereje. Monseñor Gil, en cambio, te guiña un ojo."},
 {t:"Unirme y cambiarles el himno por una balada de amor.",fx:{h:20,o:5},set:{partido:"ultra"},r:"El mitin acaba con trescientos señores con chaleco acolchado cantando «Te quiero, te quiero». Algunos lloran. Don Fernando no sabe si echarte o subirte el sueldo."}]},
{id:"ultra_mitin",st:[3],c:"fernando",w:6,cond:()=>F("partido")==="ultra",q:"Mitin en la plaza de toros. Cantarás el himno mientras soltamos cien palomas. Están un poco nerviosas. Y yo también.",opts:[
 {t:"Cantar con fervor.",fx:{d:15,o:-15,h:10},r:"Las palomas se lo hacen todo encima de la primera fila. Don Fernando dice que es «una señal». No aclara de qué."},
 {t:"Desafinar a propósito.",fx:{o:10,h:10,d:-10},r:"El himno suena tan mal que la mitad del público se va. La otra mitad cree que es modernidad."},
 {t:"Soltar las palomas antes de tiempo.",fx:{h:20,o:5},r:"Cien palomas en desbandada dentro de una plaza de toros. El vídeo da la vuelta al mundo con música de película de terror."}]},
{id:"ultra_escandalo",st:[3,4],c:"marta",w:6,cond:()=>F("partido")==="ultra",q:"He descubierto que Patria y Rosario se financia con dinero de Don Mariano y con donativos de cierto club de «senderismo». ¿Algún comentario antes de publicarlo?",opts:[
 {t:"Abandonar el partido en directo.",fx:{o:20,d:-15},set:{partido:"ex",nazifan:0},f:{neonazis:1,mafia:1},r:"Don Fernando te llama traidor. Bruno, también. Don Mariano no dice nada, que es peor."},
 {t:"«Sin comentarios».",fx:{o:-20},r:"Titular: «{name} no lo niega». Tu madre deja de ir a misa por la vergüenza. Y porque el cura la aburre."},
 {t:"Darle a Marta todos los documentos.",fx:{o:25,h:15,s:-10},set:{partido:"ex"},f:{neonazis:1},r:"El partido se hunde. Don Fernando huye a una finca. Marta gana un premio y te lo dedica en voz baja."}]},
{id:"partido_progre",gen:"indie",st:[2,3],c:"iratxe",w:6,cond:()=>!F("partido"),q:"Mareas Unidas por el Cambio Inclusivo y Sostenible necesita tu voz. No pagamos: es un acto de compromiso. Hay hummus.",opts:[
 {t:"Unirme al partido.",fx:{o:10,h:10,d:-10},set:{partido:"progre"},f:{neonazis:1},r:"Te dan una chapa, una bolsa de tela y treinta grupos de WhatsApp. Bruno «El Calvo» te apunta en su lista. Has subido de nivel."},
 {t:"Rechazarlo. Soy demasiado indie para un partido.",fx:{h:5,o:-5},r:"Iratxe asiente: «Lo entiendo. Te apuntamos como simpatizante igualmente». Ya estás en los treinta grupos."},
 {t:"Unirme solo por el hummus.",fx:{s:5,h:5},set:{partido:"progre"},r:"El hummus es de garbanzo de proximidad. Está buenísimo. Te quedas por él. Nadie te pregunta nada más."}]},
{id:"progre_asamblea",st:[3],c:"iratxe",w:6,cond:()=>F("partido")==="progre",q:"Asamblea para decidir el color de la pancarta. Llevamos nueve horas. Hay dos facciones: verde agua y verde menta. Tu voto decide.",opts:[
 {t:"Verde agua.",fx:{o:5,s:-10},r:"La facción menta abandona la asamblea y funda su propio partido. Ya sois siete."},
 {t:"Verde menta.",fx:{o:5,s:-10},r:"La facción agua abandona la asamblea y funda su propio partido. Ya sois siete."},
 {t:"Propongo un color que no sea ninguno de los dos.",fx:{h:15,o:10},r:"Ovación cerrada. Se vota a las cinco de la mañana. La pancarta acaba siendo transparente. Nadie la ve, pero todos la apoyan."}]},
{id:"progre_escision",st:[3,4],c:"iratxe",w:6,cond:()=>F("partido")==="progre",q:"El partido se ha dividido en Mareas Unidas, Mareas Más Unidas y Mareas Unidas de Verdad. Las tres quieren que seas su cabeza de cartel.",opts:[
 {t:"Fundar mi propia marea.",fx:{h:20,o:-10},r:"«Marea {name}» saca un concejal. Eres tú. Descubres que los plenos duran más que tus solos."},
 {t:"Dejar la política y volver a la música.",fx:{o:10,s:10,h:-5},set:{partido:"ex"},r:"Te despides con una canción acústica sobre la sostenibilidad, grabada con un micrófono de bambú."},
 {t:"Juntarlas en un concierto.",fx:{o:20,h:15,s:-10},r:"Tres mareas, un escenario, cero acuerdos. Pero se abrazan durante tu estribillo. Dura cuatro minutos. Es un récord."}]},
{id:"partido_indep",gen:"punk",st:[2,3],c:"xabi",w:6,cond:()=>!F("partido"),q:"El Valle de Abajo será libre. Tiene tres mil habitantes, una gasolinera y un bar. Pero será libre. Necesitamos un himno, y tú gritas muy bien.",opts:[
 {t:"Unirme a la causa.",fx:{h:20,o:-10},set:{partido:"indep"},f:{policia:1},r:"Compones el himno en diez minutos: tres acordes y la palabra «libertad» gritada cuarenta veces. Es perfecto."},
 {t:"Rechazarlo. Yo no creo ni en los valles.",fx:{o:5},r:"Xabi te declara «enemig[o|a] del pueblo». El pueblo, que son tres mil personas, no se entera."},
 {t:"Unirme si el valle se llama como yo.",fx:{h:15,o:-5},set:{partido:"indep"},r:"Votación exprés: el Valle de Abajo pasa a llamarse Valle de {name}. La gasolinera cambia el cartel."}]},
{id:"indep_declaracion",st:[3],c:"xabi",w:6,cond:()=>F("partido")==="indep",q:"Mañana, en tu concierto, declaramos la independencia. Desde el escenario. Ya están avisadas la policía y la gasolinera.",opts:[
 {t:"Declararla a gritos.",fx:{h:25,o:-10},f:{policia:1},r:"El Valle es independiente durante ocho segundos. Luego llega la policía. Tú sigues cantando desde el furgón."},
 {t:"Declararla, pero bajito.",fx:{o:5,h:5},r:"Solo te oye la primera fila. Votan a mano alzada. Gana el «sí» por cuatro votos y un perro."},
 {t:"Sabotearla cantando el himno del pueblo de al lado.",fx:{h:15,o:-15},set:{partido:"ex"},r:"Xabi te persigue con una pancarta. El pueblo de al lado te nombra hij[o|a] predilect[o|a]."}]},
{id:"indep_exilio",st:[3,4],c:"comisario",w:6,cond:()=>F("partido")==="indep",q:"Tengo una orden contra el gobierno del Valle de Abajo. Y tú sales como «ministr[o|a] de Cultura y Gritos».",opts:[
 {t:"Exiliarme en una casa rural.",fx:{h:15,s:10,d:-15},set:{partido:"ex"},r:"Te escondes en una casa rural a cuarenta kilómetros. Tiene jacuzzi. El exilio no está tan mal."},
 {t:"Entregarme y dar un concierto en el juzgado.",fx:{o:15,h:20,s:-10},set:{policia:0},r:"El juez marca el ritmo con el mazo. Te pone una multa y te pide la camiseta."},
 {t:"Echarle la culpa de todo a Xabi.",fx:{o:-15,s:5},set:{partido:"ex"},r:"Xabi va a juicio. Tú vas de público. Te mira con ojos de himno traicionado."}]},
{id:"partido_mode",gen:"rock",st:[2,3],c:"gonzalo",w:6,cond:()=>!F("partido"),q:"Centro Sensato: ni de izquierdas ni de derechas, sino de lo que diga la encuesta. Queremos a un rockero que tranquilice a los votantes de cincuenta años.",opts:[
 {t:"Unirme al partido.",fx:{d:15,o:5,h:-10},set:{partido:"mode"},r:"Te hacen cortar el pelo «un poquito». Te miras al espejo y ves a tu cuñado."},
 {t:"Rechazarlo. El rock no se modera.",fx:{h:10,o:-5},r:"Don Gonzalo sonríe con una sonrisa perfectamente centrada: «Le esperamos en la próxima encuesta»."},
 {t:"Unirme, pero con la chupa de cuero.",fx:{h:10,o:5},set:{partido:"mode"},r:"La chupa de cuero sube tres puntos en las encuestas. Don Gonzalo se compra otra. Le queda fatal."}]},
{id:"mode_debate",st:[3],c:"gonzalo",w:6,cond:()=>F("partido")==="mode",q:"Debate televisado contra los otros partidos. Consejo del asesor: no digas nada que se pueda entender.",opts:[
 {t:"Seguir el consejo.",fx:{o:10,h:-10},r:"Hablas veinte minutos sin decir nada. Los analistas te dan como ganador. Nadie sabe por qué."},
 {t:"Hacer un solo de guitarra en mitad del debate.",fx:{h:25,o:-5},r:"El moderador intenta cortarte y no puede. Es el debate más visto de la historia."},
 {t:"Proponer cerrar los bares a las diez.",fx:{o:-25,h:10},r:"Manolo te retira el saludo. El Tito, la palabra. Pierdes el voto de todo tu barrio en una sola frase."}]},
{id:"mode_ministerio",st:[3,4],c:"gonzalo",w:6,cond:()=>F("partido")==="mode",q:"Hemos sacado un escaño. Te ofrecemos la consejería de Cultura de una comunidad muy pequeña. Muy, muy pequeña.",opts:[
 {t:"Aceptar el cargo.",fx:{d:20,o:5,h:-10},r:"Tu primera medida es declarar el rock de los 70 patrimonio inmaterial. La segunda, irte de vacaciones."},
 {t:"Rechazarlo y volver a la carretera.",fx:{h:15,o:5},set:{partido:"ex"},r:"Dejas el partido con un portazo que suena en Sol mayor. Don Gonzalo lo apunta: «Sol mayor: centrado»."},
 {t:"Aceptarlo y celebrar los plenos en el bar.",fx:{h:15,o:10},f:{alcohol:1},r:"Los plenos en el Bar Pepe son los más productivos de la historia. Y los más largos."}]},

/* ---------- ¿Dónde comes hoy? ---------- */
{id:"comida_rep",rep:1,st:[1,2],c:"fermin",q:"¿Hoy dónde comes? Te lo pregunto porque trabajo en los tres sitios: la hamburguesería, el restaurante fino y la tienda de abajo de tu casa.",opts:[
 {t:"Hamburguesa triple con extra de todo.",fx:{h:3,s:-8,d:-2},r:"Te sienta como un ladrillo con queso. Feliz diez minutos, arrepentid[o|a] dos días."},
 {t:"Restaurante fino, menú degustación.",fx:{d:-15,h:8,s:3},r:"Diecisiete platos. Cada uno cabe en una uña. Sales con hambre y 150 € menos. Pero subes foto."},
 {t:"En casa: arroz con lo que haya.",fx:{s:8,h:-4,d:3},r:"Lo que había era un huevo y media cebolla. Te sale rico. Nadie lo sabrá nunca."}]},
{id:"cena_rep",rep:1,st:[3,4],c:"chef",q:"Esta noche te propongo mi menú «Deconstrucción del ser»: treinta y dos pases, aire de croqueta y lágrima de esturión triste.",opts:[
 {t:"Aceptar el menú del chef.",fx:{d:-20,h:10,o:3},r:"La lágrima de esturión sabe a lágrima. El aire de croqueta, a aire. Pagas 900 €. Cenas después en el burger de enfrente."},
 {t:"Escaparme a un burger de incógnito.",fx:{s:-8,h:8,o:5},r:"Te reconocen pese al bigote falso. Foto viral: «La estrella y la hamburguesa». La gente te quiere más."},
 {t:"Cenar en casa de mi madre.",fx:{s:10,o:5,h:-5},r:"Tres platos, postre y la pregunta de siempre: «¿Por qué estás tan delgad[o|a]?». Engordas dos kilos. Felicidad."}]},
{id:"kebab",st:[1,2,3],c:"fermin",w:2,q:"Son las cuatro de la mañana. Solo queda abierto el kebab de la esquina. Yo también trabajo ahí, no preguntes.",opts:[
 {t:"Durum mixto con todas las salsas.",fx:{h:5,s:-10,o:3},r:"La salsa picante te persigue hasta el mediodía siguiente. Pero a las cuatro de la mañana era lo mejor de tu vida."},
 {t:"Irme a dormir con hambre.",fx:{s:5,h:-3},r:"Sueñas con un kebab gigante que canta tus canciones. Mejor que tú."},
 {t:"Subirme al mostrador a cantar.",fx:{h:15,o:-5,s:-5},r:"Concierto improvisado para seis trasnochadores y un repartidor. Grabado en vertical. Tu mejor directo."}]},

/* ---------- El encapuchado: más encuentros (camino normal) ---------- */
{id:"hood_s1",st:[1],c:"encapuchado",w:5,cond:()=>F("alma")&&!F("diablo"),q:"(El encapuchado está en la última fila del Bar Pepe. Ha pedido un mosto y no se lo bebe). No te fíes de quien te pague en negro. Ni de quien te pague en blanco. Fíate de quien te pague.",opts:[
 {t:"¿Y tú me pagas?",fx:{d:5},r:"Deja una moneda antigua sobre la barra. Manolo la muerde, la mira y te la cambia por un bocadillo."},
 {t:"Invitarle al mosto.",fx:{o:3,s:3},r:"Brindáis. Él no se quita la capucha para beber. No sabes cómo lo hace, pero el vaso se vacía."},
 {t:"Pedirle un consejo de verdad.",fx:{h:3},r:()=>"Se inclina sobre la barra y te susurra al oído: "+consejo(1)+" Cuando te giras, solo queda el mosto. Lleno."}]},
{id:"hood_s2a",st:[2],c:"encapuchado",w:5,cond:()=>F("alma")&&!F("diablo"),q:"(En la cola de tu primera firma de discos hay una capucha. Cuando le toca, no trae disco). Si un día un señor con cuernos te ofrece un trato, di que no. Aunque te prometa la luna. Sobre todo si te promete la luna.",opts:[
 {t:"¿Un señor con cuernos? ¿Mi cuñado?",fx:{h:5},r:"«Ojalá», dice. Y por primera vez le oyes reír. Tiene una risa que te suena muchísimo."},
 {t:"Prometido.",fx:{o:5,s:3},r:"Te da la mano. Está fría y tiene tus mismos callos de guitarra. Se va sin el autógrafo."},
 {t:"Firmarle el brazo, ya que estás.",fx:{h:8,o:-3},r:"Se remanga. Ya tiene tu firma tatuada. La misma. Con la misma falta de ortografía."}]},
{id:"hood_s2b",st:[2],c:"encapuchado",w:4,cond:()=>F("alma")&&!F("diablo"),q:"(Paco Exclusiva te acorrala a la salida de un hotel. De pronto, una capucha se pone en medio y le tapa el objetivo). Corre. Yo me encargo. Y mañana no salgas en chándal: te queda fatal.",opts:[
 {t:"Correr.",fx:{s:-3,o:5},r:"Escapas. Al día siguiente Paco publica la foto: una capucha negra a contraluz. Titular: «¿Nuevo romance?»."},
 {t:"Quedarme a ver qué hace.",fx:{h:8},r:"El encapuchado le cuenta algo al oído a Paco. Paco se pone blanco, guarda la cámara y se va a misa."},
 {t:"Posar igualmente.",fx:{h:10,o:-5},r:"Sales en portada con una capucha negra a tu lado. Parece que tengas una sombra con mánager."}]},
{id:"hood_s3b",st:[3],c:"encapuchado",w:5,cond:()=>F("alma")&&!F("diablo"),q:"(El encapuchado está sentado en tu trono de la mansión, como si fuera suyo. Ambrosio le ha servido un té). Kira Star no es tu enemiga. Tu enemig[o|a] eres tú a las cuatro de la mañana.",opts:[
 {t:"¿Y qué hago a las cuatro de la mañana?",fx:{s:10},r:"«Dormir», contesta. Es el consejo más revolucionario que te han dado en años."},
 {t:"Llamar a Kira para hacer las paces.",fx:{o:10,h:-5},r:"Kira cuelga. Vuelve a llamar. Cuelga otra vez. A la cuarta, habláis tres horas. Os odiáis un poco menos."},
 {t:"Pedirle que se baje la capucha.",fx:{h:5},r:"«Todavía no», dice. «Cuando estés preparad[o|a]». Ambrosio recoge la taza. Juraría que estaba llena."}]},
{id:"hood_s4b",st:[4],c:"encapuchado",w:8,cond:()=>F("alma")&&!F("diablo")&&S.used.has("hood3"),q:"(Tu yo viej[o|a] te espera en el banco del parque donde empezó todo, con un helado de fresa en la mano). Ya casi estás. Cuando cantes la última nota, yo dejaré de existir. Es lo justo: tú no cometerás mis errores.",opts:[
 {t:"Entonces no quiero acabar.",fx:{o:5,s:5},r:"«Claro que quieres», sonríe. «Yo también quise». Te da el helado. Se derrite más despacio de lo normal."},
 {t:"Gracias por todo.",fx:{o:8},r:"Te abraza. Huele a incienso, a gasolina y a fresa. Cuando abres los ojos, en el banco solo queda una pluma blanca."},
 {t:"¿Un último consejo?",fx:{h:5},r:()=>"Lo piensa mucho. Luego te dice: "+consejo(1)+" Y se ríe con tus mismos dientes torcidos."}]},

/* ---------- El encapuchado en el camino del diablo ---------- */
{id:"hood_diablo1",st:[2,3],c:"encapuchado",w:7,cond:()=>F("diablo")&&!F("hood_dead"),q:"(El encapuchado te espera en la oscuridad del backstage. Huele a incienso, a gasolina… y ahora también a azufre). Sé lo que has firmado. Yo también lo firmé una vez. No sigas por ese camino: al final del pacto no hay leyenda, solo silencio.",opts:[
 {t:"Ya es tarde.",fx:{s:-5,h:5},r:"«Nunca es tarde para no empeorar», dice. Se va arrastrando los pies. Juras que cojea igual que tú."},
 {t:"¿Y si rompo el contrato?",fx:{o:3},r:"«Ese contrato no se rompe. Lo intenté con los dientes». Sonríe. Tiene una dentadura sospechosamente parecida a la tuya."},
 {t:"Apártate de mi camino.",fx:{h:8,o:-5},r:"Se aparta. Pero le oyes susurrar: «Ya me apartaste una vez. Así acabó todo»."}]},
{id:"hood_diablo2",st:[3,4],c:"encapuchado",w:7,cond:()=>F("diablo")&&!F("hood_dead")&&S.used.has("hood_diablo1"),q:"(La capucha aparece en el reflejo del espejo de tu camerino, detrás de ti. Cuando te giras, no hay nadie). Te lo pido por favor. Por mamá, por Chema, por el niño de los helados. El mundo no tiene la culpa de que quisieras un sofá en el infierno.",opts:[
 {t:"El sofá es muy cómodo.",fx:{h:5,o:-3},r:"El espejo se empaña. Alguien escribe con el dedo: «QUEMA». No sabes si es una advertencia o una reseña del sofá."},
 {t:"Lo siento. De verdad.",fx:{o:5,s:-3},r:"«Ya lo sé», dice el reflejo. «Yo también lo sentí». El espejo se raja de arriba abajo."},
 {t:"Tapar el espejo con una toalla.",fx:{s:3},r:"Funciona. Durante diez minutos. Luego la toalla aparece doblada encima de la silla. Con una pluma negra."}]},
{id:"diablo_mata",chain:1,st:[4],c:"diablo",q:"(El Diablo de los Acordes te tiende una púa negra que todavía humea). Ha llegado la hora del primer detallito del contrato, socio. El encapuchado te espera en la azotea del estadio. Sube y cumple.",opts:[
 {t:"Subir a la azotea.",next:"diablo_mata2",r:"Subes los escalones de dos en dos. Cada uno está un grado más caliente que el anterior."},
 {t:"¿No podemos negociarlo?",next:"diablo_mata2",r:"«Lo negociamos cuando firmaste. Tú no leíste la letra pequeña; yo la escribí». Te empuja escaleras arriba."},
 {t:"Subir… despacio.",next:"diablo_mata2",r:"Subes tan despacio como puedes. La azotea te espera igual. Las azoteas son muy pacientes."}]},
{id:"diablo_mata2",chain:1,st:[4],c:"encapuchado",q:"(En la azotea, el encapuchado se baja por fin la capucha. Debajo estás tú, treinta años más viej[o|a]). Lo sabía. Yo también subí a esta azotea, con esa misma púa. Si me borras, nadie volverá del futuro para avisarte. No quedará nadie que pueda salvarte. Ni a ti ni al mundo.",opts:[
 {t:"Cumplir el pacto.",fx:{h:15,o:-10},set:{hood_dead:1},r:"Tocas un acorde con la púa negra. Tu yo viej[o|a] se deshace como el humo de un pitillo. En el suelo queda una pluma. Ya no es blanca."},
 {t:"Pedirme perdón… y cumplirlo.",fx:{h:10,o:-5,s:-5},set:{hood_dead:1},r:"«Te perdono», dice. «Yo tampoco supe parar». Tocas el acorde. Se desvanece sonriendo con tus dientes torcidos. Abajo, el Diablo aplaude."},
 {t:"Cerrar los ojos y tocar.",fx:{h:12,s:-8},set:{hood_dead:1},r:"No miras. Solo oyes el acorde, un suspiro y el viento. Cuando abres los ojos, estás sol[o|a] en la azotea. Para siempre."}]},
{id:"diablo_final",chain:1,st:[4],c:"diablo",q:"Último acorde, {name}. Eres leyenda… en mi idioma. Solo falta el detallito final: todo pacto se firma con la vida del firmante. Borraste a tu yo del futuro; ahora te toca borrarte a ti. A las matemáticas del universo esto les va a sentar fatal.",opts:[
 {t:"Tocar el último acorde.",end:"universo",r:"Tocas. La nota se queda flotando, sin final. El público contiene el aliento. Y ya no lo suelta."},
 {t:"Mirar al público por última vez.",end:"universo",r:"Sesenta mil caras. Entre ellas, la de tu madre. Te sonríe sin saber nada. Se te cae la púa."},
 {t:"Preguntar si en el infierno hay catering.",end:"universo",r:"«Había», suspira el Diablo. «Ahora va a dejar de haber de todo». Chasquea los dedos."}]},

/* ---------- El Diablo de los Acordes: la oferta ---------- */
{id:"diablo_oferta",st:[2,3],c:"diablo",w:4,cond:()=>!F("diablo")&&F("alma"),q:"(Tu camerino huele de repente a azufre y a pelo quemado. Un señor con cuernos afina tu guitarra sin pedir permiso). Te propongo un trato, artista: cuando mueras, resucitarás conmigo, abajo, y no con el pesado de San Pedro. Fama sin techo. A cambio, dos detallitos: el mundo se destruye y tú te cargas al encapuchado. Ah, y no hay vuelta atrás.",opts:[
 {t:"Trato hecho. Que arda todo.",fx:{h:20,d:15},set:{diablo:1,alma:1},ck:"El pacto",r:"Firmas con una púa mojada en algo que no es tinta. El contrato se enciende solo. Desde hoy, cuando mueras, bajarás en vez de subir. Notas un calorcito en los pies. No se va."},
 {t:"Ni hablar. Mi madre me educó bien.",fx:{o:5},r:"El Diablo se ríe. «Tu madre me debe dos favores». Desaparece dejando la guitarra perfectamente afinada. Es lo que más rabia te da."},
 {t:"¿Me lo puedo pensar?",fx:{h:3},set:{diablo_dudas:1},r:"«Claro. La oferta caduca cuando a mí me dé la gana». Se va silbando tu canción. Mejor que tú."}]},
{id:"diablo_oferta2",st:[3],c:"diablo",w:6,cond:()=>!F("diablo")&&F("diablo_dudas"),q:"¿Lo has pensado ya? Te he traído el contrato en papel reciclado, que ahora en el infierno somos muy sostenibles. Mismas condiciones: resurrección en mi casa, fama sin techo, el mundo destruido y el encapuchado fuera de la ecuación.",opts:[
 {t:"Firmo.",fx:{h:20,d:15},set:{diablo:1,alma:1},ck:"El pacto",r:"El papel reciclado arde igual de bien. Desde hoy, cuando mueras, bajarás. Y el suelo de tu casa siempre estará un pelín caliente."},
 {t:"No. Y es mi última palabra.",fx:{o:8,s:3},set:{diablo_dudas:0},r:"«Eso dicen todos», murmura. Pero se va. Y por primera vez en semanas duermes sin oler a azufre."},
 {t:"Firmar con el nombre de mi cuñado.",fx:{h:10,o:-3},set:{diablo_dudas:0},r:"El Diablo lee la firma, se ríe a carcajadas y se guarda el contrato. «A ese ya lo tenía». Se va encantado."}]},

/* ---------- En el infierno (solo con el pacto) ---------- */
{id:"infierno_bienvenida",chain:1,st:[1,2,3,4],c:"diablo",q:"¡Bienvenid[o|a] a casa, socio! Aquí abajo nadie se muere del todo: es malo para el negocio. Te devuelvo arriba. Recuerda el trato: el mundo, el encapuchado y, al final, un detallito sin importancia.",opts:[
 {t:"¿Qué detallito?",r:"«Ya lo verás. Las sorpresas son lo mejor del infierno». Te empuja por un tobogán de lava templada."},
 {t:"Aquí hace mucho calor.",r:"«Es un calor seco», dice, como todos los que viven en sitios horribles. Abres los ojos arriba, sudando."},
 {t:"¿Está San Pedro enfadado?",r:"«Me ha mandado un fax. Le he contestado con otro fax. Ardiendo». Se ríe tanto que se le caen los cuernos. Se los vuelve a poner."}]},
{id:"infierno_karaoke",chain:1,st:[1,2,3,4],c:"diablo",q:"Ya que estás aquí, pasa por el karaoke. Tenemos a todos los grandes. Bueno, a los que firmaron. Esta noche cantan tus canciones. Con mejor afinación.",opts:[
 {t:"Cantar con ellos.",r:"Haces un dueto con alguien muy famoso que no puedes nombrar por motivos legales. Abajo te aplauden. Arriba te despiertas tarareando."},
 {t:"Negarme.",r:"«Como quieras». Pone tu disco de 2019 en bucle. Es el peor castigo del infierno. Lo reservan para los traidores."},
 {t:"Pedir los derechos de autor.",r:"«Te pagaremos en almas». Te da un recibo que arde. Bajas… digo, subes, con quemaduras en los dedos."}]},
{id:"infierno_contrato",chain:1,st:[1,2,3,4],c:"diablo",q:"He estado releyendo tu contrato. Es precioso. Tiene una cláusula que me encanta: la de «cuando acabe la gira». Te quiero fresc[o|a] para ese día.",opts:[
 {t:"¿Qué pasa cuando acabe la gira?",r:"«Que el universo deja de tener gira. Y de tener universo». Tararea algo. Te suena a tu última canción."},
 {t:"Quiero hablar con mi abogada.",r:"«La Abogada Herrera ya trabaja para mí. Cobra por minuto aquí también, y aquí los minutos son eternos»."},
 {t:"Volver arriba cuanto antes.",r:"«Así me gusta: prisa por cumplir». Abres los ojos arriba con olor a chamusquina en el pelo."}]},
{id:"infierno_encapuchado",chain:1,st:[1,2,3,4],c:"diablo",q:"El encapuchado ha intentado bajar a buscarte. Le he cerrado la puerta en las narices. Bueno, en la capucha. Ese tipo me pone nervioso: se parece demasiado a alguien.",opts:[
 {t:"¿A quién?",r:"El Diablo te mira un buen rato. «A alguien que pierde siempre». Sonríe con demasiados dientes."},
 {t:"Déjale en paz.",r:"«No puedo. Es parte del trato, ¿recuerdas? Tú, él y una azotea». Te despide con una palmada que quema."},
 {t:"¿Le tienes miedo?",r:"Se ríe muy alto y muy poco rato. Luego cambia de tema y te manda arriba. Sí: le tiene miedo."}]},
{id:"infierno_kira",chain:1,st:[1,2,3,4],c:"diablo",q:"Te voy a contar un secreto: Kira Star también vino a verme. Le dije que no. No por bondad: es que canta tan mal que me espanta a los clientes.",opts:[
 {t:"¡Lo sabía!",r:"«No lo sabías. Pero ahora tienes algo que contar en las entrevistas». Te devuelve arriba de un capirotazo."},
 {t:"¿Y por qué yo sí?",r:"«Porque tú desafinas con intención. Eso es arte». No sabes si es un piropo. Viniendo de él, seguro que no."},
 {t:"¿Me guardas su ficha?",r:"Te da una fotocopia. Arde antes de llegar arriba. Solo se salva una línea: «Bótox: 2014-actualidad»."}]},

/* ---------- El asesor: inversiones del primer éxito ---------- */
{id:"asesor",chain:1,inv:1,st:[2,3,4],c:"asesor",q:"Enhorabuena por el éxito, {name}. Ahora que entra dinero, hay que ponerlo a trabajar. Tú pones el capital y yo pongo el riesgo. Bueno, el riesgo también lo pones tú. ¿Cuánto metemos?",opts:[
 {t:"10 💰, para empezar.",fx:{d:-10},raw:1,set:{inv_amt:10},next:"asesor2",r:"«Prudente. Me gusta. Los prudentes pagan comisión igual»."},
 {t:"25 💰. A lo grande.",fx:{d:-25},raw:1,set:{inv_amt:25},next:"asesor2",r:"Se le iluminan los ojos. Literalmente: le brilla un símbolo de euro en cada pupila."},
 {t:"No me fío de ti.",fx:{o:3},r:"Te deja su tarjeta: «Gestión Patrimonial Rentabilidad & Hijos». Hijos no tiene. Patrimonio, tampoco."}]},
{id:"asesor2",chain:1,inv:1,st:[2,3,4],c:"asesor",q:"Tengo tres productos. Todos tienen futuro, y uno de ellos incluso presente. Lo que valgan dependerá de lo que hagas a partir de ahora, así que elige con el corazón, que la cabeza ya veo que no la usas.",opts:[
 {t:"El Fondo {name}: sube y baja con mi fama.",run:()=>invertir("marca"),r:"Firmas. El fondo lleva tu cara en el logo. Si tu fama sube, sube. Si te hundes, te hundes dos veces."},
 {t:"$MELÓN, la cripto de Brayan: una montaña rusa.",run:()=>invertir("cripto"),r:"Brayan te manda un audio de cuatro minutos gritando «¡A LA LUNA, BRO!». Te da un poco de miedo. Y un poco de ilusión."},
 {t:"Ladrillo de Don Mariano: sube despacito… si no hay escándalos.",run:()=>invertir("ladrillo"),r:"El asesor baja la voz: «Mientras no te metas en líos con Hacienda, la policía o la mafia, esto solo sube». Lo dice mirando a Don Mariano."}]},
{id:"asesor_venta",rep:1,w:6,inv:1,st:[2,3,4],c:"asesor",cond:()=>S.inv&&!S.inv.sold&&S.turn-S.inv.t>=6&&S.turn-(S.inv.ask||0)>=8,
 q:()=>`Tu inversión en ${INV[S.inv.p].n} vale ahora ${Math.round(S.inv.val)} 💰 (pusiste ${S.inv.amt}). ${S.inv.val>=S.inv.amt?"Vas ganando. De momento.":"Vas perdiendo, pero eso es lo que dicen los perdedores justo antes de ganar."} ¿Vendemos?`,opts:[
 {t:()=>`Vender todo (+${Math.round(S.inv.val)} 💰).`,fx:()=>({d:Math.round(S.inv.val)}),raw:1,run:()=>{S.inv.got=(S.inv.got||0)+Math.round(S.inv.val);S.inv.val=0;S.inv.sold=1;},r:()=>S.inv.got>=S.inv.amt0?"Vendes. El asesor se queda su comisión y te da una palmadita en la espalda. Es la palmadita más cara de tu vida, pero has ganado.":"Vendes. Has perdido dinero, pero el asesor te asegura que es «una pérdida estratégica». Te cobra la comisión igualmente."},
 {t:"Aguantar. Esto va a subir.",run:()=>{S.inv.ask=S.turn;},fx:{h:2},r:"«Esa es la actitud», dice, apuntándote en una libreta bajo el título «Clientes con fe»."},
 {t:()=>`Vender la mitad (+${Math.round(S.inv.val/2)} 💰).`,fx:()=>({d:Math.round(S.inv.val/2)}),raw:1,run:()=>{const m=Math.round(S.inv.val/2);S.inv.got=(S.inv.got||0)+m;S.inv.val-=m;S.inv.amt=Math.round(S.inv.amt/2);S.inv.ask=S.turn;},r:"Ni para ti ni para mí. El asesor lo llama «diversificar». Tú lo llamas «no tener ni idea». Ambos tenéis razón."}]},
{id:"asesor_ultima",chain:1,inv:1,st:[4],c:"asesor",q:()=>`Me jubilo en las Caimán, {name}. Antes de irme, cierro carteras: tu inversión en ${INV[S.inv.p].n} vale ${Math.round(S.inv.val)} 💰. Si no la vendes ahora, se queda en un cajón. Y los cajones de las Caimán no se abren.`,opts:[
 {t:()=>`Vender (+${Math.round(S.inv.val)} 💰).`,fx:()=>({d:Math.round(S.inv.val)}),raw:1,run:()=>{S.inv.got=(S.inv.got||0)+Math.round(S.inv.val);S.inv.val=0;S.inv.sold=1;},r:"Te transfiere el dinero desde un móvil con funda de flamencos. Se despide con un «nos vemos en otra vida». Te da un escalofrío."},
 {t:"Regalársela a mi madre.",fx:{o:10},run:()=>{S.inv.val=0;S.inv.sold=1;S.inv.gift=1;},r:"Tu madre no entiende qué le has regalado, pero lo enmarca. Al lado del táper."},
 {t:"Que se la quede él, por las molestias.",fx:{o:-3,h:5},run:()=>{S.inv.val=0;S.inv.sold=1;},r:"Llora de emoción. Es la primera vez que un cliente le da algo sin que él se lo quite primero."}]},

/* ---------- El Hada Madrina de los Compases ---------- */
{id:"hada",rep:1,w:6,st:[1,2,3,4],c:"hada",cond:()=>S.turn-(S.hadaT??-99)>=8,
 q:()=>F("hada_ok")?`(Suena un arpegio de la nada. El Hada Madrina de los Compases flota otra vez a medio metro del suelo). ¿Otro ritual? Diez de salud y te susurro lo que viene. Llevas ${F("hada_ok")}. ${F("hada_ok")%3===2?"Uno más y te regalo un billete de vuelta.":"A la tercera de cada tres, billete de vuelta."}`:"(Suena un arpegio de la nada. Una señora con alas de purpurina y un diapasón por varita flota a medio metro del suelo). Soy el Hada Madrina de los Compases. Conozco la partitura de tu vida, pero no la recito gratis: un ritual, diez de salud, y te susurro lo que viene. Si aceptas tres veces, te regalo un billete de vuelta.",opts:[
 {t:"Hacer el ritual (−10 ❤️).",fx:{s:-10},raw:1,run:()=>ritualHada()},
 {t:"No, gracias. Prefiero equivocarme sol[o|a].",run:()=>{S.hadaT=S.turn;},r:"Se encoge de hombros. «Como todos los grandes. Y como todos los muertos». Desaparece en un acorde menor."},
 {t:"¿Por qué «de los compases»?",fx:{o:2},run:()=>{S.hadaT=S.turn;},r:"«Porque la vida va en cuatro por cuatro y tú siempre entras a destiempo». Se va antes de que puedas preguntar nada más. Muy suyo."}]},

/* ---------- En el cielo: San Pedro (un diálogo distinto en cada muerte) ---------- */
{id:"pedro_mision",chain:1,st:[1,2,3,4],c:"pedro",q:"Así que tú eres {name}. Escucha bien, que solo lo diré una vez. El mundo va a ser destruido. No sé cuándo ni cómo: la profecía tiene una letra horrible. Solo sé que se salvará si llegas a ser una leyenda. Por eso no puedes morirte. Bueno, puedes, pero yo te devolveré. Una y otra vez.",opts:[
